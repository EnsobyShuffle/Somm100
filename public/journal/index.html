function normalise(note){
 const copy=JSON.parse(JSON.stringify(note));copy.fields??={};copy.score??={};copy.prices??={};copy.photo??=[];
 copy.producer??='';copy.wine??='';copy.grape??='';copy.region??='';copy.vintage??='';copy.wineType??='';copy.revealed??=!copy.blind;
 copy.id??=freshId();copy.createdAt??=today();copy.updatedAt??=copy.createdAt;
 for(const phase of ['nose','palate']){
  const f=copy.fields,earthKeys=[`${phase}Non:Earth & Mineral`,`${phase}Non:Mineral`,`${phase}Non:Earth & Organic`];
  const merged=[...new Set(earthKeys.flatMap(k=>Array.isArray(f[k])?f[k]:[]))];
  if(merged.length)f[earthKeys[0]]=merged;
  delete f[earthKeys[1]];delete f[earthKeys[2]];
  const oldOther=`${phase}Non:Other Markers`,newOther=`${phase}Other:Other Markers`;
  if(Array.isArray(f[oldOther]))f[newOther]=[...new Set([...(Array.isArray(f[newOther])?f[newOther]:[]),...f[oldOther]])];
  delete f[oldOther];
 }
 return copy;
}

async function storeNote(n){

 if(db)return new Promise((res,rej)=>{const tx=db.transaction('notes','readwrite');tx.objectStore('notes').put(obj);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});
 let arr;
 try{arr=storageMode==='session'?volatileNotes.slice():JSON.parse(localStorage.getItem('wtj_notes')||'[]')}catch(e){storageMode='session';arr=volatileNotes.slice()}

 if(storageMode!=='session'){try{localStorage.setItem('wtj_notes',JSON.stringify(arr));return}catch(e){storageMode='session'}}

}
async function deleteNote(id){

 return `${STRUCTURE.filter(([,k])=>filled(val(k))).length}/5`}
function renderPanel(key,title){const opened=ui.panels.has(key);return `<section class="section ${opened?'expanded':''}" id="section-${key}"><button class="section-head" type="button" data-panel="${key}" aria-expanded="${opened}"><span class="section-name">${esc(title)}</span><span class="chevron">⌄</span></button>${opened?`<div class="section-body">${bodyFor(key)}</div>`:''}</section>`}
function renderPhotos(){if(!current.photo.length)return '';return `<div class="photo-grid">${current.photo.map((src,i)=>`<div class="photo-thumb"><img src="${src}" alt="Wine Photo ${i+1}"><button type="button" data-remove-photo="${i}" aria-label="Remove Photo">×</button></div>`).join('')}</div>`}
function renderPhotoTile(){return `<div class="photo-tile"><div class="photo-symbol">▣</div><div><div class="photo-title">Photo</div><small>${current.photo.length?current.photo.length+' Added':'Wine Label / Bottle'}</small></div><button type="button" data-photo="1">${current.photo.length?'+ Add':'Add Photo'}</button></div>${renderPhotos()}`}
function renderIdentity(){return `<div class="detail-box"><button class="detail-toggle" type="button" data-detail="1" aria-expanded="${ui.detailsOpen}"><strong>Wine Details</strong><span class="muted">${esc([current.producer,current.wine].filter(Boolean).join(' ')||'Optional')}</span><span class="chevron">${ui.detailsOpen?'⌃':'⌄'}</span></button>${ui.detailsOpen?`<div class="detail-body"><div class="field-grid">${tfield('producer','Producer','note')}${tfield('wine','Wine / Cuvée','note')}${tfield('vintage','Vintage','note')}${tfield('region','Region / Appellation','note')}${tfield('grape','Grape Variety / Blend','note')}</div></div>`:''}</div>`}
function renderWineType(){return `<div class="wine-type-inline" id="wine-type" role="group" aria-label="Wine Type">${['Sparkling','White','Rosé','Red'].map(type=>`<button type="button" class="wine-type-button ${current.wineType===type?'selected':''}" data-type="${type}" aria-pressed="${current.wineType===type}">${type}</button>`).join('')}</div>`}
function renderReveal(){if(!current.blind)return '';if(!current.revealed)return `<div class="reveal-panel" id="reveal"><strong>Reveal Wine</strong><button type="button" class="primary-button" data-reveal="1">Reveal →</button></div>`;
 return `<div id="reveal">${renderPhotoTile()}${renderIdentity()}</div>`}
function renderRecord(){const mode=current.blind?'Blind Tasting':'Open Tasting';let html=`<div class="record-head"><h2>${mode}</h2><div class="record-meta"><span>${formatDate(current.createdAt)}</span><span>·</span><span class="save-status" id="saveStatus">${storageMode==='session'?'Session Only':'Saved Locally'}</span></div></div>`;
 if(!current.blind)html+=renderPhotoTile();
 html+=renderWineType();if(!current.blind)html+=renderIdentity();
 html+=`<div class="sections">${PANELS.map(([key,title])=>renderPanel(key,title)).join('')}</div>`;
 html+=renderReveal();
 html+=`<section id="overall-note" class="overall-note"><h3>Overall Tasting Note</h3><p>根据已填写的记录整理草稿，不补充未观察到的风味。你可以继续编辑。</p><button class="outline-button" data-generate-overall="1">${val("overallNote")?"Regenerate from fields":"Generate overall note"}</button><textarea aria-label="Overall Tasting Note" data-textarea="overallNote" rows="8" placeholder="Complete your observations, then generate a note.">${esc(val("overallNote"))}</textarea><button class="outline-button" data-copy-overall="1">Copy overall note</button></section>`;
 html+=`<div class="finish-actions"><button type="button" class="outline-button" data-copy="1">Copy</button><button type="button" class="primary-button" data-save="1">Save</button></div>`;
 if(current.completed)html+=`<button type="button" class="more danger-btn" data-delete-current="1">Delete Tasting</button>`;
 app.innerHTML=html;
}
function renderHome(){let shown=notes;if(searchText)shown=notes.filter(n=>JSON.stringify([n.producer,n.wine,n.region,n.vintage,n.grape,n.wineType,n.fields]).toLowerCase().includes(searchText.toLowerCase()));
 let html=`<div class="home"><h2 class="home-title">Tastings</h2><div class="home-under">${notes.length?notes.length+' Records':''}</div>`;
 if(notes.length>5)html+=`<input id="searchTastings" class="search" type="search" value="${esc(searchText)}" placeholder="Search Tastings" aria-label="Search Tastings">`;
 html+=`<div class="direct-tasting"><button class="primary-button" data-start-mode="open">Open Tasting</button><button class="outline-button" data-start-mode="blind">Blind Tasting</button></div>`;
 if(shown.length){html+=`<div class="home-list">${shown.map(n=>{const t=tally(n),img=n.photo?.[0];return `<button type="button" class="entry" data-open-note="${esc(n.id)}">${img?`<img src="${img}" alt="Wine Photo">`:'<div class="entry-ph">◌</div>'}<span class="entry-main"><strong>${esc(titleFor(n))}</strong><small>${formatDate(n.createdAt)} · ${n.blind?'Blind':'Open'}</small></span>${t.done?`<span class="entry-score">${t.sum}</span>`:'<span class="arrow">›</span>'}</button>`}).join('')}</div>`}else if(notes.length===0)html+='<p class="empty-instruction">Choose Open or Blind to start a tasting.</p>';
 else html+='<div class="home-blank"><p>No Matches</p></div>';

 html+='</div>';app.innerHTML=html
}
function renderSettings(){app.innerHTML=`<div class="settings"><h2>Settings</h2><div class="settings-block"><h3>Cloud Sync</h3><p>${storageMode==='session'?'Browser Storage Unavailable · 当前为临时记录，关闭页面可能丢失，请及时导出备份。':'Not Available Yet · 云同步将在正式版本中提供。当前记录保存在本机浏览器。'}</p><button class="muted-btn" disabled type="button">Coming Later</button></div><div class="settings-block"><h3>Data & Backup</h3><div class="settings-buttons"><button class="outline-button" type="button" data-export="1">Export JSON</button><label class="outline-button" style="cursor:pointer" for="importInput">Import JSON</label><input type="file" id="importInput" accept=".json,application/json"></div><p>Use Export before changing devices or clearing browser data. Same-browser V1.2 records can be reused when storage is available.</p></div><div class="settings-block"><h3>Scoring</h3><p>100-Point OIV/UIOE legacy judging scale based on your competition sheet. Kept separate from CMS deductive tasting. Still Wine and Sparkling Wine use different score distributions.</p></div><p style="font-size:11px;color:#a1ac9b;margin:24px 0">Wine Tasting Journal · V1.4</p></div>`}
function renderHeader(){if(screen==='home')head.innerHTML=`<div class="head-left"><div class="wordmark">Wine Tasting Journal</div></div><div class="head-right"><button type="button" class="icon-btn" data-go-settings="1" aria-label="Settings" title="Settings">⚙</button></div>`;
 else if(screen==='settings')head.innerHTML=`<div class="head-left"><button type="button" class="icon-btn back-btn" data-back="1" aria-label="Back">‹</button><div class="wordmark">Wine Tasting Journal</div></div>`;
 else head.innerHTML=`<div class="head-left"><button type="button" class="icon-btn back-btn" data-back="1" aria-label="Back">‹</button><div class="wordmark">Wine Tasting Journal</div></div><div class="head-right"><span class="tiny-label" id="headerMode">${current.blind?'BLIND':'OPEN'}</span></div>`;
}
function render(){renderHeader();if(screen==='home')renderHome();else if(screen==='settings')renderSettings();else renderRecord();renderModal()}
function rerender(anchorId=''){const before=anchorId?document.getElementById(anchorId)?.getBoundingClientRect().top:null;const oldY=window.scrollY;render();if(before!=null&&anchorId){const newTop=document.getElementById(anchorId)?.getBoundingClientRect().top;if(newTop!=null)window.scrollBy(0,newTop-before);else window.scrollTo(0,oldY)}else window.scrollTo(0,oldY)}
function closeModal(){modal=null;modalRoot.innerHTML=''}
function showModal(name){modal=name;renderModal()}
function renderModal(){if(!modal){modalRoot.innerHTML='';return}let title='',body='';if(modal==='mode'){title='Add Tasting Note';body=`<button type="button" class="sheet-choice" data-start-mode="open"><span><strong>Open Tasting</strong></span><span class="arrow">›</span></button><button type="button" class="sheet-choice" data-start-mode="blind"><span><strong>Blind Tasting</strong></span><span class="arrow">›</span></button>`}
 if(modal==='photo'){title='Add Photo';body=`<button class="sheet-choice" type="button" data-photo-action="camera"><span><strong>Take Photo</strong><small>Camera</small></span><span class="arrow">›</span></button><button class="sheet-choice" type="button" data-photo-action="image"><span><strong>Choose Image</strong><small>Upload Image</small></span><span class="arrow">›</span></button>`}
 modalRoot.innerHTML=`<div class="overlay" data-dismiss="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body}<button type="button" class="sheet-close" data-close-modal="1">Cancel</button></div></div>`}
function copyNose(){
 let count=0;
 for(const [k,v] of Object.entries(current.fields)){
  if(k.startsWith('noseFruit:')||k.startsWith('noseNon:')||k.startsWith('noseWM:')||k.startsWith('noseOther:')){
   const dest=k.replace(/^nose/,'palate'),existing=current.fields[dest];
   current.fields[dest]=Array.isArray(v)?[...new Set([...(Array.isArray(existing)?existing:[]),...v])]:v;count++;
  }
 }
 for(const [,k] of OAK){if(filled(val(k))){const dest=oakStorageKey('palate',k);current.fields[dest]=Array.isArray(val(k))?[...new Set([...(Array.isArray(val(dest))?val(dest):[]),...val(k)])]:val(k);count++}}
 if(count){autoSave();rerender('section-palate');toast('Nose Descriptors Confirmed')}else toast('No Nose Flavours Selected');
}
function overallNote(){
 const lines=[];if(!current.blind||current.revealed){const identity=[current.producer,current.wine,current.vintage,current.region,current.grape].filter(Boolean).join(' · ');if(identity)lines.push(identity+'.')}
 if(current.wineType)lines.push(current.wineType+' wine.');
 for(const [name,items] of [['Appearance',SIGHT.concat(SIGHT_EXTRA)],['Nose',NOSE_BASE],['Palate',STRUCTURE.concat(PALATE_MARKERS,PALATE_FINISH)]]){const parts=items.filter(([,key])=>filled(val(key))).map(([label,key])=>label.toLowerCase()+': '+valText(val(key)));const phase=name==='Nose'?'nose':name==='Palate'?'palate':null;if(phase)for(const [key,v] of Object.entries(current.fields)){if(key.startsWith(phase)&&/Fruit:|Non:|WM:|Other:/.test(key)&&filled(v))parts.push(valText(v))}if(parts.length)lines.push(name+' — '+parts.join('; ')+'.')}
 for(const key of ['noseFree','palateFree','finalConclusion','evidence'])if(filled(val(key)))lines.push(valText(val(key)));
 const guesses=['guessGrape','guessCountry','guessRegion','guessVintage'].map(k=>val(k)).filter(filled);if(guesses.length)lines.push('Tasting conclusion: '+guesses.join(' · ')+'.');
 return lines.join('\n\n')||'No observations entered yet.';
}
function summary(){const t=tally();let lines=['WINE TASTING JOURNAL',formatDate(current.createdAt),current.blind?'Blind Tasting':'Open Tasting',`Wine Type: ${current.wineType||'—'}`,`Wine: ${titleFor(current)}`,`Region: ${current.region||'—'}`,`Grape: ${current.grape||'—'}`,''];
 for(const [name,fieldKeys] of [['Sight',SIGHT.concat(SIGHT_EXTRA)],['Nose',NOSE_BASE],['Palate Structure',STRUCTURE],['Palate Markers',PALATE_MARKERS.concat(PALATE_FINISH)],['Initial Conclusion',INITIAL],['Final Conclusion',FINAL]]){lines.push('['+name+']');for(const [label,key] of fieldKeys){if(filled(val(key)))lines.push(label+': '+valText(val(key)))}lines.push('')}
 lines.push('[Fruit / Non-Fruit]');for(const [key,v] of Object.entries(current.fields)){if(key.includes('Fruit:')||key.includes('Non:')||key.includes('WM:')||key.includes('Other:')||OAK.some(([,k])=>key===k||key==='palate'+k[0].toUpperCase()+k.slice(1)))if(filled(v))lines.push(key+': '+valText(v))}
 for(const k of ['possibleGrape','possibleCountry','possibleRegion','guessGrape','guessCountry','guessRegion','guessVintage','guessQuality','evidence','noseFree','palateFree','finalConclusion'])if(filled(val(k)))lines.push(k+': '+valText(val(k)));
 if(filled(val('overallNote')))lines.push('[Overall Tasting Note]',val('overallNote'));
 lines.push('',`Quality Score: ${t.done?t.sum:'—'} / 100 (${t.done}/${t.count})`, `Estimated Price: ¥${current.prices.expectedRetail||'—'}`,`Buying Price: ¥${current.prices.willingPay||'—'}`,`Actual Price: ¥${current.prices.realRetail||'—'}`,`Would You Buy: ${current.prices.decision||'—'}`);return lines.join('\n')}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch(err){const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}}
async function exportData(){await flush();const all=await allNotes();const blob=new Blob([JSON.stringify({app:'Wine Tasting Journal',version:'1.4',exportedAt:today(),notes:all},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='wine-tasting-journal-backup-'+today().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup Exported')}
async function importData(file){try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.notes))throw Error('Invalid Backup');let count=0;for(const x of data.notes){if(!x||!x.id||!x.createdAt)continue;await storeNote(normalise(x));count++}await refreshNotes();render();toast(`Imported ${count} Tastings`)}catch(err){toast('Import Failed: '+err.message)}}
async function compressPhoto(f){if(!f.type.startsWith('image/'))throw Error('Not An Image');return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('File Read Failed'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('Image Decode Failed'));img.onload=()=>{const scale=Math.min(1,960/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.76))};img.src=reader.result};reader.readAsDataURL(f)})}
async function addPhotos(fileList){if(!current)return;const arr=[...fileList].slice(0,Math.max(0,8-current.photo.length));if(!arr.length){toast('Maximum 8 Photos');return}try{for(const f of arr)current.photo.push(await compressPhoto(f));autoSave();rerender(current.blind?'reveal':'');toast(`${arr.length} Photo${arr.length>1?'s':''} Added`)}catch(err){toast('Photo Failed: '+err.message)}}
// On-page actions. All controls act on the currently opened tasting only.
head.addEventListener('click',async e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.back){if(screen==='settings')await goHome();else await goHome();return}if(button.dataset.goSettings)await showSettings()});
modalRoot.addEventListener('click',e=>{const button=e.target.closest('button'),d=button?.dataset||{};if(d.startMode){begin(d.startMode==='blind');return}if(d.photoAction){const target=d.photoAction==='camera'?'photoCamera':'photoImage';closeModal();document.getElementById(target).click();return}if(d.closeModal){closeModal();return}if(e.target.classList.contains('overlay'))closeModal()});
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.startMode){begin(d.startMode==='blind');return}
 if(d.add){showModal('mode');return}
 if(d.generateOverall){current.fields.overallNote=overallNote();autoSave();rerender('overall-note');return}
 if(d.copyOverall){await copyText(current.fields.overallNote||overallNote());toast('Copied');return}
 if(d.openNote){await loadNote(d.openNote);return}
 if(d.photo){showModal('photo');return}
 if(d.removePhoto!==undefined){current.photo.splice(Number(d.removePhoto),1);autoSave();rerender(current.blind?'reveal':'');return}
 if(d.type){setWineType(d.type);return}
 if(d.detail){ui.detailsOpen=!ui.detailsOpen;rerender();return}
 if(d.panel){ui.panels.has(d.panel)?ui.panels.delete(d.panel):ui.panels.add(d.panel);rerender('section-'+d.panel);return}
 if(d.field){ui.fields.has(d.field)?ui.fields.delete(d.field):ui.fields.add(d.field);rerender('field-'+d.field);return}
 if(d.cat){ui.categories.has(d.cat)?ui.categories.delete(d.cat):ui.categories.add(d.cat);rerender('cat-'+d.cat);return}
 if(d.chip){const k=d.chip,v=d.choice,isMulti=d.multi==='1';if(isMulti){const a=Array.isArray(val(k))?[...val(k)]:[];current.fields[k]=a.includes(v)?a.filter(x=>x!==v):[...a,v]}else{current.fields[k]=val(k)===v?'':v;ui.fields.delete(k)}autoSave();rerender(isMulti?(k.includes(':')?'cat-'+k:'section-'+(k.startsWith('palate')?'palate':'nose')):'field-'+k);return}
 if(d.more){ui.more.has(d.more)?ui.more.delete(d.more):ui.more.add(d.more);rerender('section-'+d.more);return}
 if(d.notes){ui.notes.has(d.notes)?ui.notes.delete(d.notes):ui.notes.add(d.notes);rerender('section-'+(d.notes==='initial'||d.notes==='final'?d.notes:d.notes==='price'?'price':d.notes));return}
 if(d.confirmNose){copyNose();return}
 if(d.score){const v=Number(d.scorevalue);current.score[d.score]=current.score[d.score]===v?undefined:v;autoSave();rerender('section-score');return}
 if(d.pricechip){current.prices[d.pricechip]=Number(d.pricevalue);autoSave();rerender('section-price');return}
 if(d.decision){current.prices.decision=current.prices.decision===d.decision?'':d.decision;autoSave();rerender('section-price');return}
 if(d.reveal){current.revealed=true;autoSave();rerender('reveal');return}
 if(d.copy){await copyText(summary());toast('Copied');return}
 if(d.save){current.completed=true;await flush();await goHome();toast('Tasting Saved');return}
 if(d.deleteCurrent){if(confirm('Delete This Tasting?')){await deleteNote(current.id);current=null;await goHome()}return}
 if(d.export){await exportData();return}
});
app.addEventListener('input',e=>{const target=e.target;const d=target.dataset;
 if(d.input!==undefined){if(d.location==='note')current[d.input]=target.value;else current.fields[d.input]=target.value;autoSave();return}
 if(d.textarea!==undefined){if(d.textarea==='priceNotes')current.prices.notes=target.value;else current.fields[d.textarea]=target.value;autoSave();return}
 if(d.price!==undefined){current.prices[d.price]=target.value;autoSave();return}
 if(target.id==='searchTastings'){searchText=target.value;const pos=target.selectionStart;renderHome();const newInput=document.getElementById('searchTastings');newInput?.focus();newInput?.setSelectionRange(pos,pos)}
});
app.addEventListener('change',async e=>{if(e.target.id==='importInput'){if(e.target.files?.[0])await importData(e.target.files[0]);e.target.value=''}});
for(const input of ['photoCamera','photoImage'])document.getElementById(input).addEventListener('change',async e=>{if(e.target.files?.length)await addPhotos(e.target.files);e.target.value=''});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
(async()=>{try{db=await openDB()}catch(err){db=null}try{await refreshNotes()}catch(err){notes=[];toast('Local Storage Unavailable')}render()})().catch(err=>{notes=[];render();toast('Startup Error: '+err.message)});
// Platform adapter: preserve the original database and save before leaving the document.
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
</script>
</body>
