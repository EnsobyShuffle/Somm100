esalers-fell-80-through-september-2026.html"]]}],"2026-10-31":[{"title":"新疆吐哈盆地：葡萄园的叶子怎样替果实挡住极端高温？","body":["在通常年降水量很低、夏季可能出现45℃以上高温的新疆新疆·吐哈盆地，酿酒葡萄能否健康成熟，不仅是选择品种的问题，也与葡萄藤的形状有关。研究团队在鄯善县对Syrah开展了两个生长季的田间试验，比较常见直立枝蔓管理（VSP）和数种双层帘幕式树冠配置，希望通过叶幕遮阴改变果实周围的小气候。10月25日，科学资讯平台 Scienmag 介绍了这项发表于《Food Chemistry: X》的研究，论文编号104667。","研究发现，适当的双层叶幕能够降低果区受热程度，延缓糖分累积，帮助保留酸度，并改变葡萄和成酒中的挥发性香气化合物。试验中标为DLC-100V的一种配置，在所比较的两个年份里表现相对一致。这里的重点不是把葡萄遮得越严越好，而是让受光、通风、热量和生理成熟之间取得更合理的平衡。","这项研究为中国炎热干燥葡萄酒产区提供了值得继续验证的技术路径。面对全球变暖，酒农未必只能提前采收或换一个地区种植，也可能通过树形与冠层管理调整成熟速度。然而，试验只针对当地条件下的Syrah，且各处理采收时糖度存在差异，香气活性值也不能完全代替真实感官评价。不能将两年小规模研究直接写成全国普适的种植标准，更不能推断所有双层叶幕葡萄酒都更好。","原始论文： Double-layer curtain canopy systems modulate volatile compounds and sensory attributes of ‘Syrah’ grapes and wines in hot-arid regions ；Food Chemistry: X, 40, 104667；科学新闻发表2026-10-25，研究依据2023—2024两个年份田间试验。科学新闻及研究局限 · DOI原始论文"],"sources":[["科学新闻及研究局限","https://scienmag.com/double-layer-curtain-canopies-shield-syrah-grapes-from-extreme-desert-heat-and-lift-wine-quality/"],["DOI原始论文","https://doi.org/10.1016/j.fochx.2026.104667"]]},{"title":"加州一年移除47,229英亩葡萄园：供需调整不只发生在酒瓶价格上","body":["一份关于美国California葡萄园的地图报告，把全球葡萄酒消费趋缓转化为了一组直观数字。加州葡萄种植者协会（CAWG）联合行业组织、由Land IQ实施的2026 Winegrape Mapping Project，在8月1日时点记录到全州仍有439,115英亩葡萄园，同时确认2025年8月1日至2026年8月1日约47,229英亩葡萄园被移除。报告10月15日发布、10月16日公开传播，10月29日又有行业说明会，本期是对其持续影响的深读，并非把两周前发布的报告包装成10月31日新数据。","葡萄藤被拔除，并不简单等于酿酒师放弃品质。在需求不足、葡萄收购合同缩减和经营成本持续存在时，部分种植者必须权衡继续维护葡萄园的成本、未来订单，以及重新种植需要的时间。地图信息尤其有助于分辨各县和AVA的实际存续种植面积、撤除面积，而非只依据某个知名产区的表面热度判断全州状况。","数字也有重要边界：439,115英亩是某一时点仍在土地上的面积，包含未结果或暂时停产的藤；47,229英亩是前12个月识别出的总移除面积，两者不是同一个统计口径。由于新发现的地块、重新分类和边界校正，2025年与2026年两个存量数字的差额不必等于当年移除量。因此，不应简单地从这两项数字推算整个加州的产量、库存或未来瓶价。","该项目真正提醒消费者的是：一瓶酒的供给形成于多年以前，市场变化却可能很快。今天被移除的葡萄藤，意味着将来即使需求回升，恢复供应也需要重新投入土地、资金和时间。","原始数据：CAWG / Land IQ《2026 California Winegrape Mapping Project》，资料发布2026-10-15；公告2026-10-16；行业线上说明会2026-10-29；统计截至2026-08-01。CAWG合作发布 · Napa Valley Grapegrowers数据说明 · 10月29日说明会信息"],"sources":[["CAWG合作发布","https://wineindustryadvisor.com/2026/10/16/2026-california-winegrape-mapping-project-released/"],["Napa Valley Grapegrowers数据说明","https://www.napagrowers.org/industry-blog/2026-california-winegrape-mapping-project-results-are-here"],["10月29日说明会信息","https://wineindustryadvisor.com/event/california-winegrape-mapping-project-webinar/"]]},{"title":"35,000英尺试酒：联合航空为什么提前两年为商务舱调配一款红酒？","body":["在地面上完整舒展的一款葡萄酒，到了高空却未必呈现相同印象。航空客舱空气干燥、环境压力不同，乘客对于香气、果味和酒体结构的感受可能改变。10月26日，Decanter报道联合航空与加州Aperture Cellars酿酒师Jesse Katz共同开发一款专供Polaris商务舱的红葡萄酒，名为Air and Vine，计划于2028年提供，而非2026年已经在机上销售。","研发过程中，团队携带九种试验性混酿组合，在约35,000英尺的飞行环境中品尝、比较并调整。最终这款2024年份Sonoma County红葡萄酒，以Cabernet Sauvignon为主导；其比例为76%，另有【葡萄品种】马贝克 Malbec12%、Merlot 6%、Petit Verdot 4%和Cabernet Franc 2%。团队尝试在较弱的香气表现下保留足够的果味、质地和结构，同时不丢失葡萄园本来的风格。","航空公司选择酒款还有体量难题。Decanter指出，商务舱的一轮约三个月酒单轮换有时需要6,000至7,000箱，部分小型生产者难以持续提供足够数量。定制酒款将品牌故事、餐饮服务、采购规模与特定饮用环境联结起来，已不只是简单“选一瓶评分高的葡萄酒”。","但这不是证明“在飞机上酿出来的酒更好喝”。酒仍在地面酿造；高空试验指的是最终混酿的品评过程。个体感知、不同航空舱室与餐食搭配也可能改变体验。它值得关注，因为侍酒服务正在从酒款本身，延伸到真正理解饮用场景。","原报道： Why United Airlines blended its newest wine at 35,000 feet ，Decanter，2026-10-26。项目试酒和发布计划由报道披露；2024为酒款年份，2028为计划供应时间。阅读Decanter报道"],"sources":[["阅读Decanter报道","https://www.decanter.com/wine/why-united-airlines-blended-its-newest-wine-at-35-000-feet/"]]},{"title":"11,111款葡萄酒商品图像研究：高价酒为什么经常只配一张照片？","body":["对于消费者而言，网购一瓶从未喝过的葡萄酒，图片通常是最先接触到的信息。但很多线上酒款页面，除了正面瓶身照，并不能提供背标、年份、瓶型细节或足够清晰的视觉资料。10月27日，Wine Industry Advisor刊发一项关于葡萄酒电商商品图像的分析，背后的数据来自专业酒款摄影服务商Outshinery。该研究在9月4日采集189个酒类店铺、11,111款商品和10,217张主要图片，覆盖美国、加拿大、澳大利亚、新西兰及南非使用Commerce7系统的店铺。","研究发现，约82%的酒款商品条目只有一张照片；74%的受检店铺存在图片长宽比不统一的情况。即使对照同一商店目录中的高价与低价酒款，两者在图片数量和分辨率方面也没有明显的差别。另一项值得警惕的细节是，部分页面标题中的年份与所展示瓶图中的年份不符。","在葡萄酒里，年份、酒庄、地块、特别装瓶及批次不仅是营销细节，也可能影响消费者实际购买到的商品。因此，商品图片不仅是漂亮的包装，更是信息透明度的一部分。正标和背标是否对应、瓶身比例是否一致、有没有误用旧年份，都会影响读者理解酒款时的可靠性。","然而，这项研究由商品影像服务商自行开展，样本只来自一种电商技术平台，不能代表所有葡萄酒零售网站。尤其重要的是，研究并没有测量顾客下单、退款或销售转化。它证明了一部分页面的图像管理存在可观察的标准化问题，却不能证明多放三张照片一定能提升销售额。真正值得推广的是准确性、清晰度与有用的信息，而不是图片数量本身。","原文： We Measured 11,111 Wine Listings. Here Are Three Image Checks to Run on Yours ，Wine Industry Advisor，2026-10-27；基础数据于2026-09-04采集，原始研究/通稿2026-09-17/18。10月27日分析 · 研究方法与来源"],"sources":[["10月27日分析","https://wineindustryadvisor.com/2026/10/27/we-measured-11111-wine-listings-here-are-three-image-checks-to-run-on-yours/"],["研究方法与来源","https://wineindustryadvisor.com/2026/09/18/outshinery-study-finds-wine-costs-three-times-more-gets-the-same-photograph/"]]}],"2026-10-30":[{"title":"中国葡萄酒的两张成绩单：营收增长，利润却下降；白葡萄酒正在重塑需求","body":["原创数据图｜2026年前三季度张裕经营指标与9月新西兰瓶装酒进口量变化。数据来源：第一财经（2026-10-27）。比例基期不同，不可横向比较为同一市场份额。","中国葡萄酒市场并非完全没有增长，而是增长正在发生在不同的地方。10月27日，《第一财经》以最新财报与渠道调查为基础指出，一边是传统葡萄酒企业承受利润压力，一边是白葡萄酒在部分渠道出现明显需求增量。张裕2026年前三季度实现营业收入22.5亿元，同比增长6.5%；归属于母公司股东的净利润1.51亿元，却同比下降19.3%。单看第三季度，其营收约6.8亿元，同比增长5.5%，净利润约1,090.7万元，虽较上年低基数显著反弹，仍不足以抵消前三季度整体利润承压的现实。","市场结构也在变化。报道称，2026年1—9月中国葡萄酒进口总量约1.6亿升，同比下降5.3%，进口金额约11.7亿美元，却同比增长5.6%。在单月数据中，9月来自新西兰的瓶装葡萄酒进口约113万升，同比增长127.5%，金额同比增长50.1%；德国葡萄酒进口也出现增长。行业观察者将其中一部分需求与易于冰镇、口感清爽、适合日常餐饮的白葡萄酒联系起来，包括长相思 Sauvignon Blanc和雷司令 Riesling等，但上述海关数字本身并不能直接证明各种葡萄品种各自的销量。","真正值得追问的是：白葡萄酒热度是否带来了健康利润？报道采访发现，低价产品和同质化竞争已经出现，部分白葡萄酒的进口采购价格持续下探。论坛上关于白葡萄酒占中国市场“接近30%”的说法，仍应视为业内估计而非独立、统一口径的全国零售统计。进口商的到岸量也不等于餐厅和消费者实际买走的数量。对这一轮变化的合理理解，是消费者可能更愿意在轻松的日常场景喝葡萄酒，但企业还必须证明自己有能力获得复购、控制成本并保有利润。","来源与日期：  《财报解读｜“红”退“白”进：沉闷的葡萄酒市场正在换引擎》｜第一财经·栾立｜原发2026-10-27；相关财报区间2026年1—9月，进口数据为2026年1—9月及9月单月。 阅读原始报道"],"sources":[["阅读原始报道","https://www.yicai.com/news/103410694.html"]]},{"title":"Vega Sicilia进军西班牙西北：2,000万欧元押注一款Albariño","body":["原创资料图｜Deiva项目公开投资、葡萄园面积及预计上市时间。事实来源：La Región（2026-10-28），非酒庄实拍。","以西班牙标志性红葡萄酒闻名的 Tempos Vega Sicilia 集团，将自己的下一段故事写在大西洋一侧。10月28日，西班牙地方媒体《La Región》报道，集团正式展示位于加利西亚 Crecente 的新酒庄与其首款在西班牙酿造的白葡萄酒 Deiva。这款酒来自Rías Baixas产区，以100%的Albariño酿成，采用2024年份，预计2027年进入市场。","集团披露的初期投资约为2,000万欧元，其中约1,500万用于在 Crecente 建设酒庄，另有约500万用于收购葡萄园与地块。目前集团拥有约24公顷葡萄园，并提出长期增至50公顷的愿景。2024年首批酒约33,000瓶，由于新酒庄尚在建设，当年酒液实际上在临时设施完成酿造。这一点使“新酒庄发布”不等于“新酒庄已经完整酿造了首个年份”。项目不只是添一个高端白葡萄酒品牌，而是把资本、土地和长期种植资源投入此前并非该集团核心的气候与葡萄品种体系。","Rías Baixas的Albariño常被联系到大西洋气候、鲜明酸度与海鲜餐桌，但高端酒庄需要建立的价值不止品种辨识度，还包括具体地块、酿造选择、陈年潜力与长期酒款连续性。首个2024年份计划在2027年面市，显示集团希望让新酒在上市前经历更长的培养与市场定位期。然而，品牌地位与实际品质仍需由上市后的酒款表现、市场价格及不同年份的稳定性共同检验。集团提出的扩园目标也还是计划，而非已经购入的面积。","来源与日期：  “Tempos Vega Sicilia lanza su primer vino albariño en una bodega pionera en Crecente”｜La Región·Andrea Estévez｜2026-10-28；项目展示亦于同日见报。 阅读西班牙原始报道"],"sources":[["阅读西班牙原始报道","https://www.laregion.es/galicia/tempos-vega-sicilia-primer-albarino-bodega-pionera-crecente_1_20261028-4469341.html"]]},{"title":"香槟首次获得特殊酒精度豁免：2026年热浪如何改变酿造规则？","body":["原创法规时间轴｜2026年香槟提前采收与10月28日例外决定。数据来源：La Revue du vin de France / AFP；不是官方法规原件或新闻照片。","极端天气对葡萄酒的影响，正从葡萄园蔓延到原产地法规。法国《La Revue du vin de France》与法新社10月28日报道，法国官方公报当天正式公布了一项适用于2026采收条件的特殊规定：部分Champagne可以在严格限定情形下突破通常13%的总酒精度上限，最高涉及15%。这项例外与2026年夏季高温、干旱和葡萄糖分集中有关，并非意味着整个香槟产区从此普遍把酒精度提高到15%。","关键在于适用条件。报道引述官方文本指出，允许超过13%的，是2027年装瓶进行二次发酵、以2026年份未加糖增酒精度的基酒与较早年份曾加糖增度的储备酒调配而成的特定葡萄酒，且必须符合临时规定。香槟的调配传统原本就能帮助生产者平衡不同年份，但在异常成熟与高潜在酒精度的2026年，旧有的技术上限可能使部分正常调配受到限制。法规例外是在保护合法酿造连续性，而不是推行更强劲的香槟风格。","2026年香槟采收启动格外早，部分地区8月6日便开始摘葡萄。温暖年份并不能简单等同于品质更高：糖分增长、酸度变化和香气成熟度不一定同步；生产者仍需决定采收时间、基酒处理、储备酒比例以及最终平衡。消费者也无需以为新规会立即改变货架上所有香槟——适用的是特定年份、特定调配及后续生产程序。这条新闻真正揭示的是，气候变化正在要求原本强调稳定与传统的原产地制度拥有更精细的应对机制。","来源与日期：  “Feu vert définitif pour des champagnes jusqu’à 15 % d’alcool”｜La Revue du vin de France / AFP｜2026-10-28；正式行政公布日2026-10-28，适用2026采收与2027 tirage。 阅读法语原始报道"],"sources":[["阅读法语原始报道","https://www.larvf.com/feu-vert-definitif-pour-des-champagnes-jusqu-a-15-d-alcool,4942836.asp"]]},{"title":"一座酒庄能把多少土地留给自然？俄勒冈Domaine Serene公开量化答卷","body":["原创数据图｜俄勒冈Domaine Serene所披露的自然保留地比例与轻量化酒瓶指标。数字为企业自述，尚非独立碳审计结论。","在美国俄勒冈州，Domaine Serene近期对外说明了自己如何衡量“可持续”。酒庄10月21日发布的原始资料、以及Vinetur于10月28日的行业报道，集中展示了两种不同层面的做法：土地与生境管理，以及包装材料减重。由于第一手声明早于本期新闻窗口，这则作为近期行业追踪，而非把10月21日的消息伪装成10月30日新事件。","酒庄称，其在俄勒冈拥有约1,000英亩土地，其中约65%保留为森林、橡树稀树草原、溪流周边等较自然的生态空间，而非全部改造成可耕种葡萄园。种植区则使用覆盖作物、减少翻耕、堆肥和绵羊放牧，并以清理易燃植被、设置防火带和储水设施应对野火威胁。Domaine Serene以Pinot Noir和Chardonnay著称，其保留自然土地的决定有长期经营意义，但企业所称每年封存超过1,500吨二氧化碳，应视为其自行披露的估算，而非已经获得本次报道独立核证的碳信用量。","另一项更容易测量的改变发生在酒瓶。酒庄与Saverglass合作的Cépage Eco玻璃瓶重约495克，比原版本轻约30%，按其现有产量计算，每个年份可减少约25万磅玻璃使用量。轻量瓶并不自动代表葡萄酒品质下降，也不意味着整瓶产品的碳足迹一定下降同样的百分比；真正的环境收益，还取决于运输距离、能源结构、回收率及供应链完整核算。与笼统使用“绿色”二字相比，面积、重量、认证和数据边界更有助于消费者评估酒庄宣称的可信度。","来源与日期：  “Domaine Serene Celebrates Sustainability Month With Measurable Progress in Environmental Stewardship”｜Domaine Serene官方声明｜原发2026-10-21；Vinetur后续报道2026-10-28。 阅读酒庄原始公告 · 阅读后续行业报道"],"sources":[["阅读酒庄原始公告","https://www.domaineserene.com/learn/domaine-serene-celebrates-sustainability-month-with-measurable-progress-in-environmental-stewardship"],["阅读后续行业报道","https://www.vinetur.com/en/amp/20261028109924/domaine-serene-sets-aside-65-of-its-oregon-acreage-for-conservation.html"]]}],"2026-10-29":[{"title":"西藏桑日：从15亩试验田到上万亩葡萄园，帕竹酒庄真正解决了什么？","body":["一条来自西藏山南的产业报道，值得比普通酒庄获奖消息更多关注。10月28日，《西藏日报》讲述了帕竹酒庄在桑日县雅鲁藏布江河谷的发展：这里2011年从约15亩试验田起步，如今形成上万亩葡萄种植基地。报道描述的困难并非“海拔高”三个字可以概括——土地贫瘠、盐碱化严重，土壤pH约8.5，最初引种60个品种时大部分难以存活。","转折来自长期的土壤改良与品种适应。酒庄与科研团队尝试排盐沟、施用有机物、秸秆覆盖及滴灌，并通过防风固沙植物改善葡萄园生态。经过筛选，2017年保留了六个核心葡萄品种，并发展适应高寒气候的“雅江1号”。报道称，2026年该品系进入丰产期的面积已达约6,800亩。值得区分的是，“雅江1号”的大量产量也用于鲜食葡萄销售，不能把葡萄园面积直接换算为酿酒葡萄面积，更不能简单推导葡萄酒产瓶数。","酒庄正在摸索真正的市场连接。报道说其产品在2026年初首次批量发往香港；在口味开发上，团队也尝试调整单宁、果香与冰酒工艺，希望适应更多消费者的餐桌习惯。与此同时，鲜葡萄通过冷链、电商和体验旅游销售。文中提及2025年线上销售额超过200万元，以及2026年秋季鲜葡萄销售成绩；这些均属报道口径，不能误当作经过审计的葡萄酒销售收入。","最重要的是，这不是把一片高原土地浪漫化为“奇迹葡萄园”。它展示了中国葡萄酒生产者面对土壤、气候、品种、酿造、物流与消费需求时，一整套真实而漫长的产业选择。","原始报道：《雅江畔，绿色和紫色的传奇——产业援藏助力山南市桑日葡萄产业发展壮大》 ·《西藏日报》· 2026-10-28（产业发展回顾，含2026当年数据）"],"sources":[["阅读报道全文（人民日报西藏频道转载）","https://xz.people.com.cn/n2/2026/1028/c138901-41734670.html"]]},{"title":"山西怡园母公司拟更名：一家中国精品葡萄酒企业为什么走向更广的酒饮生意？","body":["说起山西的怡园酒庄，很多人想到的是中国精品葡萄酒发展的早期代表之一。它于1997年创立，后来成为中国精品酒庄经营、品牌和市场教育的标志性案例。但10月26日 Vino Joy News 报道的一件事，正在改变其上市母公司的商业方向：Grace Wine Holdings 董事会提出将英文公司名称改为 Consumer Business Factory Holdings Limited，中文拟名“壹玖即时即饮控股有限公司”。","这并不等于“怡园酒庄本身已经改名”。 拟更名的主体是香港上市公司，且目前仍属于董事会提案，须依正式公司程序完成。  这项建议首次在10月9日的交易所披露中出现，Vino Joy 在10月26日进行了分析报道；公司已安排于11月3日召开股东特别大会审议相关特别决议，更名须通过法定程序方能生效。变化与控制权的转移有关：报道指出，1919酒类零售企业创始人杨陵江于2025年12月取得上市公司约73.63%的股权控制权。此后上市公司业务开始向白酒及其他酒饮供应链延伸，而不仅限于种植、酿造与销售自产葡萄酒。","从产业角度看，这件事真正值得讨论的是：一家以葡萄酒酒庄为核心身份的上市企业，正在尝试把自己改造成覆盖更多即时消费、酒饮品类和零售渠道的公司。究竟能否带来增长，还需要看后续投资、供应链整合与财务数据，而不是从新名字直接推断成功。酒庄的精品葡萄酒生产与上市集团的多元化战略，也应分别观察。","原始报道：China’s Grace Wine Formally Changes Name as It Expands Beyond Wine · Vino Joy News · 2026-10-26；关键原始披露：Grace Wine Holdings《PROPOSED CHANGE OF COMPANY NAME》· 2026-10-09","阅读 Vino Joy 报道 · 核查上市公司公告"],"sources":[["阅读 Vino Joy 报道","https://vino-joy.com/2026/10/26/chinas-grace-wine-formally-changes-name-as-it-expands-beyond-wine/"],["核查上市公司公告","https://www.gracewine.com.hk/investor-relations/news-and-events/announcements-and-circulars/"]]},{"title":"德国葡萄酒在中国量价齐升：Riesling带来的机会，不能只看进口增长","body":["10月28日，Vino Joy News 援引中国海关数据报道：2026年前九个月，中国进口德国瓶装葡萄酒约423万升，同比增长8%；进口金额约2,249万美元，同比增长11%，平均进口单价约上涨3%。在中国葡萄酒总体消费情绪偏谨慎的环境下，进口量、金额和平均单价同时向上，的确是个值得研究的变化。","德国葡萄酒的竞争力不只来自传统甜型白酒。干型、半干型以及多种风格的 Riesling，连同 Silvaner、Pinot Blanc、Pinot Gris 等品种，为消费者提供了不同于浓郁橡木桶红葡萄酒的选择。报道也提到，计划在11月10日至12日举行的 ProWine Shanghai 上，德国馆预计集结45家酒庄及进口商，借行业展会进一步对接经销与餐饮渠道。","不过， 进口增长不等于终端销售已增长，也不能证明增长全部由Riesling带动。  海关数据衡量的是货物进入中国市场的数量和金额，并不能直接告诉我们消费者在餐厅或酒商门店买走了多少，或是哪种甜度、价格段和品种带来主要增量。真正的趋势还需结合渠道去库存、零售成交和复购观察。对读者而言，这是一条关于中国市场消费选择可能变化的消息，而非“德国酒已经全面胜出”的结论。","原始报道：German Wine Gains in China as Producers Prepare for ProWine Shanghai · Vino Joy News / Morris Cai · 2026-10-28；海关数据区间：2026-01至09"],"sources":[["阅读 Vino Joy 原文","https://vino-joy.com/2026/10/28/german-wine-gains-in-china-as-producers-prepare-for-prowine-shanghai/"]]},{"title":"上海爵士节把葡萄酒带离品鉴室：杯卖、音乐和日常消费的交汇","body":["如果把葡萄酒只放在正式酒会、课程或商务宴请里，行业与消费者相遇的机会可能就被限制了。10月27日，Vino Joy News 报道，ASC Fine Wines 成为2026年上海 JZ Festival 的独家葡萄酒合作伙伴。这届音乐节及关联活动从10月16日延续至11月1日，涉及13个场地、146场演出和活动。","相比把酒摆在传统展台，ASC 这次尝试的方式更接近日常消费：现场按杯销售葡萄酒，也提供热红酒、葡萄酒冰沙等适合不同活动氛围的产品；展示的品牌包括 Los Vascos、Clarendelle 和 Robert Mondavi。到场的人未必专程寻找一瓶珍藏级葡萄酒，却可能因现场体验接触、尝试和记住一个风格或品牌。","这种场景的商业意义不在于“爵士乐天然适合喝酒”，而是消费者的实际参与路径发生了变化——先来听音乐、与朋友相聚，再决定是否尝试葡萄酒。它可能让葡萄酒不再被认为只属于需要专业知识的场合。但活动的触达效果、单杯销售、客单价和之后的复购是不同指标。报道没有公开经过验证的最终销售与转化数据，因此不应把一次合作写成已经被证明成功的营销模式。","原始报道：ASC Takes Wine Beyond the Tasting Room With Shanghai Jazz Festival Partnership · Vino Joy News / Morris Cai · 2026-10-27；活动日期：2026-10-16至11-01"],"sources":[["阅读 Vino Joy 原文","https://vino-joy.com/2026/10/27/asc-takes-wine-beyond-the-tasting-room-with-shanghai-jazz-festival-partnership/"]]},{"title":"香槟的边界该不该扩大？持续23年的产区范围修订迎来重要转折","body":["对于Champagne来说，产区的边界是一项复杂的法律与经济问题。葡萄来自哪些村庄、哪些地块，决定了它能否在法定规则下使用香槟这一受保护名称。自2003年起，当地就持续进行一项葡萄生产地理范围的全面修订讨论，原本涉及潜在纳入或调整的村庄与地块。","10月23日 Vinabox 报道，香槟酒农总工会 SGV 在10月21日 Épernay 的理事会上，以约78.85%的支持率表决赞成停止这轮全面修订工作。该提议历时23年，却在气候、成本、市场需求与行业风险不断变化之后，面对新的现实选择。现有香槟葡萄生产区域涉及319个市镇；任何扩展或改变都会牵涉土地价值、供应规模、生产者利益与产区形象。","然而， SGV的表决不等于法国监管机构INAO已正式宣布改变香槟法定边界，更不是所有未来修改都被永久禁止。  目前可确认的是酒农行业组织的立场出现重要转折，而最终法律程序与正式文本需要继续跟踪。对于喜爱香槟的读者，这条消息真正涉及的不是明天会不会多出几瓶酒，而是法定产区如何在历史身份、自然条件与不断变化的市场之间作出长期选择。","原始报道：Champagne : après 23 ans de travaux, les vignerons votent l’arrêt de la révision de l’aire d’appellation · Vinabox / Jérémy Degryse · 2026-10-23；SGV表决：2026-10-21"],"sources":[["阅读 Vinabox 法文报道","https://www.vinabox.fr/actu/reglementation/aire-appellation-champagne-revision-arret-sgv/"]]}],"2026-10-24":[{"title":"Palacios 兄弟与 EMW 签署分销合作","body":["据 Vino Joy News 10 月 23 日报道，Rafael 与 Álvaro Palacios 分别与 EMW Fine Wines 达成分销合作，希望进一步拓展中国市场，让更多消费者接触西班牙精品葡萄酒。","两份协议的覆盖范围不同：Rafael Palacios 任命 EMW 为大中华区独家进口及分销商；Álvaro Palacios 则将 EMW 纳入中国内地官方进口商体系，并非独家合作。他在香港与澳门的分销仍由 Links Concept 负责。","合作也把两种鲜明的产区表达带到中国消费者面前：Rafael 专注 Valdeorras 的 Godello 白葡萄酒；Álvaro 则以 Priorat 等产区的项目闻名。报道将此放在西班牙精品酒拓展中国市场的背景下，关注消费者如何从价格印象走向对产地与品质的理解。"],"sources":[["Vino Joy News","https://vino-joy.com/2026/10/23/palacios-brothers-sign-emw-deals-to-expand-china-reach/"]]},{"title":"勃艮第 2026 采收报告","body":["Matthew Hayes 的年份观察；原站需要会员阅读全文，当前仅核对标题、日期和公开导语。"],"sources":[["JancisRobinson.com","https://www.jancisrobinson.com/articles/burgundy-2026-harvest-report-contender"]]},{"title":"Andrea Ferreyra 获年度酿酒师提名","body":["阿根廷官方推广平台的人物报道，谈 Uco Valley 的酿造思路与团队管理。此处是提名，不是获奖结果。"],"sources":[["Wines of Argentina","https://blog.winesofargentina.com/destacadas/andrea-ferreyra-winemaker/"]]},{"title":"OIV 世界葡萄与葡萄酒大会在银川举行","body":["OIV 官方回顾：大会于 10 月 12–16 日在宁夏银川举行，围绕研究、国际合作和行业转型交流。"],"sources":[["OIV","https://www.oiv.int/press/china-hosted-47th-oiv-world-congress-vine-and-wine-marking-historic-first-asia"]]}]}</script><script>
const archive=JSON.parse(document.getElementById('editions').textContent);
const dates=Object.keys(archive).sort().reverse();
const select=document.getElementById('issue');
const requested=new URL(location.href).searchParams.get('date');
const date=Object.hasOwn(archive,requested)?requested:dates[0];
const dateLabel=value=>value.slice(0,4)+'年'+Number(value.slice(5,7))+'月'+Number(value.slice(8))+'日';
const issueURL=value=>{const url=new URL(location.pathname,location.origin);url.searchParams.set('date',value);return url.href};
function element(tag,text){const node=document.createElement(tag);node.textContent=text;return node}
function link(label,url){const node=element('a',label);node.href=url;return node}
for(const entry of dates){select.add(new Option(dateLabel(entry),entry))}
select.value=date;
select.addEventListener('change',()=>location.assign(issueURL(select.value)));
if(requested&&requested!==date)document.getElementById('notice').textContent='该日期暂无归档，以下为最近一期。';
document.title='Wine Daily · '+dateLabel(date)+' · SOMM100';
archive[date].forEach((story,index)=>{
 const id='story-'+(index+1),li=document.createElement('li');li.append(link(story.title,'#'+id));document.getElementById('toc').append(li);
 const article=document.createElement('article');article.id=id;
 article.append(element('small',date.replaceAll('-',' / ')+'     ·     '+String(index+1).padStart(2,'0')),element('h2',story.title));
 for(const paragraph of story.body)article.append(element('p',paragraph));
 const sources=document.createElement('div');sources.className='sources';sources.append(element('span','来源'));
 for(const [name,url] of story.sources){const a=link(name,url);a.target='_blank';a.rel='noopener noreferrer';sources.append(a)}
 article.append(sources);document.getElementById('stories').append(article);
});
const n=dates.indexOf(date),neighbors=document.getElementById('neighbors');
for(const [entry,label] of [[dates[n+1],'上一期'],[dates[n-1],'下一期']]){
 if(entry)neighbors.append(link(label+' · '+dateLabel(entry),issueURL(entry)));
}
document.getElementById('share').addEventListener('click',async()=>{
 const url=issueURL(date),feedback=document.getElementById('feedback'),box=document.getElementById('copyBox');
 feedback.textContent='';box.hidden=true;
 if(navigator.share){try{await navigator.share({title:document.title,url});return}catch(err){if(err.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(url);feedback.textContent='已复制本期链接';}catch{box.hidden=false;box.value=url;box.focus();box.select();feedback.textContent='可复制本期链接';}
});
</script></body></html>
