<script id="editions" type="application/json">{"2026-11-18":[{"title":"勃艮第出口量增加3.5%，收入反而减少1.4%：为什么白葡萄酒与Crémant成了推动力？","body":["勃艮第葡萄酒行业组织根据海关资料整理的最新12个月统计，展示出一个与高端葡萄酒的传统印象并不完全吻合的市场。 截至2026年8月的连续12个月 ，勃艮第对外发运近1.01亿瓶葡萄酒，比上一年同期增长3.5%，但出口总收入约16.5亿欧元，下降1.4%。按已公布的四舍五入总额估算，每瓶出口收入下降约4.7%。这不是一份单一酒庄的损益表；平均值受到产品组合、价格、目的地和年份的共同影响，不能直接解释为每款酒统一降价。","增长主要由白葡萄酒与Crémant de Bourgogne带动：Crémant出口多约210万瓶，白葡萄酒多约240万瓶。Chablis、Petit Chablis与Mâcon等产区在报道中被列为重要贡献者。与此同时，红葡萄酒出口减少约112万瓶，Côte de Beaune与Côte de Nuits部分村级酒的出口量跌幅达到16.1%。这说明即使在世界知名产区，颜色、价位和饮用场景也可能比区域总名气更能解释短期销售差异。","出口目的地同样分化：美国市场的勃艮第出口量下降6.9%、金额下降17.9%，英国分别增长13%与3%。美国的关税和既有库存可能是因素之一，但这仍是行业资料提供的解释，而非证明任何单一政策造成全部变化。比较这些数字时，应把出口、法国本土销售、酒庄现金流和零售市场分开。 出口多了但收入少了 ，是一个需要继续观察的市场信号，尚不能称为产区全面复苏或全面危机。","原题与出处：   Burgundy earned less from wine exports despite shipping nearly 101 million bottles abroad ，Vinetur，2026-11-17；所依据行业更新约在11月15—16日披露，统计截至2026-08。原始报道。"],"sources":[["原始报道","https://www.vinetur.com/en/20261117111276/burgundy-earned-less-from-wine-exports-despite-shipping-nearly-101-million-bottles-abroad.html"]]},{"title":"美国葡萄酒零售量跌5%，起泡酒却增长：市场究竟发生了什么？","body":["美国NielsenIQ在11月16日发布的滚动四周零售监测显示， 截至11月7日的四周 ，其覆盖渠道的葡萄酒销售额同比下降3.4%，销售量下降5.0%。这两个负数并不相等，意味着单位销量对应的平均销售额有所变化，但这个变化可能与品类结构、促销和价格有关，不宜直接作为通胀率。前一个滚动四周（截至10月31日）的跌幅为金额3.8%、数量5.3%；本次略有改善，但两个观察窗口部分重叠，不能因此宣布市场趋势已经反转。","按品类拆开，静态葡萄酒金额下降4.3%、数量下降5.5%；起泡酒金额反而增长2.3%、数量增长1.4%；无醇葡萄酒金额增长18.9%、数量增长14.4%。这三个方向不同，提示消费场景和产品定位正在分化。不过无醇葡萄酒基数仍较小，高增长率不代表已成为主流。节假日临近也可能影响品类结构，现有数据没有直接证明增长由哪一种消费动机引起。","NielsenIQ覆盖的是可监测的美国零售渠道，不包含所有餐厅、酒庄直销或其他未追踪交易。因此“零售销量下降5%”不等于“美国全部葡萄酒消费下降5%”，也不等于所有高档葡萄酒都在下跌。真正专业的讨论，必须同时看时间窗口、销售渠道、品类、售价以及真正购买的人群。","原题与出处：   U.S. Retail Wine Sales Fell 3.4% in the Four Weeks Through Nov. 7 ，Vinetur，2026-11-17；NielsenIQ数据公布于2026-11-16，统计窗口截至2026-11-07。原始报道。"],"sources":[["原始报道","https://www.vinetur.com/en/amp/20261117111275/us-retail-wine-sales-fell-34-in-the-four-weeks-through-nov-7.html"]]},{"title":"西班牙启动三年砧木研究：耐旱不等于只换一个葡萄品种","body":["2026年11月16日，西班牙Castilla-La Mancha自治区政府在Tomelloso宣布启动RESILVIÑA研究计划。该项目预计进行36个月，以Macabeo和Tempranillo接穗嫁接到不同砧木上，开展田间试验，比较水分压力、热胁迫下的生长表现和葡萄酒酿造相关品质。项目由地方葡萄酒合作社、地下水用户组织、农村发展机构、IRIAF和大学共同参与。","葡萄酒课堂常把干旱应对简化为“种更耐热的葡萄”，但对于已经种植多年的葡萄园，砧木可能同样重要。根系如何利用土壤中的水分、面对土壤盐分和石灰质的耐受性、接穗生长强度与成熟节奏，都可能影响水资源管理。然而选择砧木并非万能答案：过强的树势、成熟延迟、品质变化和经济成本也可能成为代价。同一砧木在不同土壤和年份的表现不必一致。","RESILVIÑA是已经启动的研究，不是已经完成三年试验，更不是官方公布了某个能让所有Tempranillo或Macabeo免于干旱的新砧木。36个月后是否可以形成普适种植建议，仍取决于试验设计、年份条件、葡萄藤健康和实际酿酒结果。对于侍酒师，这类研究也提醒我们：风土表现来自品种、砧木、土壤、气候和人的种植选择的共同作用。","原题与出处：   El Grupo Operativo RESILVIÑA estudiará durante tres años cómo mejorar la resistencia del viñedo a la sequía y al calor ，Castilla-La Mancha自治区政府，2026-11-16；同日正式介绍项目，Vinetur于11月17日跟进。政府一手公告。"],"sources":[["政府一手公告","https://www.castillalamancha.es/actualidad/notasdeprensa/el-grupo-operativo-resilvina-estudiara-durante-tres-anos-como-mejorar-la-resistencia-del-vinedo-la"]]},{"title":"中国市场里的“多色波尔多”：一个老产区怎样调整被消费者认识的方式？","body":["《葡萄酒商业观察》于11月17日刊出对波尔多行业组织CIVB的采访，回顾10月27日在广州举办的“2026波尔多体验”。报道介绍了12家酒庄与参与企业、40多家进口商，以及近500款不同法定产区与风格的酒款。讨论重点不只是列级庄红葡萄酒，还包括干白、甜白、桃红与波尔多起泡酒。这里需要特别区分： 活动发生在10月27日，11月17日是新的专题报道发表日 ，不能写成当天才举办的展会。","报道援引CIVB的产量构成：波尔多红葡萄酒约82%，干白约9%，甜白约1%，桃红和起泡酒各约4%。红葡萄酒仍然是产区核心，但产区正尝试让其他风格进入日常佐餐与朋友聚餐。CIVB受访负责人称，中国市场仍具有关键出口价值；与此同时，报道回顾2025年波尔多对中国大陆出口量和金额都明显下滑。该市场的长期重要性与最近一年表现承压可以同时成立。","这里不能把协会营销活动宣传直接当成中国消费者需求的全国统计。近500款展示酒也不意味着都已进入中国流通；参会进口商数也不等于实际签约数。更值得理解的是产区教育如何从单一“顶级红酒”形象转向不同颜色、酸度、甜度和价格带的真实使用场景。这为侍酒师提供了更完整的波尔多表达方式，而不是仅记住1855分级。","原题与出处： 《“多色波尔多”！老牌产区开启第二增长曲线》，葡萄酒商业观察，2026-11-17 09:32；广州活动2026-10-27。原始采访报道。"],"sources":[["原始采访报道","https://www.wbo529.com/info/5167"]]},{"title":"加拿大拟再投入1.769亿加元：葡萄酒生产扶持与实际获款有何区别？","body":["加拿大政府11月13日在Niagara-on-the-Lake发布消息， 2026联邦预算提议 自2027—2028财年起连续三年投入1.769亿加元，续办Wine Sector Support Program。该项目旨在支持加拿大获得许可的葡萄酒生产者，应对生产成本与市场竞争压力，维持对当地葡萄种植者的采购，并巩固乡村就业与酒旅经济。政府指出，此轮拟议投入建立在此前累计3.43亿加元投资基础上。","一项针对整个酒业的公共支持计划与某家酒庄实际拿到补助，两者完全不同。现有官方项目页面显示原有一轮申请期已经结束，并不代表新预算公布后立刻重新开放申请。新一期的实际资格、受理时间、拨付规则和具体获批企业，还需要后续实施公告确认。 预算提议不能写成1.769亿加元已经发放到酒庄账户。","加拿大葡萄酒产业存在不同气候与种植系统：Ontario与British Columbia的葡萄酒、冰酒及当地葡萄园管理需求都不能混成一种模式。政府资金也不必然代表所有加拿大葡萄酒的售价下跌或质量提升。更合理的行业观察，是看资金最终是否帮助酒庄维持葡萄采购、实现生产调整，以及是否在市场上创造长期竞争力。","原题与出处：   Secretary of State van Koeverden announces major support through Budget 2026 to strengthen Canada’s wine sector ，Government of Canada，2026-11-13；同日在Ontario宣布，计划从2027–2028财政年度开始。加拿大政府正式公告；现行计划受理状态。"],"sources":[["加拿大政府正式公告","https://www.canada.ca/en/canadian-heritage/news/2026/11/secretary-of-state-van-koeverden-announces-major-support-through-budget-2026-to-strengthen-canadas-wine-sector.html"],["现行计划受理状态","https://agriculture.canada.ca/en/programs/wine-sector-support"]]}],"2026-11-17":[{"title":"伯恩慈善拍卖落槌：勃艮第白葡萄酒桶价大跌约三成，红葡萄酒为何反向增长？","body":["11月15日，第166届Hospices de Beaune慈善葡萄酒拍卖落幕。11月16日公布和整理的最终成交数据显示，在公布的比较口径下，白葡萄酒平均每桶40,576欧元，较去年下降31.36%；红葡萄酒平均每桶29,014欧元，同比增长5.55%；综合平均每桶31,284欧元，下降7.99%。","这与拍卖前报道的供应紧缩同时发生。Hospices自身葡萄园经历2026年夏季干旱及高温，可出售酒桶仅432桶及两只半桶，比上一年明显减少。通常我们会以为供应减少就会普遍推高价格，但这次不同颜色酒款的结果恰恰说明，买家需求并不会均匀地分配到所有产品。高端白葡萄酒的买家可能更加谨慎，而部分红酒仍保持竞价强度。","今年慈善特别酒桶Pièce des Présidents首次选用Clos de Vougeot Grand Cru，以77万欧元落槌。Faiveley家族另追加23万欧元捐助，使该项慈善收益达到100万欧元，受益方包括ARSLA与DEBRA France。 77万欧元是竞拍槌价，100万欧元是计入额外捐助的公益总额 ，两者不能混淆。","伯恩慈善拍卖是具有特殊公益性质的交易，酒款结构、拍卖量、慈善诉求及买家构成每年都有差异。因此，白葡萄酒在这一场拍卖下跌31.36%，不能直接解释为全世界白勃艮第市场均价下降31.36%，更不能据此断定2026年份品质不佳。还需留意不同来源在是否纳入费用、特殊酒桶及半桶方面采用的均价统计口径并不完全相同。","事实时间与出处：  拍卖事件2026-11-15；Vinetur最终价格分析与其他拍卖结果报道均发布于2026-11-16。原题： White Wine Prices Fell 31.36% at the Hospices de Beaune Charity Auction 。原文：Vinetur结果分析、Hospices拍卖结果整理。"],"sources":[["Vinetur结果分析","https://www.vinetur.com/en/20261116111166/white-wine-prices-fell-3136-at-the-hospices-de-beaune-charity-auction.html"],["Hospices拍卖结果整理","https://larevueduluxe.com/en/gastronomy/hospices-de-beaune-2026-auction-results/"]]},{"title":"奥地利拟以最多500万欧元实施危机蒸馏：陈年红葡萄酒库存为何成为压力？","body":["11月15日，奥地利农业主管部门宣布，欧盟委员会计划提供最多500万欧元，支持奥地利对 2024年份及更早年份红葡萄酒 开展危机蒸馏。16日的专业媒体进一步报道了这项拟议措施。","危机蒸馏不是为改善某款葡萄酒的香气或质量，而是一种供给管理措施：将难以通过正常销售渠道消化的葡萄酒从饮用葡萄酒市场移走，送往蒸馏处理，以期减轻供应过剩和价格压力。奥地利葡萄种植组织表示，部分酒庄持有较早年份的红葡萄酒，需求不足使库存占用空间与资金。","总计最多500万欧元并不是将直接平均发给葡萄种植者。官方说明，收集、临时存放与运输到蒸馏设施的费用也需要从计划资金中支付，剩余部分才可能向实际参加的生产者提供补偿。生产者最终可获得的金额、申报条件与程序都尚未确定。","欧盟委员会计划于 12月4日 向相关委员会提交条例草案，明确实施要求与补偿价格。这意味着目前可以确认的是资金安排的官方宣布和计划方向， 不能声称已开始全面收酒、完成蒸馏或已付款 。","这件事说明一国葡萄酒产业的困难并不总是来自当年减产。葡萄园可能在同一年面临不稳定的天气、旧年份库存难以售出以及新年份必须继续采收的多重压力。对于理解葡萄酒行业而言，产量、库存年龄、市场消费、债务和现金流是彼此相关却不能互相替代的指标。","事实时间与出处：  奥地利农业部公告2026-11-15；Vinetur报道2026-11-16；拟提交欧盟法规草案2026-12-04。原文：奥地利农业部官方公告、Vinetur报道。"],"sources":[["奥地利农业部官方公告","https://www.bmluk.gv.at/service/presse/landwirtschaft/2026/totschnig-5-millionen-euro-zur-stabilisierung-des-oesterreichischen-weinmarktes.html"],["Vinetur报道","https://www.vinetur.com/en/20261116111130/european-commission-backs-austria-with-5-million-euros-to-distill-surplus-red-wine.html"]]},{"title":"欧盟对外葡萄酒出口金额跌得比数量快：真正发生了什么？","body":["11月13日，欧洲农业组织Copa-Cogeca在布鲁塞尔相关会议讨论葡萄酒行业状况。11月16日发表的后续报道援引Legacoop等公布的数据： 2025年9月至2026年8月 ，欧盟对非欧盟国家的葡萄酒出口金额约154亿欧元，同比减少6.8%；出口数量约2750万百升，同比下降3.3%。","这两个下降幅度不一样，暗示欧盟葡萄酒对外贸易平均实现价值有所减弱。但不能仅凭总额和总量，就推断每一款酒都降价：出口国家、价格带、瓶装与散装比例也可能改变整体均值。","不同市场的表现同样分化。报道中的美国市场出口金额下降15.3%，加拿大下降11%，英国下降3.9%。在包装类型方面，散装葡萄酒的数量或相关表现与瓶装、起泡酒的走势并不一致；所援引细分统计中散酒和Bag-in-Box呈增长，而瓶装及起泡酒承压。 非欧盟市场的出口数据并不涵盖欧盟内部成员国之间的贸易 ，也不是消费者在超市和餐厅实际喝掉的总数量。","当需求减弱时，生产者可能试图通过新的渠道、包装形式、产品定位和产区故事维持经营，但扩大曝光不能替代真实订单和利润。也不能把葡萄酒贸易收入下滑6.8%解释为2026年份葡萄品质整体下降。","这份统计在11月13日已开始被行业媒体讨论，因此11月16日属于后续发表的新分析，不是新发生的贸易活动。原始完整统计表本期没有独立取得，报道中的细分值保持为行业组织资料口径。","事实时间与出处：  贸易统计2025-09至2026-08；布鲁塞尔行业会议2026-11-13；Vinetur报道2026-11-16。原题： European Union wine exports fell 6.8% to €15.4 billion 。原文：Vinetur贸易报道、相关行业数据分析。"],"sources":[["Vinetur贸易报道","https://www.vinetur.com/en/20261116111116/european-union-wine-exports-fell-68-to-euro154-billion.html"],["相关行业数据分析","https://www.winemag.it/en/european-wine-2026-harvest-data-country-by-country/"]]},{"title":"意大利餐厅酒单开始更重视杯卖和配餐：是酒卖得少了，还是人们喝酒的方式改变了？","body":["11月16日，WineNews介绍意大利餐饮分销企业Partesa对于Horeca消费场景的观察。Partesa与超过32,000家客户保持业务联系、经营超过7,000种产品，因此能够从酒吧、餐厅和不同饮用场景观察市场变化。报道同时援引FIPE/Tradelab数据称，2025年意大利外出餐饮消费市场金额约846亿欧元。这是整体市场规模，并非葡萄酒单一品类的收入。","Partesa认为，酒精饮品的选择越来越取决于 什么时候喝、跟什么食物喝、愿意承担什么价格 。下午及傍晚的Aperitivo仍有Spritz、起泡酒和Vermouth的空间；午餐中顾客常选择直接、适合食物且负担较低的饮品，杯卖葡萄酒与啤酒都重要；晚餐时葡萄酒与菜肴的结合仍然核心；餐后则更多出现烈酒、鸡尾酒与苦味酒。","更值得关注的是非葡萄酒选项正进入配餐体系。啤酒并不限于搭配披萨，某些餐厅也探索鸡尾酒配菜。低醇、无醇选项让客人能够在不饮用常规酒精饮品时保留社交和配餐体验。这不意味着所有饮品都可随意互换：啤酒、葡萄酒、鸡尾酒在酸度、苦味、甜度、酒精感和质地上具有不同的配餐能力。","报道提出了一个经营概念：一份更长的酒单，不一定是一份更好的酒单。真正重要的是让不同价格段、容量和饮用场景的选择清晰且符合餐厅菜式。选择更有针对性的产品，也可能减轻采购、员工培训与库存管理压力。","但 Partesa是商业分销企业，其客户观察并非全国概率抽样实验 。不能因为它与32,000家客户合作，就认为每家意大利餐厅都已经发生相同比例的转变，也不能直接把意大利习惯套用到其他国家。","事实时间与出处：  WineNews发表于2026-11-16；文中2025年餐饮市场规模为历史统计，消费者观察为近期Partesa业务分析。原题： Carte più mirate, il ruolo del pairing: cambiano i consumi fuori casa, ma il vino resta protagonista 。WineNews原文。"],"sources":[["WineNews原文","https://winenews.it/it/carte-piu-mirate-il-ruolo-del-pairing-cambiano-i-consumi-fuori-casa-ma-il-vino-resta-protagonista_607833/"]]}],"2026-11-16":[{"title":"伯恩慈善拍卖只有432桶酒：2026年勃艮第采收压力如何影响市场？","body":["11月15日，第166届Hospices de Beaune慈善葡萄酒拍卖在法国伯恩举行。根据AFP于当天发布、Euronews转载的现场报道，庄园拥有约60公顷葡萄园，2026年经历漫长的干旱与热浪，采收量大约只有通常的一半。今年可供拍卖的为432桶酒以及两个半桶；接近2021年358.5桶的低位。就整个勃艮第而言，报道引用的估计产量比前五年均值低26%。","这不是普通葡萄酒电商的年度销售会。Hospices持有葡萄园并将新年份酒以桶为单位竞拍，收益用于医院的设施投资及指定公益事业。活动吸引各地买家，也常被行业观察者当作勃艮第高价市场情绪的一个窗口。但慈善拍卖的特殊性、买家结构、公益溢价、酒款组合都使它不能直接代替整个勃艮第的市场价格指数。","在天气层面，2025—26年冬季的降雨为葡萄藤储存了一些水分，却没有完全抵消2026年夏季的高温干旱影响。数量下降不等于每个地块的酒质同步下降。报道中已有酿酒从业者对风味潜力作出积极评价，但这属于专业人士的早期判断，不是经过瓶陈和系统品鉴的年份定论。","需要特别注意现场报道的时间边界：文章发表时拍卖正在进行，没有足够证据确认最终总成交额及每桶最终均价，所以不能宣称今年已经打破总额纪录。","来源／原题：AFP via Euronews， Climate change cuts Hospices de Beaune harvest, fewer barrels at Burgundy charity auction ；发表2026-11-15；事件2026-11-15。"],"sources":[["原始报道","https://www.euronews.com/2026/11/15/climate-change-cuts-hospices-de-beaune-harvest-fewer-barrels-at-burgundy-charity-auction"]]},{"title":"宁夏16家酒庄亮相浙江青田：海外侨商渠道能带来真正的成交吗？","body":["11月13日至15日，第八届青田侨博会暨进口葡萄酒交易会在浙江青田举办。中国新闻网11月15日报道，来自贺兰山东麓的16家精品酒庄在展会亮相，尝试借助青田的侨商网络接触境内外采购与葡萄酒贸易渠道。这是一场浙江青田的展会，不应与11月初宁夏酒庄赴香港参加葡萄酒展的另一活动混为一谈。","青田与海外华商之间的长期往来，是这场展会的商业背景。对于宁夏生产者，葡萄酒从产区走向新市场，不只是让更多人看见酒标，更要建立经销商对产品年份、供应数量、物流时效和产品表达的信任。展会中的品鉴、对接、宣传，可以降低初次接触成本，但后续正式合同、付款、报关、仓储与复购才真正决定出口业务是否成立。","新闻中的16家酒庄是一组参展数量，并非16份新增海外代理合同；展商数量和展示酒款数量也不能等同实际交易瓶数。本期尚未取得这些参展酒庄逐家的订单、合同金额或后续复购数据，故不能把“拓展海外市场”的活动目标写成已经实现的经营成果。","这一新闻更适合被理解为中国本土产区寻找渠道的阶段性探索。对进口商与酒店采购而言，产区故事能否转化为持续购买，需要建立在产品品质、价格、真实服务和长久关系上。","来源／原题：中国新闻网，《宁夏贺兰山东麓葡萄酒亮相青田侨博会 借侨为桥开拓海外市场》；发表2026-11-15；展会2026-11-13至15。"],"sources":[["中国新闻网原文","https://www.chinanews.com/cj/2026/11-15/10732439.shtml"]]},{"title":"Prosecco在法国大型超市略超Champagne：为什么不能据此宣布香槟全面失守？","body":["根据Circana整理的法国大型超市与大卖场数据，截至2026年7月的连续12个月，消费者在相应渠道购买约2531万瓶Prosecco，同比增长10.1%；同期Champagne约2523万瓶，同比下降4.6%。两者相差大约8万瓶，只占各自销量的极小比例。","11月12日英国《泰晤士报》及11月15日行业媒体再次报道这组数字。一个容易误读的地方是其统计范围：这不是全法国的葡萄酒总销量，而是不包括许多独立酒商、餐厅、酒店、直销及折扣零售的特定渠道。行业报道指出，若将法国全渠道计算，Champagne整体消费量仍明显领先Prosecco。","两类酒在平均零售价上也存在很大距离：有关报道引用法国大型零售样本中Prosecco约6.24欧元、Champagne约24.95欧元一瓶。价格、促销、轻松饮用的场景及Spritz类鸡尾酒的普及，可能影响超市消费者的选择。不过“更便宜”并不直接说明风格或质量孰优孰劣，二者的法定产地、生产方式及陈年要求亦不同。","报道对于究竟是“首次超过”还是“连续第二年”的描述存在差异，可能涉及比较期间及零售覆盖口径。本期采用可交叉核对的12个月具体瓶数，而不把有争议的“首次”当作确定事实。更不能从一家超市的购买数据推断精品香槟收藏者的消费行为。","来源／原题：The Times， Prosecco sales bubble up to beat champagne in French supermarkets ，2026-11-12；Vinetur后续2026-11-15；数据期间截至2026年7月的12个月。","The Times报道 · 11月15日行业报道"],"sources":[["The Times报道","https://www.thetimes.com/world/europe/article/champagne-flat-prosecco-french-supermarkets-8nt9pp0k0"],["11月15日行业报道","https://www.vinetur.com/en/20261115111068/prosecco-overtook-champagne-in-french-supermarkets-for-the-first-time.html"]]},{"title":"Lugana DOC在意大利零售逆势增长：为什么要同时看数量和金额？","body":["意大利加尔达湖南岸的Lugana DOC，以Turbiana白葡萄为重要身份。11月10日Wine Meridian报道，Consorzio Tutela Lugana DOC援引NielsenIQ的数据显示，截至2026年8月的12个月，Lugana在意大利大型现代零售渠道的销售额增长18.1%，销售数量增长18.4%，比去年同期增加约320万欧元销售额。","对照来看，报道使用的意大利白葡萄酒相关零售市场同期销售额下降0.7%。这组结果的关键不仅是Lugana卖得更贵：因为销售数量增幅同样明显，至少在统计涵盖的渠道里，消费者确实购买了更多酒。","但不能用这组零售数字断言整个Lugana法定产区已经实现同幅度的全年销售增长，或生产者平均利润也增长18%。餐厅、酒店、酒庄直销、出口市场与大型零售渠道的购买结构可能非常不同。此外，零售价值增长是消费者端的结果，不等于上游酒庄收到的净收入增幅。","这则新闻也给葡萄酒教育一个提示：一个传统产区的认知度可以随着稳定的产品质量、餐酒场景和渠道传播逐渐积累，而非必须通过极高单价实现增长。要确认长期趋势，仍需比较多年度的真实销量、平均成交价格、复购和产区出口。","来源／原题：Wine Meridian， Lugana DOC in crescita nella GDO: +18,1% a valore e +18,4% a volume ；发表2026-11-10；NielsenIQ统计截至2026年8月。"],"sources":[["Wine Meridian原文","https://www.winemeridian.com/news/lugana-doc-crescita-vendite-gdo-crescita-nielseniq-agosto-2026/"]]},{"title":"美国白葡萄酒不只有Chardonnay：五种小众品种为何值得关注？","body":["美国葡萄酒产业长久以来以Chardonnay、Sauvignon Blanc和经典红葡萄品种闻名。但11月9日，Decanter发表一篇关于美国新兴白葡萄品种的专题，选出Albariño (Alvarinho)、Aligoté、Vermentino、Pinot Blanc与Petit Manseng作为观察对象。这是葡萄品种及酒庄实践的趋势专题，而不是11月15日新发布的官方全国种植数据。","其意义在于理解美国不同区域正尝试寻找更适合自己气候、客群与风格目标的葡萄。Albariño在西海岸的一些酒庄被探索，Aligoté可以为俄勒冈州的白葡萄酒增加品种表达；Vermentino、Pinot Blanc和Petit Manseng则在不同气候及餐酒场景中寻找定位。","这些品种种植面积仍较小，不等于美国已经大规模放弃Chardonnay，更不能因为文章提到“增长”就断言它们已经取得全国零售优势。品种移植的长期表现还取决于砧木、葡萄园选址、采收、酿造及市场是否真正接受。","对于葡萄酒学习者，这是一项有趣的产区横向比较：同样的葡萄品种在原产区之外如何改变表达？哪些风格被当地酒庄保留，哪些被重新诠释？相关答案最终仍要回到具体的酒庄、葡萄园及盲品观察，而不是单凭品种名称决定品质。","来源／原题：Jillian Dara，Decanter， White wines to watch: 5 grape varieties emerging around the US ；发表2026-11-09，属本期向前扩展七天的专题参考；部分内容为会员阅读，本文仅基于公开可核内容独立整理。"],"sources":[["Decanter原文","https://www.decanter.com/wine/usa/white-wines-to-watch-5-grape-varieties-emerging-around-the-us/"]]}],"2026-11-15":[{"title":"香槟前十个月发货量增长2%，为何酒农与合作社没有一起增长？","body":["2026年1月至10月，香槟对法国国内与海外市场合计发货2.036亿瓶，同比增长2%。这个看似温和的回升主要来自海外：出口1.284亿瓶，增长5.6%；法国本土7530万瓶，下降3.5%。海外发货占比已超过63%。需要注意的是，这里统计的是酒庄向销售渠道的发货量，并不是终端消费者实际开瓶或购买量。","更重要的差别出现在生产者类型。香槟大酒商的前十个月发货量增4.1%至1.554亿瓶；独立种植者下降4.4%至3210万瓶；合作社下降3.3%至1620万瓶。种植者在出口端仍增长6.2%，但不足以抵消法国本土需求的减少。合作社的出口发货反而下降8.7%。","如果只看10月单月，整体发货又下降3.4%至2960万瓶；法国市场下降7.3%，海外下降1%。这说明“前十个月增长”和“最近一个月转弱”可以同时成立。2025年全年香槟发货约2.66亿瓶，2026年最终全年表现还要看年末节庆季。对于行业学习和采购，最需要问的是：增长来自哪个渠道、哪一类生产者，以及发货之后是否真正消化了库存。","来源／原题：  Champagne shipments rose 2% through October, driven by exports · 发布：2026-11-14 · 事件：Comité Champagne 2026年1—10月发货统计；10月单月表现"],"sources":[["原文与详细来源","https://www.vinetur.com/en/20261114111037/champagne-shipments-rose-2-through-october-driven-by-exports.html"]]},{"title":"OIV在宁夏通过新酿造技术标准：脉冲电场能否改变葡萄酒微生物稳定方式？","body":["10月12日至16日，国际葡萄与葡萄酒组织OIV的第47届世界葡萄与葡萄酒大会在宁夏银川举行，10月16日的大会决议涉及酿造、葡萄园遗传多样性、分析方法和法规整理。11月14日的行业报道重新聚焦其中16项决议。首先必须说明：这不是11月14日才发生的新投票。","值得关注的是脉冲电场（PEF）。这种技术通过短时电脉冲改变微生物细胞膜的完整性，可用于降低葡萄汁和葡萄酒中不希望出现的微生物。对某些含残糖产品，微生物稳定尤其关键，因为停止发酵并保留甜度往往涉及温度、过滤与二氧化硫等多种管理手段。PEF提供的是一个潜在的技术工具，并不是生产者以后都可以不使用二氧化硫的承诺。","大会还涉及乳酸发酵管理、蛋白稳定、酒石稳定、白葡萄酒褐变控制、低度酒精测定、锶同位素来源分析及老藤遗传多样性保存。相关决议为国际技术协调提供参考，但OIV认可与某一国家、某一法定产区立即允许商业使用，是不同层级；具体应用仍需遵循当地法律和产品规范。对于侍酒师，这是一条连接微生物稳定、残糖、发酵控制与葡萄酒标准化的重要研究线索。","来源／原题：  OIV approves pulsed electric fields to stabilize grape musts and wines · 发布：2026-11-14（后续专业报道） · 事件：OIV第24届大会于2026-10-16在宁夏银川通过16项决议"],"sources":[["原文与详细来源","https://www.vinetur.com/en/20261114111039/oiv-approves-pulsed-electric-fields-to-stabilize-grape-musts-and-wines.html"],["OIV银川大会原始报道（2026-10-16）","https://www.oiv.int/index.php/it/area-stampa/china-hosted-47th-oiv-world-congress-vine-and-wine-marking-historic-first-asia"]]},{"title":"上海精品葡萄酒贸易平台申请破产清算：高价库存与客户交割风险正在显现","body":["上海自贸区葡萄酒交易中心WINEXSH向法院申请破产清算的消息，揭示了精品葡萄酒贸易与库存融资之间的脆弱关系。根据媒体查询的全国企业破产重整案件信息，10月17日已有申请公告；10月29日浦东新区法院举行了相关听证。11月13日的报道不是法院已裁定公司破产的公告；公开记录尚不足以证明法院已受理并作出最终裁定。","报道引用前供应商与客户的说法，涉及未支付订单、已购买葡萄酒提取困难，以及退款延迟。这些个案尚需具体合同与法院材料核实，不能将全部指控直接认定为法院查明的事实。","这类业务可能同时面临三个风险：早期以较高价格采购的波尔多期酒或勃艮第现货，遇到二级市场价格下跌；酒瓶可能存放在保税仓或第三方库中，所有权与实际提货安排并不简单；贸易企业还可能承担采购融资和客户预收款压力。价格下跌本身不会自动导致破产，关键在于库存估值、现金流、合同执行和债务安排。消费者与酒商在交易贵价酒时，应特别重视实物存在、仓储凭证、资金归属和提货条款。","来源／原题：  Shanghai fine wine trader WINEXSH seeks bankruptcy liquidation · 发布：2026-11-13 · 事件：企业申请公告2026-10-17；法院听证据报道于2026-10-29举行"],"sources":[["原文与详细来源","https://www.vinetur.com/en/20261113110975/shanghai-fine-wine-trader-winexsh-seeks-bankruptcy-liquidation.html"]]},{"title":"30个葡萄品种的两年田间试验：抗旱能力未必能按品种简单排序","body":["面对持续变化的降雨与灌溉成本，种植者常将某些葡萄品种归类为“更耐旱”。华盛顿州立大学一项涉及30个酿酒葡萄品种、连续两个生长季的田间研究，给这种简单标签提出了挑战。11月14日的报道指出，在研究的种植地点和观察条件下，不同品种对于减少供水所表现的生理反应，整体上比预想中更接近。","这一发现并不表示所有葡萄品种在任何环境都具有相同的耐旱能力。土壤保水能力、根系实际可获得的水分、树冠叶面积以及当年的气候条件，都可能影响葡萄藤水分消耗。即使同一品种，在不同地块、砧木和管理条件下也可能表现不同。","对葡萄园管理而言，更稳妥的做法是测量实际水分压力，结合每块葡萄园的土壤、叶面积和生长状况调整灌溉，而非仅凭品种名称设定固定方案。由于本期未独立取得研究全文与详细试验设计，也不能据媒体报道推出全球通用的灌溉标准。这项研究的意义在于提出有价值的检验问题，而不是已经给出了唯一答案。","来源／原题：  Study finds winegrape varieties respond similarly to drought · 发布：2026-11-14 · 事件：Washington State University为期两年的田间研究，论文具体发表日待追溯"],"sources":[["原文与详细来源","https://www.vinetur.com/en/20261114111038/study-finds-winegrape-varieties-respond-similarly-to-drought.html"]]},{"title":"美国无醇葡萄酒销售额增长17%，但品类仍不足整个市场的1%","body":["美国无醇葡萄酒正在一个整体承压的葡萄酒市场中增长。Impact Databank根据NielsenIQ零售渠道数据指出，截至2026年10月3日的52周，无醇葡萄酒销量同比增加12%，销售金额增长17%。然而，这个品类仍不足美国葡萄酒市场的1%。高增速与规模很小可以同时成立。","在品牌层面，Fre、Giesen 0%、Ariel等已有一定规模；某些企业还推出小罐包装、无醇起泡酒与低卡路里酒饮。报道另外引用基于Circana的品牌数据，统计区间、品牌出货/零售定义与NielsenIQ市场总量未必完全一致，不能将不同来源直接相加。","在消费者体验上，无醇葡萄酒也不是“普通葡萄酒直接把酒精拿走而风味不变”。脱醇可能影响挥发性香气、口感、甜酸平衡与稳定性，产品是否让消费者满意还需要感官测试。对于葡萄酒教育与零售，理解客人为何选择不饮酒、减量饮酒或低醇选择，比假设所有人都在全面放弃传统葡萄酒更重要。此数据来自美国零售渠道，不能直接当作中国门店需求预测。","来源／原题：  Non-alcoholic wine sales rose 17% in U.S. retail channels · 发布：2026-11-13 · 事件：Impact Databank于2026-11-12发布统计；NielsenIQ截至2026-10-03的52周数据"],"sources":[["原文与详细来源","https://www.vinetur.com/en/20261113110974/non-alcoholic-wine-sales-rose-17-in-us-retail-channels.html"]]}],"2026-11-14":[{"title":"欧洲2026/27葡萄酒与葡萄汁预计1.336亿百升：减产4%，市场为何仍感到压力？","body":["欧洲农业组织Copa-Cogeca在11月12日公布的初步数据预计，欧盟2026/27销售年度葡萄酒及葡萄汁产量约1.336亿百升，较上一个年度减少4%，比近五年平均水平低约8%。这一消息由WineNews在11月13日报道。意大利预计4110万百升，较上季减少7.6%；西班牙预计3450万百升，反而增长约3%；法国在这组跨国估计中约3380万百升。三国合计占欧盟总产量约82%。","这些差异说明，欧洲不能被当成单一的“低产年份”。不同地区遭遇干旱、热浪、雨水与种植面积变化的程度不同，而且各国预测方法和更新日期可能不同。例如法国农业机构Agreste此前公布的估计与本次欧盟行业组织采用的数字并不完全一致。研究2026年份时，必须保留发布机构及预测日期，不能混用成一个“官方终值”。","更重要的是，产量减少不一定带来涨价。Copa-Cogeca同时指出，2025年9月至2026年8月欧盟对非欧盟出口额约154亿欧元、同比下降6.8%；消费者需求和生产成本的压力仍然存在。葡萄园若销售额和价格持续承压，即使减产，盈利也未必改善。此次数据仍是行业组织估计，不是所有企业最终申报的生产实绩。","原题 ： La vendemmia 2026 in Europa a -4% sul 2025 ... Le stime Copa-Cogeca ；WineNews， 2026-11-13 。原始行业估计发布于 2026-11-12 。阅读报道。"],"sources":[["阅读报道","https://winenews.it/it/la-vendemmia-2026-in-europa-a-4-sul-2025-133-milioni-di-ettolitri-le-stime-copa-cogeca_607657/"]]},{"title":"中国葡萄酒双11没有“全线爆发”：折扣越来越多，为什么部分商家仍只卖得和去年差不多？","body":["11月13日，《葡萄酒商业观察》走访了参与今年双11的葡萄酒电商。部分受访商家表示，销售与上年基本持平或略有下降，价格补贴对成交的刺激也没有过去那么明显。京东已经公布的葡萄酒品牌销售榜前三为奔富、张裕和长城；但报道发表时，天猫和抖音的全部葡萄酒品类收官榜单尚未完整披露。因此，商家采访不能视为全国葡萄酒线上交易额的精确统计。","报道同时呈现了市场内部的分化。有经营甜葡萄酒的商家认为消费者对折扣更加谨慎；也有高端葡萄酒直播店因平台发放大额补贴而出现明显增长。一些经营者认为，频繁的促销正在改变购买时机：消费者会等优惠再下单，但并不必然增加全年葡萄酒消费量。京东公布的“酒类总成交额增长25%”覆盖全部酒类，不能直接误写为葡萄酒增长25%。","这场购物节的真正问题或许不再是促销力度是否足够，而是消费者是否了解产品、是否愿意复购，以及促销补贴由平台还是商家承担。一次活动的成交额不能直接代表利润，也不能证明会员关系改善。对于葡萄酒行业，应当关注实际客单价、退货、复购、库存及贡献毛利，而非只截取排行榜里表现良好的品牌。","原题 ：《葡萄酒双11“平常心”收官：商家持平微跌，新酒饮尚未跑出声量》；《葡萄酒商业观察》， 2026-11-13 10:06 。观察事件为2026年双11促销周期。阅读原文。"],"sources":[["阅读原文","https://www.wbo529.com/info/5163"]]},{"title":"意大利葡萄酒出口仍跌3%，为什么单独看8月份却出现5.1%的增长？","body":["意大利统计机构Istat的贸易数据经WineNews在11月13日整理显示，2026年1至8月意大利葡萄酒出口金额约48.5亿欧元，同比下降3%。从累计跌幅看，它比前七个月的下降5.3%已有改善；仅8月份，出口额约5.068亿欧元，比2025年8月增长5.1%。这是一个积极的边际变化，但还远不能宣布全年外贸复苏。","按市场观察，美国仍是意大利酒的重要出口目的地。今年前八个月对美出口约11亿欧元，同比下降8.3%，但比前七个月累计下降11.2%的表现稍有改善。德国同期约7.014亿欧元，下降5.5%；英国约4.791亿欧元，同样下降5.5%。中国、l进口意大利葡萄酒金额在该口径下超过5100万欧元，同比增长21.7%，但中国这一市场的基数和产品结构与美国并不相同，不能据此说已经成为更大的购买市场。","最重要的限制是，这篇文章采用的最新Istat数据 暂时没有完整的出口数量系列 。出口金额增长可能来自单价、产品组合、汇率和出货量多个因素。必须把“8月份金额增长”和“消费者买了更多瓶”分开讲。对生产者而言，后续月份能否维持、渠道库存是否下降，才是判断真正恢复的关键。","原题 ： Vino italiano, l’export recupera ancora: 4,8 miliardi di euro nei primi 8 mesi 2026 (-3% sul 2025) ；WineNews， 2026-11-13 ；统计事件为2026年1—8月外贸。阅读原文。"],"sources":[["阅读原文","https://winenews.it/it/vino-italiano-lexport-recupera-ancora-48-miliardi-di-euro-nei-primi-8-mesi-2026-3-sul-2025_607664/"]]},{"title":"加州葡萄园重新研究Dry Farming：少灌水一定能酿出更好的酒吗？","body":["美国《旧金山纪事报》在11月13日报道了加利福尼亚葡萄园重新评估无人工灌溉种植（Dry Farming）的实践。随着干旱、水资源监管及地下水压力增加，种植者试图更系统地利用冬季降水、土壤储水及葡萄藤深层根系。报道指出，2023年至2026年的州资助相关项目已使900多名种植者参与培训和交流。","这并不是一个完全新发明的技术。Cline Family Cellars在Oakley保有长期依赖自然水分的老藤；Tablas Creek与Frog’s Leap也提供了长期实施案例，其中后者在纳帕约175英亩葡萄园采取此类管理。支持者认为适度水分压力可能降低产量、形成更小的果粒并帮助集中风味，但这不是同一种葡萄园能普遍复制的品质保证。","葡萄藤能否在不灌溉条件下保持健康，取决于土壤深度、储水能力、根系、砧木、降雨及种植密度。在干旱极端年份，果实可能无法正常成熟，产量也可能下降到不具商业可行性的程度。有些酒庄需要选择更耐旱砧木或调整行距；这往往属于几十年的长期决策。无灌溉并不等于绝对节水效果已被统一量化，更不意味着酿酒者应该忽视葡萄藤健康。","原题 ： California wants vineyards to use less water. Growers say dry farming makes the wines better anyway ；San Francisco Chronicle， 2026-11-13 ；报道涉及2023—2026年的培训与多年种植案例。阅读原文。"],"sources":[["阅读原文","https://www.sfchronicle.com/food/wine/article/dry-farming-napa-22515029.php"]]},{"title":"Wine Spectator年度第一是Paul Hobbs，第二名恰好来自今天品鉴的Rabajà 2021","body":["《Wine Spectator》2026年度Top 10名单于11月13日陆续揭晓：第一名是Paul Hobbs 2023 Coombsville Cabernet Sauvignon，第二名是Produttori del Barbaresco的Rabajà Riserva 2021，第三名为Penfolds Bin 389 2024，第四名为Caparzo Brunello di Montalcino 2021。完整Top 100预计11月16日才公布，因此今天不能将尚未公布的完整名单当成既成事实。","本期特别值得读的是第二名。Barbaresco合作社Produttori del Barbaresco长期采用Nebbiolo酿制不同单一园Riserva；Rabajà只是九个地理园地中的一个。Wine Spectator给2021 Rabajà Riserva评出98分，同时将它列为年度第二。这个结果适合作为理解2021年份、Nebbiolo结构、合作社长期风格与葡萄园身份的切入点，但评分与榜单是媒体编辑判断， 不是由意大利法律赋予Rabajà的“二级产区”或官方Grand Cru评级 。","在同一场九园比较品鉴里，Rabajà获得高排名，不应让它自动成为其他八园的“正确答案”。比较不同园地的香气、结构、单宁和陈年潜力，应该先让酒杯里的证据说话，再参考专业评论。尤其今日计划中的九园酒会，实际供酒及2021 Rabajà是否到场，必须由店方实物清点确认，榜单不构成现场供酒证明。","原题 ： “Wine Spectator”: the “Wine of the Year” 2026 is Cabernet Sauvignon Coombsville 2023 Paul Hobbs ；WineNews， 2026-11-13 。榜单Top 10截至该日已陆续揭晓；完整Top 100计划 2026-11-16 。阅读报道；Wine Spectator Rabajà酒款页面。"],"sources":[["阅读报道","https://winenews.it/en/wine-spectator-the-wine-of-the-year-2026-is-cabernet-sauvignon-coombsville-2023-paul-hobbs_607685/"],["Wine Spectator Rabajà酒款页面","https://top100.winespectator.com/2026/wine/wine-no-2-3/"]]}],"2026-11-13":[{"title":"中国整体进口酒量继续下降，为什么意大利起泡酒增长53.8%？","body":["中国葡萄酒进口市场的恢复并不均匀。WineNews在2026年11月12日整理Del Rey Analysts of Wine Markets对中国海关2026年1月至9月数据的分析：进口葡萄酒总额约11.6亿美元，同比增长5.6%；进口数量约1.569亿升，却下降5.5%。平均进口价格升至约7.44美元/升，增长11.7%。金额增加与数量减少并存，可能反映进口产品组合或采购价格变化，但不能直接认定消费者全面转向高端产品。","分品类来看，起泡酒进口量约710万升，同比增长27.4%，金额约6450万美元，增长31.6%。其中意大利起泡酒对华出货量约440万升，增长53.8%，金额约2040万美元；法国起泡酒约130万升，增长21.3%，金额约3770万美元。两者的均价差距很大：意大利约4.66美元/升，法国约30美元/升。这是海关进口价格，绝不是各自的餐厅酒单价格。","这些数字说明起泡酒在进口葡萄酒中的相对表现强劲，却不能证明意大利每一个起泡酒产区和生产者都在增长，更不能据此说法国香槟正在被全面替代。尤其不能把所有意大利起泡酒都当作Prosecco：产地、酿造方法和价格层级均有不同。后续需要查看消费者真实成交、渠道库存与复购，才能检验进口增长是否转化为终端需求。","来源/原题：  WineNews《Gli spumanti italiani brindano alla Cina: +53,8% in volume nei primi 9 mesi 2026 (sul 2025)》，2026-11-12；基础统计期2026-01至09。原文：WineNews。"],"sources":[["WineNews","https://winenews.it/it/gli-spumanti-italiani-brindano-alla-cina-538-in-volume-nei-primi-9-mesi-2026-sul-2025_607488/"]]},{"title":"奔富Bin 407暂停出货，中国澳洲酒进口为何仍微增？","body":["11月12日《葡萄酒商业观察》把澳洲2026年第三季度对中国大陆瓶装葡萄酒的出口数据按价格带重新拆解。报告数据显示，该季度澳洲瓶装酒对华出口金额约1.51亿澳元，同比增长0.55%；出口量约676万升，增长3.4%；均价约22.36澳元/升，下降2.8%。整体变化不大，却掩盖了价格带之间巨大的差异。","报道指出，Penfolds Bin 407自7月1日起暂停接受新订单，相关的90–100澳元/升FOB价格带对华出口额由约2759万澳元降至约985万，减少64.3%。与此同时，80–90澳元/升价格带由约1997万升值对应的澳元金额增长至3744万澳元，增幅87.5%。文章结合进口商描述，将后一价格带与Bin 389联系起来，提出Bin 389可能承接部分需求；品牌方确认其季度销售动销表现强劲。","但价格带不是SKU编码。  在没有逐瓶报关及渠道成交数据的情况下，不能把整个价格带的87.5%增长都认定为Bin 389一款酒贡献。Bin 407停货的报道背景与出口统计期也需区分。重要的商业问题是：一个核心商品供应变化时，消费者与进口商会转向哪种替代选择？品牌旗下其他产品的增长，是否意味着长期消费偏好发生改变，仍需更多季度数据检验。","来源/原题： 《澳洲葡萄酒三季度对华出口新变化：Bin407停货，Bin389补位？》，《葡萄酒商业观察》，2026-11-12 10:31；统计期2026年第三季度。原文：WBO。"],"sources":[["WBO","https://www.wbo529.com/info/5159"]]},{"title":"法国约60项砧木试验：砧木对产量的影响是否大于酒液酸度？","body":["全球许多葡萄园在重新考虑怎样面对干旱和高温。11月12日Vinetur报道了法国PGVigne.net项目的综合研究：2023年至2026年期间，法国葡萄与葡萄酒研究机构及伙伴归纳了约60项试验，涉及约20种葡萄砧木。砧木是嫁接在地下、承担根系功能的植物部分；接穗品种则决定植株地上部分和果实的主要遗传身份。","研究发现，砧木选择与树势、一定程度上的产量和水分胁迫适应有关，但效果受土壤、气候及接穗品种共同影响。报道援引研究人员指出，分析中砧木关联的增产幅度最高约14%，且树势更旺并不必然带来更高产量；对于葡萄酸度和酒精度，砧木的直接影响相对有限。","部分候选砧木，例如333 EM、140 Ru，可能具有应对干旱的潜力，但其苗木繁育、土壤适应性、石灰质土耐受性以及具体产区的表现仍需检验。研究结果计划进一步导入PlantGrape，以帮助种植者在重新种植葡萄园时做长期选择。","这不是“某个砧木一定能让葡萄酒更好喝”的证据。葡萄酒最终风格涉及接穗、产量、成熟度、年份、酿造与土壤环境，任何单一农业变量都不能替代对酒液的实际评价。这项研究目前主要是对多个田间试验的综合，不能直接转化为全球统一的砧木排名。","来源/原题：  Vinetur《French review finds grapevine rootstocks shape yield more than wine chemistry》，2026-11-12；项目研究期2023–2026，原行业汇总已于近期公布。原文：Vinetur。"],"sources":[["11月12日Vinetur报道了法国PGVigne.net","http://11%E6%9C%8812%E6%97%A5Vinetur%E6%8A%A5%E9%81%93%E4%BA%86%E6%B3%95%E5%9B%BDPGVigne.net"],["Vinetur","https://www.vinetur.com/en/20261112110898/french-review-finds-grapevine-rootstocks-shape-yield-more-than-wine-chemistry.html"]]},{"title":"奥克西塔尼2026产量恢复，合作社为什么反对收购价下降？","body":["法国南部2026年份葡萄酒产量有望从过去数年的低谷恢复。法国农业统计部门Agreste于11月6日公布的11月1日估计显示，Languedoc-Roussillon生产量约1107万百升，同比增加25%。奥克西塔尼葡萄酒合作社联盟在11月10日的声明中，则估计原Languedoc-Roussillon与Midi-Pyrénées两个区域合计接近1300万百升，并反对采购商以“丰收”为理由压低葡萄与散装酒采购价格。Vinetur于11月12日作出进一步分析。","联盟认为，新增产量是多年偏低采收之后的正常化，而能源、人工、包装、资金、农业投入和合规成本尚未明显缓解。产量恢复固然可以改善单位固定成本分摊，却也可能在需求持续偏弱、酒窖库存较高时增加价格谈判压力。双方的立场反映出种植者与收购商承担的风险不同。","需要明确， 1300万百升是合作社的区域合计估计，并不是Agreste对同一地理范围单独公布的1107万百升数字 ；不能将两个统计口径当作矛盾或相加。合作社反对降价也不等于政府已制定强制最低采购价格，更不等于超市里的法国酒都会涨价。","这一争议的核心，是生产者如何在年份波动、结构性需求与长期投资之间分配风险。短期产量恢复未必就足以解决酒庄现金流压力；而让消费者获得更低价格，也不一定意味着供应链所有参与者都具有健康利润。","来源/原题：  Vinetur《Occitanie wine cooperatives reject price cuts after harvest rebounds to nearly 13 million hectoliters》，2026-11-12；合作社声明2026-11-10、Agreste估计发布2026-11-06。原文：Vinetur。"],"sources":[["Vinetur","https://www.vinetur.com/en/20261112110895/occitanie-wine-cooperatives-reject-price-cuts-after-harvest-rebounds-to-nearly-13-million-hectoliters.html"]]},{"title":"脱醇白葡萄酒为什么容易失去“像葡萄酒”的香气？","body":["酒精不仅影响葡萄酒的度数，也会影响香气化合物的溶解、挥发与口感平衡。11月12日，澳大利亚昆士兰大学研究团队介绍了一项研究，试图弄清脱醇过程中有哪些挥发性物质减少或改变，并进一步理解消费者为什么觉得部分无醇或低醇葡萄酒缺少传统葡萄酒的感官特征。","研究并不只做实验室化学分析，还邀请平常饮用白葡萄酒的人参与感官测试。研究人员先识别脱醇前后有差异的香气化合物，再测试这些物质是否能改善消费者对水果香、整体接受度及“酒感”（vinosity）的判断。另一研究方向是尝试使用非酿酒酵母Saccharomyces之外的其他酵母，以及受控二次发酵，以较低酒精生成量保留或恢复更有葡萄酒特色的香气。","报道说明的是研究设计和方向， 并未提供足以认定某个方法已商业成功的普遍性结论 。非酿酒酵母也不意味着完全不会产生酒精；不同基酒的香气、酸度和质地可能导致很不一样的结果。消费者对NOLO酒的接受程度，还受到价格、饮用场景、甜度和个人期待影响。","对于侍酒师而言，比较脱醇酒和传统葡萄酒时，应关注香气保留、酸度、口感与整体平衡，而不仅看酒精百分比。对于生产者，能否在技术成本、风味与法规标示之间取得平衡，仍是值得追踪的问题。","来源/原题：  Vinetur《University of Queensland researchers track aromas lost in dealcoholized white wine》，2026-11-12；大学团队于同日公开介绍，科研项目仍在推进。原文：Vinetur。"],"sources":[["Vinetur","https://www.vinetur.com/en/20261112110896/university-of-queensland-researchers-track-aromas-lost-in-dealcoholized-white-wine.html"]]}],"2026-11-12":[{"title":"21个市场静态葡萄酒销量下降4%，Prosecco却增长3%：这是同一个趋势吗？","body":["酒类消费并不是朝同一个方向移动。IWSR在2026年11月10日正式发布21个重点国家和地区上半年的消费监测：这些市场合计覆盖全球酒精饮料消费量约76%，2026年1—6月酒类消费量同比下降1%。但去掉美国与中国，其他19个市场合计却增长1%。这种分化说明，“全球饮酒量下降”不能直接等同于每个国家或每个酒种都在萎缩。","葡萄酒的结构差异更明显。21个市场的静态葡萄酒销量同比下降4%；美国静态葡萄酒下降6%，中国下降9%。但起泡酒中的Prosecco增长3%；无酒精啤酒增长8%。在各国酒类整体消费量上，印度增长10%，巴西增长3%，哥伦比亚增长9%。这些百分比使用不同品类、地区的分母，不可直接加减推断市场份额。","IWSR认为节制饮酒和消费习惯改变已成为重要长期因素，但宏观经济、关税、通胀和各国收入结构同样可能影响结果。更重要的是，本次数字测量的是酒类消费量，不是葡萄酒生产者利润，更不是某个酒吧的销售情况。对于餐厅酒单，值得观察的是不同风格与饮用场景是否出现分化，而不是根据Prosecco增长就判断所有起泡酒一定会畅销。","来源与日期： IWSR原始公告《Excluding US & China, alcohol consumption grows in H1 2026》，2026-11-10；WineNews于2026-11-11跟进；事件数据期为2026年上半年。原始公告：IWSR；WineNews。"],"sources":[["IWSR","https://www.theiwsr.com/insight/press-release/excluding-us-china-alcohol-consumption-grows-in-h1-2026/"],["WineNews","https://winenews.it/it/i-consumi-degli-alcolici-nel-mondo-a-1-in-volume-nel-primo-semestre-2026-4-per-il-vino_607445/"]]},{"title":"“67%的中国消费者想增加意大利有机葡萄酒消费”，这个说法准确吗？","body":["2026年11月11日，WineNews报道意大利Nomisma为ICE、FederBio等机构组织的Ita.Bio平台开展的中国市场调查。报道中最引人注意的数字，是67%的现有受访消费者表示未来两三年计划增加意大利有机葡萄酒消费；与此同时，49%的尚未购买该类酒的受访者表示未来可能尝试。这些数字确实提示了潜在兴趣，但并不是实际购买订单。","调查样本来自北京、上海、广州和香港的1,000名18—55岁、家庭食品采购决策参与者，并设置超过6,000元人民币收入等筛选条件。样本并非全国所有葡萄酒消费者的随机代表。报道同时列出，24%的受访者饮用有机葡萄酒，12%曾购买或饮用意大利有机葡萄酒；在未使用意大利有机酒的受访者中，部分人表示平常购买渠道能见度不足。这里的“现有消费者”“未使用者”以及“全体受访者”是不同分母，绝不能把67%写成中国人口中有67%将增加消费。","更有价值的问题，是意大利葡萄酒生产者如何把认证、风格、价格、渠道与消费者真实理解联系起来。有机认证本身并不自动说明一支酒比所有非有机葡萄酒更美味，也不等于其所有环境影响均已测量。调查揭示的是购买意向与认知缺口，只有后续进货、真实销售与复购数据才能验证市场增长。","来源与日期： WineNews《Il 67% dei cinesi prevede di aumentare il consumo di vino bio italiano nei prossimi 2-3 anni》，2026-11-11；依据Nomisma/Ita.Bio近期调研。原文：WineNews；调查完整原始数据集本期未独立取得。"],"sources":[["FederBio等机构组织的Ita.Bio","http://FederBio%E7%AD%89%E6%9C%BA%E6%9E%84%E7%BB%84%E7%BB%87%E7%9A%84Ita.Bio"],["Ita.Bio","http://Ita.Bio"],["WineNews","https://winenews.it/it/il-67-dei-cinesi-prevede-di-aumentare-il-consumo-di-vino-bio-italiano-nei-prossimi-2-3-anni_607422/"]]},{"title":"瓶塞透氧量不同，白葡萄酒喝起来的“矿物感”真的会改变吗？","body":["“矿物感”是葡萄酒品鉴中常见、却一直难以用单个化合物定义的词。2026年11月4日，学术期刊OENO One刊发一项关于瓶塞透氧率与白葡萄酒矿物感的研究；11月11日Vinetur再次报道。研究者选取六组不同年份白葡萄酒，每组使用同一酒液但配以两种不同透氧性瓶塞，比较储存后的感官评价与挥发性含硫化合物等分析数据。","在这批样品中，低透氧性瓶塞组整体获得较高的矿物感评价，并与轻微还原气味、燧石感等描述相关；较高透氧性的组更容易显示部分与陈年、氧化相关的感官特征。论文还发现四种挥发性硫醇及游离、总二氧化硫与矿物感有统计关联。这里的“相关”不等于矿物感只由某一种化学成分决定。","研究涵盖Fiano、Grenache Gris、Grenache Blanc及Chardonnay等白葡萄酒，不能自动推广到所有红葡萄酒、香槟或者任何品牌瓶塞。作者自己也指出，研究没有取得酒液装瓶前完整的感官与化学基线，因此无法完全拆开原有差异和瓶陈变化。这项研究尤其提醒侍酒师：描述“矿物感”是一种感官判断，不应该直接宣称喝到的是从葡萄园岩石中溶入酒液的矿物质。","来源与日期： 原始同行评审论文《Impact of closure permeability on the perception of minerality in white wines of different ages》，OENO One，2026-11-04，DOI 10.20870/oeno-one.2026.60.4.10036；Vinetur于2026-11-11报道。原论文：OENO One；行业报道。"],"sources":[["OENO One","https://oeno-one.eu/article/view/10036"],["行业报道","https://www.vinetur.com/en/20261111110815/study-finds-bottle-closures-shape-white-wines-perceived-minerality.html"]]},{"title":"罗讷河谷提出2035年供给改革：为什么酒庄需要更长的合同？","body":["面对酒款销量下降，产区组织不一定只能通过促销应对。Inter Rhône在2026年11月10日介绍了一份面向2035年的产区战略方向，11月11日Vinetur报道其中的供给管理和长期合同重点。协会称，Rhône Valley法定原产地葡萄酒的市场销售量在2021—2025年间减少超过50万百升，即约5,000万升。","葡萄园与一般工业品不同。新种植的葡萄藤需要多年才能进入稳定生产周期，老藤或设备更新也涉及长期资金投入。如果种植者每年都无法确定葡萄交售价格和贸易商收购数量，就难以根据未来消费需求安排种植面积、产量与投资。Inter Rhône提出把供给控制与更长年期的商业合同相结合，希望让生产者和买家更早讨论数量、价格及风险分配。","但这仍是行业机构的战略提案，不是法国政府已经强制所有罗讷河谷酒庄减产的行政命令。不同村庄、不同价位、不同葡萄品种可能面对完全不同的市场情况。对消费者而言，它也不等于所有罗讷河谷葡萄酒即将涨价。真正值得长期观察的，是协会将如何把十年方向落实为具体、合法且被种植者和贸易商接受的措施。","来源与日期： Inter Rhône协会于2026-11-10提出方向；Vinetur《Inter Rhône proposes a 2035 supply plan after Rhône AOC sales fell by 500,000 hectoliters》，2026-11-11。原始新闻：Vinetur；协会2035年计划全文及最终决议本期尚未独立获得。"],"sources":[["Vinetur","https://www.vinetur.com/en/20261111110824/inter-rhone-proposes-a-2035-supply-plan-after-rhone-aoc-sales-fell-by-500000-hectoliters.html"]]}],"2026-11-11":[{"title":"全球散装葡萄酒贸易缩减14.5%，中国却出现“量增额降”","body":["Del Rey Analysts of Wine Markets为Vinexposium相关行业活动编制的研究指出，2026年上半年全球散装葡萄酒出口量约14亿升，同比减少14.5%，出口金额约11.1亿欧元，同比下降12.5%。散装酒以交易数量计超过全球葡萄酒贸易的32%，按交易金额计仅约7%。量占比与金额占比的差距，反映其平均单位交易价值低于很多瓶装酒，但不能由此判断每批散酒的最终用途或品质。","西班牙仍是重要散酒出口国，2026上半年出口量约4.7亿升，下降20.9%。与此同时，中国海关数据显示，2026年1—9月散装葡萄酒进口约5449万升，同比增长3.71%，进口额约3903万美元、下降20.49%，平均进口价约0.72美元/升、下降23.33%。中国的量增与全球散酒量降并不冲突：国家、时间及品类结构不同，且进口与出口是不同统计方向。","进口原酒最终可能经过本地灌装，进入不同价位与用途的产品，不能将散装酒增量直接理解成中国消费者更喜欢某个特定白葡萄品种。对整个行业而言，采购价格、装瓶成本、渠道库存和终端实际销售需要分别观察。 国际贸易额下降或进口量增加，都不能单独证明消费者复苏。","来源：葡萄酒商业观察，2026-11-10 17:36，原题《全球散装酒贸易量下跌，中国市场散酒进口结构有变化》；其引用的Del Rey研究此前已于2026-11-05被Vinetur报道；统计对应2026年上半年与中国1—9月。原文：WBO；Vinetur较早报道。底层海关逐行原表与Del Rey完整付费报告本期未独立审阅。"],"sources":[["WBO","https://www.wbo529.com/info/5156"],["Vinetur较早报道","https://www.vinetur.com/en/20261105110463/global-bulk-wine-trade-fell-145-in-the-first-half-of-2026.html"]]},{"title":"智利2026产量恢复13.2%，为什么中国销售未必同步回升？","body":["Chile官方农牧业局SAG于2026年8月12日公布2026收成与生产数据：不含用于Pisco的葡萄酒产量约9.4948亿升，2025年为8.3861亿升，增长约13.2%。原产地名称葡萄酒约7.908亿升；其中Cabernet Sauvignon及Sauvignon Blanc分别占相关DO产量的约27.5%与17.6%。","11月10日《葡萄酒商业观察》重新把这份生产统计与出口数据联系：2026年1—9月智利葡萄酒出口量约4.756亿升、下降8.8%，出口额约10.72亿美元、下降6.4%。其中中部产区生产恢复更明显，但中国市场仍面临采购和需求的不确定性。","这一对比需要区分：收成反映种植与酿造端，出口反映跨境发货，零售反映消费者最终购买。即使产量回升，酒庄也可能面对库存积压、贸易价格变化或经销商不愿扩大订货。更重要的是，13.2%的增长发生在2025年较低基数之上，并不证明智利葡萄园生产面积大幅扩张或所有产区均丰收。","来源：SAG第一手公告发布2026-08-12，事件为2026年份生产统计；WBO最新组合报道2026-11-10 09:44。原文：SAG官方、WBO分析。不要将8月官方消息当作11月新发布。"],"sources":[["SAG官方","https://www.sag.gob.cl/noticias/informe-de-produccion-de-vinos-2026-del-sag-muestra-un-aumento-de-132-en-la-produccion-de-vino-granel"],["WBO分析","https://www.wbo529.com/info/5152"]]},{"title":"意大利酒窖库存47.7百万百升：库存增长能说明“卖不动”吗？","body":["意大利监管部门ICQRF的Cantina Italia电子酒窖登记统计显示，截至2026年10月31日，意大利酒窖中有约4770万百升葡萄酒，较2025年同期增加7.2%；另有约1580万百升葡萄汁、增长10.6%，以及约1370万百升仍在发酵的新酒、同比减少4%。本次登记覆盖约23,665个电子登记主体。","库存上涨的新闻容易让人直接联想到消费衰退，但这张表同时反映新年份葡萄酒进入酒窖的季节性。与9月底相比，葡萄酒库存环比增加约16.2%。产量、在库成品、葡萄汁与仍在发酵的酒要分别列示，不能不加区分相加后宣称全部已经可上市。登记库存还可能包含正常陈年、已订未发货的酒。","其中意大利北部持有约61.2%的库存；DOP约占56.9%，IGP约25.6%。这些比例展示库存的产地与法规分类，不直接告诉我们每个酒庄的库存周转速度、利润或现金流。评价供需关系还需要正式采收报告、消费者购买、出口、批发合同与酒庄的具体发货情况。","来源：WineNews《“Cantina Italia”: al 31 ottobre 47,7 milioni di ettolitri...》及Gambero Rosso相关报道，均于2026-11-10报道，实际库存统计日期2026-10-31。原文：WineNews、Gambero Rosso。官方完整报表PDF本次未完成逐页核对。"],"sources":[["WineNews","https://winenews.it/it/cantina-italia-al-31-ottobre-477-milioni-di-ettolitri-di-vino-in-giacenza-7-sul-2025_607345/"],["Gambero Rosso","https://www.gamberorosso.it/notizie/vino/tre-bicchieri/giacenze-vino-cantina-italia-ottobre-2026/"]]},{"title":"Barolo葡萄园每公顷最高230万欧元，土地昂贵是不是葡萄酒昂贵的原因？","body":["意大利农业经济研究机构CREA与CONAF的2025年度土地市场调查，被WineNews和Gambero Rosso于11月10日集中报道。研究显示，意大利农业用地整体均价接近23,000欧元/公顷，年度增长约0.9%，地区之间差异巨大；而优质法定产区葡萄园的交易估值明显更高。","Barolo法定区域低朗格地带葡萄园报价估计约35万至230万欧元/公顷；Alto Adige部分区域约60万至110万欧元；Bolgheri约30万至100万欧元；Brunello di Montalcino约25万至100万欧元。这里的230万是调查估计的上限， 不是每块Barolo葡萄园的统一市场价格、公开成交均价，更不等于生产一瓶Barolo的成本。","土地价值可能受有限的可用面积、地理声誉、葡萄品质、历史和投资需求影响，也可能推高新生产者进入行业的门槛。但酒款的售价还取决于酒庄品牌、产量、酿造、营销、经销渠道以及终端消费者愿付价格。不能用土地价格单项推断一个酒庄盈利很好，也不能根据产区名称把所有地块视为同质资产。","这一案例特别适合葡萄酒教学：风土是农业、地理、历史和经济共同塑造的长期关系。理解某产区价值需要看土地边界与真实酒款，而不仅看某个令人惊讶的最高报价。","来源：CREA年度调查针对2025年，WineNews与Gambero Rosso发表于2026-11-10。原文：WineNews、Gambero Rosso。土地估值并非一笔笔真实交易的完整清单。"],"sources":[["WineNews","https://winenews.it/it/a-barolo-e-in-alto-adige-i-vigneti-piu-preziosi-poi-bolgheri-e-montalcino-lindagine-del-crea_607268/"],["Gambero Rosso","https://www.gamberorosso.it/notizie/vino/tre-bicchieri/quotazioni-vigneti-barolo-record-crea-2025/"]]}],"2026-11-10":[{"title":"中国餐桌上的白葡萄酒：海鲜、夜宵与Bistro正改变饮酒场景吗？","body":["长期以来，中国葡萄酒常被放在宴请、礼赠与商务聚会的语境中，红葡萄酒往往占据更高的能见度。然而，一些中国沿海城市正在出现另一种饮酒体验：消费者在海鲜排档、夜宵摊、轻餐厅或Wine Bistro里选择清爽的白葡萄酒，价格和配餐的适应性比传统身份象征更加重要。","11月9日Vinetur报道了11月8日Wine Meridian根据Vino Joy News采访与贸易资料整理的观察。在浙江宁波、温州、台州等沿海城市，受访行业顾问提到部分本地渠道中白葡萄酒销售占比接近50%，而较早观察为20%至30%。温州进口商KAKA则称，过去两年其重点推广的平价白葡萄酒销量提升150%至200%。另有苏州YesiVino Bistro表示白葡萄酒与起泡酒合计约占店内葡萄酒销售80%，上海Pudao称约70%。","这些数字很醒目，但它们来自不同受访商家，并非覆盖全国的统一零售抽样。它们无法证明全国白葡萄酒已占一半市场，也不能据此认为中国整体葡萄酒消费量正在回升。白葡萄酒在海鲜餐饮中受欢迎，既可能与口感和温度有关，也涉及价格、场景、餐饮习惯和消费者接触渠道。","我们可以因此重新思考葡萄酒教育的切入点。人们不一定先学习复杂产区再选择葡萄酒，很多时候是从一道菜、一杯合适温度的酒和一次轻松的朋友聚餐开始。\\\u003cSauvignon Blanc、Riesling或其他白葡萄品种的特点，都可以在具体的味觉体验中被认识；但单一城市案例不足以预测整个市场的未来。","原题与来源：  White wine gains ground in China's casual dining scene，Vinetur，2026-11-09；Wine Meridian相关报道，2026-11-08。 事件与数据期：  2026年各受访商户经营观察，KAKA增长口径为过去两年。 限制：  样本集中于个别城市和经营者，不能外推全国。"],"sources":[["White wine gains ground in China's casual dining scene","https://www.vinetur.com/en/20261109110652/white-wine-gains-ground-in-chinas-casual-dining-scene.html"],["Wine Meridian相关报道","https://www.winemeridian.com/mercati/vino-bianco-in-cina-consumi-tendenze-opportunita-2026/"]]},{"title":"勃艮第种下八个抗病葡萄候选品种：还能保留Chardonnay与Pinot Noir的风格吗？","body":["当提到勃艮第，很多人会想到非常确定的葡萄品种：白葡萄酒以Chardonnay为代表，红葡萄酒则高度依赖Pinot Noir。但这些经典品种也面临霜霉病、白粉病、极端天气以及葡萄园管理成本的挑战。减少病害防治投入，又不失去消费者熟悉的风格，成了长期的农业研究问题。","11月9日Vinetur报道CEPInnov项目的新阶段：研究团队在法国Saône-et-Loire的Fontaines试验田种下八个抗病葡萄候选材料，其中三个属于Chardonnay育种系、五个属于Pinot Noir育种系。实验园面积约17公亩（0.17公顷），每个候选品系约100株。项目由BIVB、香槟行业机构、法国国家农业研究团队等合作推进。","这些候选品系并非突然出现。自2015年起，育种过程产生约16,000粒种子，经过筛选，2018年起约350个候选材料进入较早期的田间测试。Fontaines的新试验田于2026年9月25日举行揭幕，计划逐步扩大至约40个候选品系。抗性主要针对霜霉病与白粉病，研究也关注感官表现和长期耐受性。这属于传统杂交育种，不是利用基因编辑直接改变现有Chardonnay葡萄藤。","关键问题仍未解决：具有抗病能力的新葡萄能否表达可辨识的勃艮第风格？不同土壤、年份和酿造操作是否会改变结果？项目方目前预计真正商业化应用仍可能在2035年以后，且需经过法规和产区批准。今天不能将八个候选品种写成已经获准生产AOC葡萄酒，更不能声称抗病品种保证葡萄酒更好喝。","原题与来源：  Burgundy plants eight disease-resistant grape candidates in Fontaines，2026-11-09；BIVB CEPInnov研究项目。 事件日期：  Fontaines试验田2026-09-25揭幕；2026-11-09为后续报道。 限制：  长期品种性能与商业应用尚未得到最终验证。"],"sources":[["Burgundy plants eight disease-resistant grape candidates in Fontaines","https://www.vinetur.com/en/20261109110670/burgundy-plants-eight-disease-resistant-grape-candidates-in-fontaines.html"],["BIVB CEPInnov研究项目","https://extranet.bivb.com/technique-et-innovation/nos-projets/viticulture/la-creation-de-varietes-resistantes-a-typicite-regionale%2C3091%2C17996.html"]]},{"title":"Graves Supérieures法定产区名称取消：一项AOP如何退出欧盟登记？","body":["葡萄酒产区名称在欧洲并不仅仅是地图上的地点。受到保护的原产地名称（PDO / AOP）还承载着特定产品规范、地理边界和标签使用权。消费者看到一个法定名称时，实际上也在读取一套生产规则。","欧盟委员会于2026年11月6日通过实施条例(EU) 2026/2476，11月9日刊载于欧盟官方公报，决定根据法国提出的申请，取消波尔多甜白葡萄酒名称Graves Supérieures的PDO登记。公报记录了申请流程中没有收到异议，规定在刊登后二十日生效，即2026年11月29日。","此举涉及的是一个 特定法定名称 的欧盟保护地位，不等于法国政府禁止所有Graves葡萄酒销售，也不是整个Bordeaux产区被取消。对于历史上使用Graves Supérieures名称的生产者和进口商，重要的是梳理新旧年份产品、标签、技术文件与贸易资料，明确其后续使用何种合法名称与规范。现有库存是否受过渡安排影响，应依照官方细则和主管机构解释，而不能从一个新闻标题推断。","这也提醒消费者：法定产区体系不是永久不变的自然事实。名称可以新设、扩大、修订甚至撤销；学习某个产区时，应当记录资料所对应的法规版本和生效日期，尤其不能把未来的规则倒填到过去的年份。","原题与来源：  European Union cancels Graves supérieures protected wine designation，Vinetur，2026-11-09；Qualivita欧盟公报索引。 法规日期：  11月6日通过、11月9日刊登、11月29日生效。 限制：  逐批库存和历史标签过渡适用需另核官方细则。"],"sources":[["European Union cancels Graves supérieures protected wine designation","https://www.vinetur.com/en/20261109110672/european-union-cancels-graves-superieures-protected-wine-designation-after-france-requested-its-removal.html"],["Qualivita欧盟公报索引","https://www.qualivita.it/normativa/graves-superieures-dop-cancellazione-denominazione-guue-l-del-09-11-2026/"]]},{"title":"意大利葡萄酒生产成本上涨8.9%，零售价格却下降2.6%：谁在承担差额？","body":["对葡萄酒生产者而言，一瓶酒的价格不仅取决于葡萄的品质，还包含农业投入、劳动力、瓶子、运输、能源、储存和资金成本。当消费者支出趋于谨慎，生产者未必能通过提价完全转嫁成本。","11月9日，Foodmakers.it及Vinetur根据意大利葡萄酒行业和统计机构资料，讨论正在扩大的成本与价格差距：报道引用的Ismea口径显示，2026年9月葡萄园和酒窖相关农业生产成本同比上涨约8.9%；同时，葡萄酒消费者价格在另一统计口径下下降约2.6%。报道还引用一项消费者调查，其中35%的受访者将葡萄酒列为家庭购物中优先削减的项目。","这并不意味着每一家意大利酒庄的实际净利率都下降了11.5个百分点。成本上涨与消费价格下降来自不同时间与统计类别，而不同生产者的出口市场、库存、葡萄酒种类、合同期限及渠道议价能力都不一样。豪华酒款有时仍能保持较强定价力，日常餐酒却更容易受到消费者预算影响。","这些数据的真正意义在于提醒我们，销量、营收和毛利是不同的经营维度。一家酒庄可能卖出相同瓶数，却因为原料和包装成本上涨而减少利润；也可能通过价格调整保住销售量，但承担更高经营压力。讨论所谓“葡萄酒消费复苏”时，至少需要看实际成交数量、价格、成本与库存，而不仅是宣传中的单一增长率。","原题与来源：  Italy's wine industry faces a margin squeeze after production costs rise 8.9%，Vinetur，2026-11-09，引用Foodmakers、Ismea与行业报告。 数据期：  2026年9月至10月相关统计及近期消费调查。 限制：  跨口径数字不能直接相减为行业真实利润率。"],"sources":[["Foodmakers.it","http://Foodmakers.it"],["Italy's wine industry faces a margin squeeze after production costs rise 8.9%","https://www.vinetur.com/en/20261109110673/italys-wine-industry-faces-a-margin-squeeze-after-production-costs-rise-89.html"]]},{"title":"美国葡萄酒整体承压，为什么意大利酒的表现相对稳健？","body":["美国葡萄酒市场正在经历一个复杂的调整期。消费者减少饮酒频率、价格上升和经销体系变化，都可能影响不同国家葡萄酒的表现。但市场整体下滑，并不意味着来自每个国家、每一种价格段的酒款都在同一速度下降。","11月9日Vinetur根据WSWA与SipSource资料报道，在截至2026年8月的十二个月内，美国市场九美元以上的进口静态葡萄酒渠道出货量同比下降约2.5%，相比之下美国本土葡萄酒相应统计下降约5.7%。行业机构称意大利酒在四个价格带中出现增长。另一项涉及意大利葡萄酒购买者的调查发现，71%受访者表示购买量与过去相近，但其中43%也开始更加主动地寻找促销和价格优惠。","这些结论需要谨慎理解。SipSource描述的是从批发渠道向零售及餐饮等经营者的出货，不等于最终消费者直接购买；“进口酒”整体类别也不自动等同于全部意大利葡萄酒。消费问卷的样本和口径与出货统计不同，不能把它们合并成同一个增长率。","不过，行业论坛的讨论提出了一个值得研究的真实问题：生产者在美国的竞争力，往往不仅取决于酒液品质，还涉及经销商合作、品牌推广、消费者教育与长期稳定供货。对消费者而言，较为稳健的渠道表现也不意味着所有意大利葡萄酒都比美国酒更值得购买，具体生产者和具体酒款仍应单独判断。","原题与来源：  Italian wine outperformed the broader U.S. market in the year through August 2026，Vinetur，2026-11-09；数据基础为WSWA/SipSource及Nomisma/Federvini相关调查。 统计期：  截至2026年8月的十二个月。 限制：  批发出货不等于零售实际消费，品类间比较须保留原始统计口径。"],"sources":[["Italian wine outperformed the broader U.S. market in the year through August 2026","https://www.vinetur.com/en/20261109110675/italian-wine-outperformed-the-broader-us-market-in-the-year-through-august-2026.html"]]}],"2026-11-09":[{"title":"Vega Sicilia的Deiva 2024：一个以红酒闻名的集团，为什么投资加利西亚的Albariño？","body":["长久以来，提到Tempos Vega Sicilia，更多人想到Ribera del Duero的Único、陈年时间与极高的品牌辨识度。然而集团向西走到了加利西亚，在Rías Baixas的Crecente建造新酒庄，并以Deiva进入西班牙白葡萄酒领域。这不是简单给现有品牌增加一个白酒SKU，而是一个牵涉土地、酒庄设施与长期供应能力的项目。","2026年10月27日，集团在新酒庄落成时展示Deiva 2024；11月7日至8日，葡萄酒媒体继续报道它的产品数据。该酒为100% Albariño (Alvarinho)，2024年份技术资料列出32,877瓶。集团自2018年起在Condado do Tea及Val do Salnés采购葡萄园，现有约24公顷自有葡萄园，新酒庄投资约2,000万欧元。有关报道还介绍不锈钢、混凝土、花岗岩和大型橡木桶等不同容器在项目中的使用；不能把这些设备一概当作这款酒各自的准确熟成比例。","Deiva 2024被描述为其首个商业化西班牙白葡萄酒年份，计划于2027年2月以配额体系上市，西班牙市场参考价约40欧元。注意“10月展示”“11月媒体报道”和“2027年2月商业开售”是不同日期；有些新闻照片显示的是2023标签样瓶，不能拿来当2024年份的实物图。更不应根据Vega Sicilia集团的红酒声望，预先断言这支新白酒已经具备与Único相同的陈年表现。","对消费者而言，真正有意思的是：一个经验深厚的集团在尚无长期垂直品鉴证据的新产区项目上，如何通过品种、不同子产区、酿造容器与时间建立自身表达。这段故事要等到更多年份与真实酒杯中的表现，才能逐渐完整。","原题／来源：  Tempos Vega Sicilia releases Deiva 2024, its first Spanish white wine，Vinetur，2026-11-07；Vega Sicilia presenta su primer vino blanco español，El País，2026-10-27。事件：10月27日新酒庄发布；上市目标：2027年2月。","2026年夏季的热浪与干旱，让法国香槟地区面对糖分积累和潜在酒精度升高的实际问题。由于传统法起泡酒还要经历二次发酵，基酒的成熟度、是否进行加糖提高酒精度以及最终气压与酒精度之间，需要有一套符合产区规范的操作逻辑。"],"sources":[["Tempos Vega Sicilia releases Deiva 2024, its first Spanish white wine","https://www.vinetur.com/en/amp/20261107110599/tempos-vega-sicilia-releases-deiva-2024-its-first-spanish-white-wine.html"],["Vega Sicilia presenta su primer vino blanco español","https://elpais.com/gastronomia/2026-10-27/vega-sicilia-presenta-su-primer-vino-blanco-e-inaugura-bodega-en-galicia.html"]]},{"title":"2026年香槟为何可以例外超过13%酒精度？关键不在“放宽品质”，而在具体生产条件","body":["法国政府在2026年10月22日签署、10月28日正式公布了一项针对 Champagne 的特别命令。其核心不是笼统取消酒精度上限，而是对 2027年装瓶进行二次发酵、由未强化的2026年份酒与曾强化的较早年份酒共同调配 的特定情形，允许完成起泡后超过原本13%总酒精度限制。企业还必须按每个参与调配的容器保存体积、酒精度及可能的强化比例记录。","从葡萄栽培角度，极端天气让葡萄更快积糖，不代表成熟的芳香、酸度与酚类一定同步。提高最后酒精度标准并非酒庄必须生产高酒精香槟，也不证明2026年份必然“更好”或者以后所有香槟都可以如此酿造。相关媒体讨论极端情况下约15%的可能性，但不得把15%说成全部酒款共同的新法定上限。","这条法规值得专业学习，是因为它把气候问题从“年份好坏”的简单判断，带回了原料成熟、调配、二次发酵及依法登记的生产细节。对未来品鉴2026基酒或酒款的侍酒师来说，法规背景是一项重要信息，却不能代替真实感官评估。","原题／来源：  Arrêté du 22 octobre 2026 portant dispositions exceptionnelles pour le vin revendiqué en AOC Champagne，法国政府正式法规，签署2026-10-22， 刊登2026-10-28 ；France lifts Champagne alcohol cap for 2026 harvest，2026-10-29；11月6日至7日亦有后续报道。"],"sources":[["Arrêté du 22 octobre 2026 portant dispositions exceptionnelles pour le vin revendiqué en AOC Champagne","https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000055020355"],["France lifts Champagne alcohol cap for 2026 harvest","https://www.connexionfrance.com/news/france-lifts-champagne-alcohol-cap-for-2026-harvest/824708"]]},{"title":"意大利葡萄酒旅游支持最高50%合规费用：一座酒庄如何从卖酒走向经营体验？","body":["对酒庄来说，把酒酿好是一门生意；让旅行者愿意预约、来到葡萄园、参加品鉴、住宿或文化活动，则是另一门需要运营能力的生意。它涉及客人接待、设施投入、路线设计、推广、付款及安全，而不只是安排一位酿酒师倒酒。酒庄旅游的发展，也把葡萄酒与餐饮、当地历史、建筑和艺术更加紧密地联系起来。","意大利在2026年11月6日刊登了一项9月18日制定的相关支持框架；Vinetur于11月7日报道，该措施针对2026/27年度的葡萄酒旅游项目，所述公共贡献原则上 不超过符合条件费用的50% 。媒体列举的支持方向包括接待设施、参观路线、文化活动及宣传推广。申请者须证明符合相关资格、项目开支和申报程序。","“最高50%”是资助比例上限，不是政府替每家酒庄报销一半费用，也不代表所有希望办品鉴会的企业都自动合资格。具体申报主体、适用地区、预算总量、时间窗及优先条件应以意大利官方法规全文和实施细则为准，本期尚未逐条复核附件，不能发布具体“可领取资助”的商业承诺。","这则消息的更大意义，是把葡萄酒体验看作一项正式的经营产品。一次好的酒庄参观，需要明确体验内容、接待能力和对客交付；酒款的文化魅力如果没有清晰预订、定价和实际服务流程，未必能形成持久客户关系。无论是否获得公共支持，这样的经营逻辑都值得观察。","原题／来源：  Italy Opens Wine Tourism Aid Covering Up to 50% of Eligible Costs，Vinetur，2026-11-07；法规制定2026-09-18，公布2026-11-06。 限制：  官方法令全部适用细则未独立完成审读。"],"sources":[["Italy Opens Wine Tourism Aid Covering Up to 50% of Eligible Costs","https://www.vinetur.com/en/20261107110585/italy-opens-wine-tourism-aid-covering-up-to-50-of-eligible-costs.html"]]},{"title":"Naked Wines的79%会员留存率：停止一味买新客户，能否改善葡萄酒直销生意？","body":["酒类电商的增长很容易被展示为新客数、订单量和GMV，但这些指标不一定能解释企业是否健康。如果新客大多因为大额折扣首次购买、随后不再消费，获客成本就可能始终无法由真实的长期利润收回。英国葡萄酒直销企业Naked Wines，提供了一个观察会员经济的案例。","该公司在 2026年11月6日 发布交易与股权回购方案更新。其HY27阶段报告的会员留存率为 79% ，去年同期为76%；毛利率从19.5%升至 21.7% 。公司表示其新客户投资更加重视取得回报的时间，经营方向是在缩减不划算的客户补贴之后，加强与已建立关系的会员和独立酿酒师之间的联系。这些数字显示部分单客指标改善，并非说明整个销售收入已经恢复增长。","同时，Naked Wines提出每股80便士、总额约200万至570万英镑的要约回购建议，较此前63便士收盘价高约27%。 这是一项拟议资本安排，不是已经在11月6日买回570万英镑股份 ；仍涉及12月8日股东审批及其他条件。股票回购与葡萄酒零售客户留存也是两个不同议题，不应混为一谈。","对于经营者，这条新闻最有价值的不是复制其会员模式或回购政策，而是重新定义好客户：是否愿意持续探索新酒、是否与生产者建立信任、多久回来购买、实际毛利是否覆盖服务及获客成本。人们愿意留在一个葡萄酒社区，通常不是因为每次都有更大的折扣，而是因为他们持续得到有价值的发现和体验。不过，会员留存率是公司按其自身定义计算的指标，不能与其他门店的到访复购率直接相加或比较。","原题／来源：  Tender Offer, Trading Update and Notice of Half-Year Results，Naked Wines公司公告，2026-11-06；Naked Wines offers up to £5.7 million buyback at a 27% premium，Vinetur，2026-11-07。"],"sources":[["Tender Offer, Trading Update and Notice of Half-Year Results","https://www.investegate.co.uk/announcement/rns/naked-wines--wine/tender-offer-trading-update-notice-of-hy-results/9861489"],["Naked Wines offers up to £5.7 million buyback at a 27% premium","https://www.vinetur.com/en/amp/20261107110582/naked-wines-offers-up-to-%C2%A357-million-buyback-at-a-27-premium.html"]]}],"2026-11-08":[{"title":"中国五家葡萄酒上市公司营收回升，利润为何反而下降三成？","body":["2026年前三季度，中国葡萄酒上市企业交出了一份看似矛盾的财务答卷：营收有所恢复，利润却继续承压。11月5日，《葡萄酒商业观察》（WBO）汇总张裕A、威龙股份、中信尼雅、ST通葡和ST莫高五家A股公司的三季报，发现五家合计营业收入约 32.54亿元，同比增长4.90% ；归属上市公司股东的净利润合计约 5145.87万元，同比下降33.75% 。只看营业收入，似乎可以说市场正在回暖；但把费用与利润放在一起，经营图景就没有这么轻松。","第三季度单独观察，这五家公司的合计收入增长约10.60%，合计归母净利润仍亏损约2573.82万元。张裕占样本收入的大头，前三季度收入约22.54亿元、增长6.51%，净利润约1.51亿元、下降19.25%。与此同时，中信尼雅的利润改善在百分比上很醒目，但去年同期基数极低，不能用高增长率掩盖实际利润规模仍有限。莫高的部分收益涉及资产处置，亦不应与日常卖酒利润混算。","这组数字并不代表全国葡萄酒行业的整体收入：它只涵盖五家A股样本，而且上市公司的合并报表可能包含非葡萄酒业务。它也不能直接证明消费者在餐厅多喝了多少瓶。经营者更应该学习的是，收入、毛利、营销费用、现金流和经营利润必须放在一起看，任何单项增长都不足以证明商业模式健康。","原题及日期： 《5家葡萄酒上市公司三季报：营收同比增长4.90%，利润下降33.75%》；《葡萄酒商业观察》，2026-11-05 10:22；财报期间2026-01-01至09-30。原文。"],"sources":[["原文","https://www.wbo529.com/info/5140"]]},{"title":"意大利家族投资俄勒冈Ken Wright：葡萄园卖给新股东，酒庄的风土身份还在吗？","body":["美国Oregon的Ken Wright Cellars，是Willamette Valley单一葡萄园黑皮诺的重要代表。11月7日的产业报道透露，意大利Gussalli Beretta家族通过其葡萄酒投资业务，取得这家酒庄一笔 较大但非控股的少数股权 ，并购入与酒庄经营相关的葡萄园和房地产资产。这是该家族葡萄酒投资组合首次进入意大利以外的市场。","理解这笔交易，要把酒庄公司、葡萄园土地、酿酒师及品牌身份分开。根据双方声明，创始人Ken Wright仍保有酒庄公司的多数股权，并继续担任酿酒师；葡萄园管理、酿造、接待、酒商合作和葡萄供应团队预计维持原有安排。新投资人获得了土地与资产层面的长期布局，而不是把酒庄一夜之间改成意大利品牌。交易金额未公开，因而不能从外界推断酒庄估值或投资回报。","Ken Wright从1980年代进入Willamette Valley，1994年创立同名酒庄，长期强调不同葡萄园所呈现的黑皮诺风格差异。Beretta家族在意大利拥有多个强调产区个性的酒庄，公开表达希望提供资本支持，同时保留当地团队与酒庄身份。不过，这些是交易双方对未来经营的承诺，真正是否兑现仍需观察后续的土地管理、酒款风格和经营安排。","这一消息比简单的“外国资本收购美国酒庄”更值得讨论：对于一个以单一园表达为核心的生产者，如何在资本投入、土地所有权与风土连续性之间寻找平衡？对于消费者，判断一瓶酒有没有改变，不能只看股东名单，更要看葡萄来源、酿造团队和具体年份。","原题及日期： “Beretta family buys into Ken Wright Cellars in its first overseas wine deal”；Vinetur，2026-11-07；交易于报道日前由双方公布，确切签约日及价款未在公开资料披露。原文。"],"sources":[["原文","https://www.vinetur.com/en/20261107110564/beretta-family-buys-into-ken-wright-cellars-in-its-first-overseas-wine-deal.html"]]},{"title":"206个Riesling克隆、九个年份：DNA之外，葡萄为何每年表现不同？","body":["同一个葡萄品种甚至同一克隆，为什么在不同年份仍可能表现得非常不一样？11月6日发表于bioRxiv的一篇研究预印本试图从遗传和表观遗传两个层面回答这个问题。由德国Geisenheim等机构研究人员参与的团队，分析了206个Riesling克隆在九个生长季的表现，并建立了基因组与表观基因组数据模型。11月7日的产业科技报道介绍了它的主要发现。","一般说来，DNA序列差异可以帮助解释不同克隆的固有差异；表观遗传信号，例如某些DNA甲基化相关特征，则可能与基因如何在不同环境中表达有关。研究发现，在不单独建模年份交互的情况下，基因组数据能够解释五个观测性状中四个的主要克隆差异；而将“克隆×年份”的相互作用纳入模型后，表观遗传数据在五个性状中的四个解释了相当一部分年度交互差异，表现出与纯基因序列信息不同的统计作用。","这对于葡萄园管理是一个有吸引力的研究方向。葡萄藤需要在同一块土地上生长很多年，选择克隆意味着长期投资。如果未来能更好识别对年份波动敏感或稳定的材料，育种和选苗可能更精确。然而， 这篇论文尚未经过同行评议 ，统计解释力不等于已经发现确定的因果机制；研究也没有提供可直接拿到苗圃使用的“最佳雷司令克隆”名单，更没有证明某个克隆一定酿出更好的酒。","对于读者，值得记住的不是一串陌生的分子生物学术语，而是葡萄酒风土从来不只是土壤或年份的单项作用。品种、克隆、当地环境和长期管理一起影响产量与果汁组成，研究工具正在帮助科学家更细致地理解其中的相互作用。","原题及日期： “Study of 206 Riesling clones finds epigenomic data better explain year-to-year shifts”；Vinetur，2026-11-07；原研究为2026-11-06 bioRxiv预印本，尚未同行评议。报道。"],"sources":[["报道","https://www.vinetur.com/en/20261107110574/study-of-206-riesling-clones-finds-epigenomic-data-better-explain-year-to-year-shifts.html"]]},{"title":"阿根廷统一葡萄酒检测方法：实验室的“同一个数字”为什么需要共同标准？","body":["11月5日，Argentina国家葡萄种植与葡萄酒管理机构INV签发第8/2026号决议，11月6日在官方公报公布，正式认可一份《葡萄酒与葡萄汁分析方法汇编》作为官方技术参考。机构网站也公开了汇编入口。该文件参考国际葡萄与葡萄酒组织OIV的技术方法和INV自身已采用的方法；11月7日的后续报道解释了其行业意义。","这不是一场新年份的品鉴，也不是新酒庄获奖，而是一项看似抽象、却直接影响产业信任的基础工作。酒庄、第三方实验室和官方监管部门可能分别测量酒精、酸度或其他酒液参数；如果使用不同样品前处理、校准或检测程序，即使都报告相同的单位，结果也未必具有充分可比性。统一技术参考有助于增强结果的一致性、可追溯性和监管透明度。","对于出口业务，分析结果常常进入检验、交易与争议处理环节。因此，一个稳定、公开、可核查的方法体系，有时比包装上的宣传语更直接影响交易信心。但必须清楚： 批准检测方法汇编不等于所有阿根廷葡萄酒已经通过检测 ，也不是新出台了一套面向所有国家的统一进口标准。具体产品是否符合某市场要求，还取决于相应规则、抽样、实验室实施及实际测量结果。","葡萄酒科学的严谨性，很多时候从这种幕后标准开始。认识风土的同时，理解“如何证明和比较酒液数据”，同样是专业侍酒师与教育者需要具备的知识。","原题及日期： 阿根廷官方“Resolución 8/2026 — Métodos de Análisis de Vinos y Mostos”；决议2026-11-05，公报2026-11-06；Vinetur报道2026-11-07。政府法规全文 · INV官方汇编入口。"],"sources":[["政府法规全文","https://www.argentina.gob.ar/normativa/nacional/norma-432062/texto"],["INV官方汇编入口","https://www.argentina.gob.ar/inv/vinos/compendio-analitico"]]},{"title":"英国拟从2027年2月提高4.55%酒类税：会让餐厅酒单立刻涨价吗？","body":["英国是葡萄酒重要的进口和消费市场。11月7日，产业媒体报道英国政府计划从 2027年2月1日 起将酒类消费税税率上调约4.55%，涉及葡萄酒、啤酒与烈酒，并与通胀调整相联系。报道称，按所引用的酒类税计算示例，一瓶Prosecco可能额外承担约14便士税负。由于酒类税会贯穿进口商、批发商与零售餐饮渠道，这项计划受到行业关注。","这项消息并不意味着今天英国所有葡萄酒零售价格已经上涨4.55%。一方面，报告所述的是未来税率调整计划，而非已经于11月7日实施；另一方面， 酒税上调百分比与酒瓶最终零售价上调百分比不是同一件事 。酒的酒精度、容量、实际税档、库存批次、企业毛利与增值税等因素都可能影响终端变化。经营者可能选择转嫁成本，也可能暂时压缩利润。","对于进口商和餐厅，真实的准备工作包括确认正式税率表、复核不同容量及酒精度产品的税额、检查采购时点与库存，并重新审视酒单定价。对于消费者，最值得关注的是同款酒实际到店后的零售价格，而不只是阅读一个宏观涨税数字。行业组织担心税负提高可能抑制本已谨慎的消费，但目前不能据此预测2027年销量一定会下降多少。","这条新闻说明国家财政政策如何影响一杯酒的最终成本，也提醒行业分析不能把税收变化、成本变化和价格变化机械画等号。正式实施前，仍应持续核对英国政府最终公告与各项细则。","原题及日期： “Britain plans a 4.55% alcohol duty increase for February 2027”；Vinetur（援引Meininger’s International），2026-11-07；拟实施2027-02-01。英国官方最终税率逐项表格本期未独立回读，因此具体产品税负以正式法规为准。原文。"],"sources":[["原文","https://www.vinetur.com/en/20261107110569/britain-plans-a-455-alcohol-duty-increase-for-february-2027.html"]]}],"2026-11-07":[{"title":"宁夏16家精品酒庄赴香港：从参展到真正建立海外市场，还有多远？","body":["11月6日晚，中国新闻网报道，记者从宁夏贺兰山东麓葡萄酒产业园区管委会获悉，第18届香港国际美酒展期间，来自宁夏·贺兰山东麓的 16家精品酒庄 参加展会。展区约90平方米；随行安排包括葡萄酒大师班和产销对接推介会。展会11月5日至7日举行，共有约620家参展商，涉及25个国家和地区、40多个产地。展会规模并不意味着这些展商都采购了宁夏酒。","这条消息比“又参加一次展会”更值得读的地方在于出口基础。报道指出，参展酒庄具备进出口资质与海外拓展基础，其中西班酒庄等企业在香港已经建立代理关系。香港成熟的物流、酒店、零售与国际贸易网络，成为宁夏进入更广泛亚太市场的潜在中转站。展会上进行的专业品鉴，则是在帮助尚不了解国产葡萄酒的采购方认识风土与具体生产者。","但要分清楚三件事：参加展会、获得对接机会，与已完成终端销售是三个阶段。原报道没有提供16家酒庄的新增签单金额、成交瓶数、实际餐厅上架情况或长期复购。不能把“有采购商洽谈”写成“16家酒庄全部达成合作”。真正值得继续跟踪的是具体酒庄进入了哪些香港酒店、酒单与商超，并能否维持稳定供应。","来源：  《宁夏16家酒庄赴香港拓海外市场》，中国新闻网，2026-11-06 21:25；参展活动2026-11-05至07。原文。"],"sources":[["原文","https://www.chinanews.com/cj/2026/11-06/10727461.shtml"]]},{"title":"蓬莱两家酒企亮相广交会：海岸产区正在卖葡萄酒，还是更广的酒饮组合？","body":["山东蓬莱区政府11月6日刊发消息：11月4日闭幕的第140届中国进出口商品交易会上，蓬莱嘉桐酒业、海市酒业随烟台展团参会。展品不只有葡萄酒，还包括威士忌、白兰地、起泡酒、橙酒和其他创新饮品。它们呈现出山东·烟台与蓬莱生产者的另一个现实——海外采购方有时需要的是稳定可交付的一整组酒饮商品，而非单一精品酒款。","地方报道中，企业与采购商重点讨论的是产能、认证、起订量、装箱规格与交货周期。政府称部分企业已就寄样与报价达成初步安排，但这仍不等于海外订单已经完成交付。报道还称，蓬莱近三年葡萄酒累计出口约17.6万升、年均增幅118.76%、远销20多个国家和地区。这些为地方政府口径，尚未逐项核对海关原始表和统计方法；不能用它直接估算某一家酒庄的销量。","对于理解中国酒庄商业模式，这条消息揭示了精品酿造与综合供应链之间的差异。让消费者记住风土，需要酒庄身份、长期品质与故事；满足海外采购，可能还需要明确的认证、稳定数量和跨品类组合。两种能力可以共存，却不能互相取代。报道还提到逃牛岭酒庄计划参与11月5—7日香港国际美酒展，是否形成新的采购合作仍需后续证据。","来源：  《蓬莱产区亮相第140届中国进出口商品交易会》，蓬莱区政府，2026-11-06；展会于2026-11-04闭幕。原文。"],"sources":[["原文","https://www.penglai.gov.cn/col/col13318/art/2026/art_581c73e12694460e927b05c729fd0d81.html"]]},{"title":"法国2026葡萄酒收成估计上调到3,670万百升，但香槟和勃艮第仍受重创","body":["法国农业部统计机构Agreste在11月6日公布的11月版估计，将2026年全国葡萄酒产量从10月预测的 3,490万百升 上调到 约3,670万百升 。随着采收数据逐渐完整，朗格多克—鲁西永与夏朗德等地的实际产量高于此前预期，法国总量因此上修。即便如此，新估值只比极低的2025年高约3%，仍比2021—2025年均值低约10%。","最大的新闻价值是产区之间的巨大反差。Champagne估计比2025年减产约38%；勃艮第—博若莱约减22%，卢瓦尔河谷约减7%。反过来，朗格多克—鲁西永估计增长约25%，波尔多同比增加约10%，但波尔多仍低于近五年平均水平。北部的霜冻、冰雹、干旱和高温，与南部部分地区季末降雨减轻水分胁迫形成了鲜明对照。","需要留意的是：Agreste这项全国统计口径包括用于蒸馏等用途的葡萄酒相关产量，不等于全部适合以瓶装静态酒销售的数量；也不能把香槟产区采收量下降38%，直接写成“今年可上市香槟瓶数将下降38%”。产区库存、上市额度与长期陈年会改变供应节奏。估计仍可随最终申报修订，葡萄酒品质也无法仅凭产量推定。","来源：  Agreste《Une production viticole 2026 révisée à 36,7 millions d’hectolitres》2026-11-06，估计截至11月1日；Reuters《France lifts wine output forecast on better-than-expected yields》，2026-11-06。Reuters报道 · 法文数据整理。"],"sources":[["Reuters报道","https://www.reuters.com/business/retail-consumer/france-lifts-wine-output-forecast-better-than-expected-yields-2026-11-06/"],["法文数据整理","https://www.vinabox.fr/actu/vendanges-millesimes/vendanges-2026-recolte-france-36-7-millions-hectolitres-agreste-novembre/"]]},{"title":"Gran Selezione专属权获法律支持：Chianti Classico为何要守护几个字？","body":["11月4日，意大利参议院最终通过葡萄酒行业法律修订，11月6日Chianti Classico产区协会相关消息经多家意大利专业媒体发布： Gran Selezione 这一高级别标识在现行规定和既有使用资格范围内得到特别保护。对Chianti Classico而言，它自2014年引入该类别后，长期投入葡萄园管理、品牌传播和产区身份塑造。这项表决强化了其使用该术语的法律地位。","重要的是不要混淆 Chianti DOCG 与 Chianti Classico DOCG 。两者虽同在托斯卡纳地区，却拥有不同产区范围和生产规范。Gran Selezione也不是“所有意大利葡萄酒都可以随意写在酒标上的质量赞美词”，其使用涉及明确的法律和产区资格。专业媒体DoctorWine特别指出，修订的法律文字涉及在2026年1月1日前已经于本产区规范中规定该术语的产区；因此不宜超出正式法律条文，把它简化为任何历史例外都不存在的绝对禁令。","一款酒的“高端感”，不只是酒款定价或酒标字体，还可以来自对特定产地身份和长期生产规则的法律保护。不过获得名称专属保护，也并不意味着每一瓶Gran Selezione的品质自动高于其他产区的一切酒款，最终仍要看具体年份、酒庄与酒。","来源：  意大利参议院表决2026-11-04；WineNews《La menzione Gran Selezione è riservata esclusivamente alla Docg Chianti Classico》，2026-11-06；DoctorWine《Gran Selezione, esclusiva al Chianti Classico》，2026-11-06。WineNews报道 · DoctorWine法律解读。"],"sources":[["WineNews报道","https://winenews.it/it/la-menzione-gran-selezione-e-riservata-esclusivamente-alla-docg-chianti-classico_607194/"],["DoctorWine法律解读","https://www.doctorwine.wine/pot-pourri/enomondo-news/gran-selezione-esclusiva-al-chianti-classico/"]]},{"title":"巴罗萨90%的葡萄园参加可持续计划，为什么“参加”和“获认证”不能混成一个数字？","body":["11月5日，Barossa Australia公布：在该产区约14,162公顷的葡萄园中，已有12,768公顷、即 约90%面积 参加Sustainable Winegrowing Australia计划，比一年前多1,264公顷。参与主体共有303家酒庄及葡萄园，其中244家已通过第三方审核取得认证。","这里至少有三套数字：参加计划的 葡萄园面积比例 ，参与计划的 经营主体数 ，以及其中 完成独立审计认证 的经营主体数。只有清楚区分，才不会把“90%面积加入计划”错误写成“90%酒庄通过认证”。Barossa Valley正借助行业合作、培训与审核，把可持续从个别酒庄宣传升级成可供进口商和采购者评估的区域体系。","行业组织还报告约2,405公顷用于生物多样性管理，比上一年增加48%；部分葡萄园采用永久草生覆盖和更系统的病虫害管理。不过这组数据主要来自产区组织，且认证满足某套实践标准不意味着所有生态影响都已经独立量化并证明为正。认证应让生产者的主张更可核验，而非使所有使用“环保”字眼的宣传自动成立。","来源：  Barossa Australia公开数据2026-11-05；Winetitles《90% of Barossa vineyard area now participating in national sustainability program》，2026-11-05；Vinetur后续报道2026-11-06。Winetitles原始发布信息 · Vinetur分析。"],"sources":[["Winetitles原始发布信息","https://winetitles.com.au/90-of-barossa-vineyard-area-now-participating-in-national-sustainability-program/"],["Vinetur分析","https://www.vinetur.com/en/20261106110530/barossa-enrolls-90-of-its-vineyards-in-australias-national-sustainability-program.html"]]},{"title":"普罗旺斯桃红葡萄酒的新集体储备制度：为什么不是“今年都不准卖”？","body":["法国农业部11月5日官方公报公布了一项适用于2026年份桃红葡萄酒的行业储备供给管理措施，涉及Côtes de Provence、Coteaux d’Aix-en-Provence与Coteaux Varois en Provence三大原产地。决定依据10月27日批准的行业安排，将有关储备要求延续至2027年12月31日。这是一项国家认可的集体供给调节措施，而不再只是业内部分成员的自愿协议。","背景是桃红酒市场有很强的季节性。库存放行时间、渠道补货和夏季消费节奏会影响酒商与生产者的现金流。通过对2026年份的一部分产量设置储备管理，行业尝试减轻集中上市造成的供需冲击。但“设置储备”不代表该年份所有酒都禁止售卖，也不意味着政府宣布桃红酒价格必须上涨。","具体储备配额、执行与放行安排，需要按法国农业部公告的完整附件与适用主体逐项核对；本期已核对新闻报道，但 没有独立读取完整官方PDF附件 ，不推算任何酒庄必须扣留的百分比。对采购方而言，这项变化意味着看待产区供应时，还要考虑法规约束、库存与实际可提货时间。","来源：  法国农业部公告2026-11-05（引用2026-10-27行政决定）；Vinetur《France makes Provence rosé reserve rule mandatory through 2027》，2026-11-06。新闻报道。"],"sources":[["新闻报道","https://www.vinetur.com/en/20261106110547/france-makes-provence-rose-reserve-rule-mandatory-through-2027.html"]]}],"2026-11-06":[{"title":"澳洲白葡萄酒对华出口量大增：真正增长的是哪种酒？","body":["11月5日，中国葡萄酒专业媒体《葡萄酒商业观察》（WBO）分析2026年第三季度澳大利亚葡萄酒对华出口数据。澳大利亚葡萄酒当季对华出口额约1.66亿澳元，同比增长1.89%；出口量约1,706万升，增加14.86%；每升平均出口额约9.75澳元，同比下降约11.3%。这是一个“出口量增长更快、平均价值下降”的市场，而非所有酒款同步升值。","白葡萄酒数据尤其醒目：出口量约526万升，同比增加143.4%，金额约1,187万澳元，增长51.8%。但将这一类别细分，就会发现散装白葡萄酒约442万升、同比增加192.1%，每升平均价值约0.89澳元；瓶装白葡萄酒约84万升，增幅约30%，每升平均价值约9.45澳元。白葡萄酒整体数量的大幅增长，主要来自散装酒，而非精品瓶装白葡萄酒在消费终端突然火爆。","这也说明为什么不能简单把出口增长等同于消费者口味变化。散装酒的最终渠道可能与瓶装酒不同；出口商出货也不等于进口商库存已被消化。即使酒商看到这组数据，也不应该直接推断中国顾客越来越喜欢雷司令 Riesling或者立即调高任何白酒售价。判断真实趋势，仍需要把品种、包装、价格带、餐饮销量与复购数据分开观察。","这条新闻的价值是提醒行业：数量、价值和产品结构三种指标可能给出完全不同的市场信号。对于中国进口商，下一步更值得观察的是瓶装白酒的终端接受度，以及大规模散装酒进口究竟进入了哪些渠道。","来源：  WBO《澳大利亚葡萄酒对华出口数据分析》，发布2026-11-05 10:34；事件数据为2026年第三季度。原始中文报道；Wine Australia出口监测入口。媒体数字尚未逐项与原始监测数据复算，故保留来源口径。"],"sources":[["原始中文报道","https://wbo529.com/info/5142"],["Wine Australia出口监测入口","https://www.wineaustralia.com/market-insights/australian-wine-export-monitor"]]},{"title":"把树木种进葡萄园：意大利为何研究农林复合系统？","body":["传统葡萄园往往以规整的葡萄藤行为主要景观，但气温升高、土壤侵蚀及生物多样性变化使种植者重新考虑：是否可以让树木、篱带与葡萄藤共存，形成更加稳定的农业系统？","11月3日，意大利伦巴第地区有关部门介绍VitiSilvA农林复合葡萄园试验项目；11月5日Vinetur进行了报道。项目涉及Franciacorta与Oltrepò Pavese的六家合作酒庄，由米兰大学等研究机构参与，计划研究到2028年。报道提及相关公共支持资金约39万欧元。","它不是简单多种树木，而是设置对照葡萄园，长期测量果区微气候、土壤状况、侵蚀风险、生物多样性，以及树木和葡萄藤竞争水分、养分的情况。在炎热天气里，合理遮阴可能降低果实暴晒；但不恰当的树木密度和位置，也可能造成过度遮阴或改变湿度与病害压力。","所以，这项试验尚不能证明农林复合栽培一定提高葡萄品质，也不能在未得到成本数据之前宣称它能给酒庄节省开支。真正重要的，是把可持续发展从宣传用语推进到可以持续测量、可以验证或证伪的农业研究。","对于酒庄和葡萄酒学习者，这个试验还连接着产区气候、整枝、果实成熟以及风土表现等议题。未来哪些树种与行向最适合某一葡萄园，需要由实验结果决定，而不是从“绿色葡萄园”的外观推断。","来源：  2026-11-03项目介绍；2026-11-05 Vinetur报道， Lombardy Starts Italy's First Vineyard Agroforestry Trial 。米兰大学ForestLab项目介绍 · 原报道。研究尚在实施，结果并非已定论。"],"sources":[["米兰大学ForestLab项目介绍","https://forestlab.unimi.it/progetti/vitisilva/"],["原报道","https://www.vinetur.com/en/20261105110431/lombardy-starts-italys-first-vineyard-agroforestry-trial.html"]]},{"title":"葡萄牙取消一项外国葡萄酒采购限制：为什么融资政策也影响酒庄经营？","body":["葡萄酒业的经营风险不只来自葡萄园和市场价格，还来自现金流。种植者需要提前支付人工与管理成本，酒商会持有库存，而从葡萄收获到商品售出，可能间隔很长时间。面对短期流动性压力，政府专门针对葡萄酒行业的贷款计划，往往关系到酒庄能否维持生产及销售。","11月4日，葡萄牙 Portugal正式公布Portaria n.º 492/2026/1，调整“Linha de Tesouraria — Setor Vinícola II”信贷安排；11月5日相关变化生效，Vinetur亦于11月5日报道。新规定撤销了过去对参与这项信贷安排的企业购买外国葡萄酒所设置的限制。","原限制出发点可能是让公共贷款更多支持本国产品，但酒类经营者的商业模式通常比“只销售自产葡萄酒”更复杂。一家企业可能同时酿酒、采购基酒、经营国外品牌，或者向不同地区分销产品。当融资资格与所有采购行为捆绑时，企业可能面临难以平衡的选择。","必须谨慎理解这项法律：它针对特定财政信贷工具，不等于葡萄牙取消所有葡萄酒进口税，也不等于政府全面放弃本国葡萄种植者利益，更不能直接证明葡萄牙酒庄从此盈利改善。行业表现仍要观察信贷实际申请、企业周转、库存与葡萄采购变化。","这条新闻显示，葡萄酒行业的产量过剩或库存压力，不能只通过限制贸易解决。酒庄长期生存也依赖健康的融资条件和灵活的经营能力。","来源与日期：  官方行政规定2026-11-04发布、2026-11-05生效；Vinetur 2026-11-05，原题  Portugal Removes Ban on Foreign Wine Purchases for Users of State Credit Line 。葡萄牙官方公报 · Vinetur报道。"],"sources":[["葡萄牙官方公报","https://diariodarepublica.pt/dr/detalhe/portaria/492-2026-1190825218"],["Vinetur报道","https://www.vinetur.com/en/20261105110425/portugal-removes-ban-on-foreign-wine-purchases-for-users-of-state-credit-line.html"]]},{"title":"美国葡萄酒销量下降7%，销售额却增加2%：能据此宣布“全面高端化”吗？","body":["根据Farm Credit East 11月初发布的美国葡萄酒业展望，Vinetur 11月4日报道称：截至2026年9月的12个月中，美国葡萄酒销售量约3.4亿个九升箱，同比下降7%；销售金额约1,150亿美元，增长约2%。","这两个数字放在一起，意味着统计口径中的单位销售价值可能提高，或销售结构发生变化。但不能立刻把它解释为“所有美国消费者都改喝高价葡萄酒”。金额和数量的样本覆盖范围未必完全相同，通货膨胀、消费渠道、不同酒款构成和促销策略都可能影响结果。没有更细致的价格段、渠道和实际成交数据，就无法证明高端化是唯一原因。","报告还提及美国不同地区与品种之间的分化：2025年美国东北部部分直销渠道中，雷司令 Riesling的发货量与金额出现增长，品丽珠 Cabernet Franc在一些生产者的酒单中也有较多关注。然而这些例子并不能代表全国所有酒庄，而其他直销统计仍然显示销量压力。","这反映出美国市场更复杂的一面：可能有消费者减少购酒频率，但仍愿意在特定场合购买有品质和故事的酒；也可能有市场价格变化导致金额上涨，而没有真实新增客户。只有持续跟踪客单价、交易次数、酒款分布和复购，才可能回答哪个因素更重要。","对于葡萄酒零售商，比起把全国数据作为涨价或削减库存的理由，更实际的是检查自家葡萄酒售出的瓶数、真实利润、杯卖表现和老客户回来购买的比例。","来源与日期：  Farm Credit East行业展望约2026-11-03发布；Vinetur 2026-11-04报道，原题  US Wine Market Volume Fell 7% to 340 Million Cases, Industry Outlook Says 。数据期截至2026年9月。阅读原报道。"],"sources":[["阅读原报道","https://www.vinetur.com/en/20261104110329/us-wine-market-volume-fell-7-to-340-million-cases-industry-outlook-says.html"]]},{"title":"测量葡萄酒中的氧气：为什么不同仪器的mg/L数值可能不能直接比较？","body":["葡萄酒的氧气管理贯穿酿造、转罐、过滤、灌装、陈年，乃至最后的侍酒服务。业内经常以mg/L表示溶解氧含量，但不少现代传感器首先测量的是氧分压，之后再基于特定溶解度模型换算为浓度。","11月5日，Vinetur报道一项2026年11月初发表的葡萄酒氧气测量技术评述。作者指出，葡萄酒的温度、乙醇、糖分和其他基质成分影响氧气溶解度；不同设备、标定或换算条件也可能导致读数差异。因此，两个不同酒样或者不同仪器呈现的相似mg/L数字，并不总是处于完全可比的测量前提下。","这种警告不是说所有溶解氧仪都不可信。对于酒庄内部的质量控制，采用同一套设备、在相同操作温度和校准条件下重复测量，仍可帮助识别某一生产工序是否引入了过多氧气。真正需要避免的是脱离样品组成、仪器特性与测量程序，把单一数字当作跨酒款绝对排名。","同样，服务中的醒酒与空气接触，也不只是“接触空气就固定吸收多少氧”。香气释放、温度变化、还原性硫化物及时间都会影响人们的感官判断。侍酒师需要把氧气的物理测量和客人杯中的真实感受联系起来，但不能将两者混为同一个数字。","这是一条能帮助学员提高科学思维的专业消息：先问测量的物理量是什么、在什么条件下得到，再判断它能否支持对风格或品质的推论。","来源与日期：  Vinetur 2026-11-05报道， Review Warns Wine Oxygen Readings Cannot Be Safely Compared Across Wines or Devices ，介绍11月初的技术评述。原报道。原技术评述全文与学术版本本次未独立回读，故保留“报道所引述方法学观点”的证据边界，不把它扩大成所有设备无效。"],"sources":[["原报道","https://www.vinetur.com/en/20261105110435/review-warns-wine-oxygen-readings-cannot-be-safely-compared-across-wines-or-devices.html"]]}],"2026-11-05":[{"title":"木桐酒庄用一场百年拍卖，再次把葡萄酒与艺术放在一起","body":["11月4日，意大利 WineNews 报道，Château Mouton Rothschild与苏富比正在筹划一场纪念艺术家酒标百年的专题拍卖。故事的起点不是1945年，而是1924年：Philippe de Rothschild 邀请 Jean Carlu 为这一年份设计酒标，成为酒庄后来与艺术界长期合作的源头。1945年以 Philippe Jullian 的胜利主题酒标为标志，逐年份与艺术家合作的传统逐渐形成。木桐本身位于Pauillac，但其艺术标签让不同年份的瓶子也成了微型艺术史档案。","拍卖并非普通的老年份出售。报道列举了1924—2024年精选年份构成的77瓶加1瓶Magnum酒款组合，以及标有Andy Warhol、Saul Steinberg、Keith Haring与David Hockney作品的四支Magnum；还有2025年份的一整桶酒，约相当于300瓶，供未来按约定格式装瓶。文章另提到2018年的徐冰、2019年的Olafur Eliasson与2020年的Peter Doig酒标。部分由艺术家签名的大瓶装酒款计划将收益的一半捐给无国界医生；这属于宣布的用途，尚不是已经完成的拍卖或捐款。","这条新闻值得注意，不是因为预计总价值达到约190万—310万英镑就意味着所有木桐酒款都在涨价，而是因为艺术作品、酒庄历史、年份与收藏真伪被编织为一个长期持续的文化叙事。酒标可以承载一段真实的合作关系，而不只是贴在酒瓶上的包装。然而当拍卖估价与艺术家名声交织时，也必须把酒本身的状态、保存与成交价格分别判断。","\\*\\*事实边界：\\*\\*此次拍卖拟于2027年2月在伦敦举行；WineNews与11月4日另一个英文报道对具体日期分别写为2月14日和2月4日，日期存在冲突，正式日期需以苏富比最终目录为准。2024年份酒标亦被报道计划在2026年12月1日公开，此时尚未揭晓。这里不把预估价写成成交价。","原题： Château Mouton Rothschild celebra 100 anni delle iconiche etichette d’artista con un’asta mai vista ；来源：WineNews；刊出：2026-11-04；事件：专题拍卖计划已公布，正式拍卖尚未举行。阅读WineNews原文 · 交叉来源Haute Living（日期有差异）"],"sources":[["阅读WineNews原文","https://winenews.it/it/chateau-mouton-rothschild-celebra-100-anni-delle-iconiche-etichette-dartista-con-unasta-mai-vista_606883/"],["交叉来源Haute Living（日期有差异）","https://hauteliving.com/2026/11/mouton-rothschild-sothebys-auction-artist-labels-100th-anniversary-2027/801530/"]]},{"title":"智利葡萄酒出口额下降5.2%：中国市场与巴西为何走向不同方向？","body":["11月3日，Vinetur根据 Vinos de Chile 发布的2026年前九个月出口资料报道，Chile瓶装葡萄酒出口额约9.027亿美元，同比减少5.2%；出口量为3,320万箱（以报道使用的箱计量），下降5.3%；平均每箱出口价格约27.2美元，基本持平。这组数据的重点不在于“整个智利酒都卖不动”，而是不同出口市场的方向存在明显分化。","巴西保持智利瓶装酒第一大出口市场，出口额约1.6578亿美元，增长7.9%，数量增长5.3%。英国的出口额增长5.5%，数量增长2.9%。但美国的出口额下降27.7%至6,478万美元，出口量下降20.5%。 中国市场也值得单独看 ：智利对中国出口额约7,048万美元，同比下降11.6%，出口量下降13.1%，约203万箱。中国仍是重要市场，但今年的进口商采购下降与巴西的增长同时存在。","这种分化有几个解释限制。首先，这些是智利瓶装酒出口金额和数量，而不是中国餐饮渠道、零售商和家庭的最终购买数量。其次，出口箱平均金额与零售瓶价不相同，受到贸易条款、酒款组合、渠道与汇率等因素影响。第三，不能将对美国销量下滑全部归因于关税；报道中虽然讨论不同贸易市场，但这个统计本身不能隔离单一原因。","对消费者与酒商而言，消息意味着单一“新世界葡萄酒增长或衰退”判断已经不足够；同一个生产国，可以在巴西增长、在美国和中国下降，还可能在不同价格段出现相反趋势。真正需要研究的是具体生产者、风格、价格和分销商的长期订单，而不是把一张出口汇总表解释成全部市场的口味变化。","原题： Chile’s bottled wine exports fell 5.2% in the first nine months of 2026 ；来源：Vinetur，援引Vinos de Chile / IRDATA；刊出：2026-11-03；统计期：2026-01至09。阅读原文"],"sources":[["阅读原文","https://www.vinetur.com/en/20261103110310/chiles-bottled-wine-exports-fell-52-in-the-first-nine-months-of-2026.html"]]},{"title":"一枚QR码只能给你看配料表？德国法院划定酒标营销边界","body":["越来越多欧盟葡萄酒瓶身出现QR码。消费者扫描后，可以查看依法要求披露的配料和营养数据，瓶身因此不必容纳一整份清单。但这项电子标签并不是可以放任何营销内容的普通网页。","11月3日，Vinetur报道了德国科隆行政法院9月24日的一项裁决（案号4 K 6494/25）。案件涉及零售商在葡萄酒瓶上印制QR码，并通过链接页面提供法定配料、营养信息；页面同时放了企业Logo与“更多信息”按钮。法院认定，这类用于满足法定电子标签披露义务的页面，不应混入广告或促销内容。文章同时引用欧盟2023年对葡萄酒电子标签的相关指导，提醒酒庄、进口商和第三方电子标签供应商核对现有页面。","这不是一项禁止酒庄制作产品网站的判决。酒庄官网、普通电商产品页仍可介绍酒款、酒标与品牌故事，只需遵守其适用的销售和消费者信息规则。真正受到特别限制的是作为 法定配料和营养电子披露入口 的页面。把它直接跳转到充满商品链接和促销按钮的品牌页，便可能不合规。普通消费者看到相同的QR码，功能却可能完全不同，因此页面用途必须清楚。","对于国际流通酒款，这属于会实际影响包装设计和技术服务的法规进展。尤其是销售到欧盟市场的酒庄，不应假定“QR码页面有配料表就够了”。但需要注意：9月24日是法庭裁决日期，11月3日只是近期媒体再次整理报道；判决的适用范围和是否有进一步救济，应由具体经营者依据欧盟与德国法专业审核，不能凭本报道断言全欧所有网页已自动被认定违法。","原题： German Court Bars Wine Sellers From Using QR Label Pages for Marketing ；来源：Vinetur，援引IT-Recht Kanzlei法律分析；刊出：2026-11-03；法院裁决：2026-09-24。阅读原文"],"sources":[["阅读原文","https://www.vinetur.com/en/20261103110259/german-court-bars-wine-sellers-from-using-qr-label-pages-for-marketing.html"]]},{"title":"罗讷河谷给出两个价格：一座葡萄园“不亏损”和“能活下去”差多少？","body":["11月3日Vinetur整理了法国Inter Rhône公布的2026/27销售年度价格参考体系。针对地区级红葡萄酒Côtes du Rhône，常规及HVE认证酒款的经营收支平衡参考价为 132欧元/百升 ，而能够持续经营、投入生产设备与更新葡萄藤的参考价为 171欧元/百升 ，差额39欧元/百升。有机红葡萄酒对应数字分别为148和193欧元/百升，差额45欧元/百升。","这里两档价格并非“普通酒与精品酒的指导零售价”，而是生产端和贸易商洽谈时可参考的经济指标。行业机构试图区分两个经常被混淆的概念：今年经营没有亏损，不代表已经积累足够资金继续种植、更新葡萄藤和投资未来。葡萄园是一种跨多年运转的农业资产，若长期只按眼前现金收支评估，未来的生产能力也可能受到影响。","但这份指标仍有两个关键限制。第一，这些属于 自愿性参考价格 ，并非法定最低采购价，也不是已经实际完成的交易报价。第二，这组参考价最初已于10月9日在Avignon公布，11月2日至3日的文章属于进一步分析，不应该写成今天才新设的法规。","新闻真正提出的问题是：一个价格，究竟在补偿葡萄、人工与运营，还是也为长期改种、环境改良与投资留下空间？理解产区为何能够持续生产，不能只看消费者看到的酒标售价，还需要了解种植者和酒商之间的经济关系。","原题： Inter Rhône sets €171 reference for sustaining Côtes du Rhône red wine production ；来源：Vinetur；刊出：2026-11-03；Inter Rhône最初公布：2026-10-09。阅读Vinetur原文 · Agra此前报道"],"sources":[["阅读Vinetur原文","https://www.vinetur.com/en/20261103110297/inter-rhone-sets-euro171-reference-for-sustaining-cotes-du-rhone-red-wine-production.html"],["Agra此前报道","https://agronews.com/fr/de/news/breaking-news/2026-10-11/104644"]]}],"2026-11-04":[{"title":"中国进口葡萄酒：量少了5.32%，进口金额为什么反而多了5.61%？","body":["如果只看进口数量，2026年前九个月的中国葡萄酒市场似乎仍然承压；但把金额放在一起看，结论就没有那么简单。","11月3日，北京商报援引酒类进出口商分会的数据报道：2026年1至9月，中国进口葡萄酒的海关金额为 11.67亿美元，同比增长5.61% ；进口数量为 15.68万千升，同比下降5.32% 。同一时期烈酒进口金额达到13.78亿美元，增加19.6%，但数量也同比下降9.40%。这些数字分别衡量进口货值与货物流量，而不是餐厅和消费者实际开瓶的数量。","当进口金额上升而数量下降时，可以推断 海关统计口径下的每升平均进口金额提高了 。但不能进一步断言消费者正在普遍购买更昂贵的葡萄酒：进口来源国、酒种组合、汇率、合同时间和单批次高价值货物，都可能改变平均金额；批发商增加库存也不等于终端零售增长。","对中国葡萄酒市场而言，这是一条比“进口增长”更值得研究的信号。未来需要将瓶装与散装、不同来源国、单瓶价格段以及最终销售数据分开观察。对于具体生产者和门店，真正有解释力的指标，是以同口径比较到货成本、实际成交瓶数和复购，而非把宏观海关数据直接换成经营乐观判断。","原题与原发： 《1—9月烈酒进口额同比增长19.6%》，北京商报， 2026-11-03 16:03 ；数据覆盖 2026-01至09 。转引酒类进出口商分会公布的数据。 阅读北京商报转载全文"],"sources":[["阅读北京商报转载全文","https://finance.eastmoney.com/a/202611033920243415.html"]]},{"title":"卢旺达海拔2700米的葡萄园：新风土究竟意味着什么？","body":["葡萄酒世界正在尝试一些过去鲜少被系统开发的种植地点。11月2日，《Decanter》记者Malu Lambert报道了卢旺达的Vinmusa项目：这一约 2,200万美元 的葡萄酒与旅游开发计划，选择在维龙加高地三处不同微气候的地点试种葡萄，其中位于Karisimbi火山附近的地块海拔可达 2700米 ，项目称其为非洲最高海拔葡萄园之一。","团队先考察了12个候选地点，再确定三处试验场地。2026年9月，在Kinigi地区开始种植Chenin Blanc；另有Sauvignon Blanc等品种的试种安排。当地年均温约16.49℃，日夜温差约11.11℃，使团队看好冷凉风格的可能性，但高海拔并不自动保证优质葡萄酒。","这里的挑战与传统冷凉气候葡萄园不同。高湿度、降雨、真菌病害与缺少明确的冬季休眠周期，都可能使生长季管理变得复杂。研究人员计划尝试架高枝蔓、防雨覆盖和修剪调整。今天看到的是一项实地试验，而非已经有稳定年份、足以评价品质的商业酒款。","更有意思的是，Vinmusa从一开始便同时考虑住宿、餐饮、艺术与文化体验，希望让原本以大猩猩生态旅游闻名的地区形成更长的停留时间。其旅游接待预计2028年起逐步展开，首批葡萄酒则计划约2030年面世。这提醒人们：一个新葡萄酒产区的形成，不只是找到一块凉爽土地，还需要农业技术、稳定生产、身份体系和市场耐心共同积累。","原题与原发：   At the edge of possibility: Africa's highest vineyards taking shape in Rwanda ，Decanter / Malu Lambert， 2026-11-02 。植苗活动发生于 2026年9月 ，旅游及酒款上市均为未来计划，非已实现。 阅读Decanter原文"],"sources":[["阅读Decanter原文","https://www.decanter.com/wine/wine-regions/at-the-edge-of-possibility-africas-highest-vineyards-taking-shape-in-rwanda/"]]},{"title":"葡萄酒酒标写“绿色”“环保”，欧洲为什么要求更有证据？","body":["过去，不少酒标会出现“绿色”“对环境友好”“天然”“清洁”等字样。它们听起来令人安心，却未必告诉消费者具体采用了哪种种植方式、认证标准或环境绩效。","11月2日，行业媒体SevenFifty Daily报道了欧盟 2024/825号指令 对葡萄酒营销的影响。文章指出，自 2026年9月27日 相关限制进入执行阶段以来，在欧盟销售的酒类和其他消费品，对笼统环保断言、缺乏依据的绿色标志和可能误导消费者的宣传，面临更严格要求。这项规则不是专门为葡萄酒设立，而是更广泛的消费者保护制度的一部分。","对生产者而言，区别在于能否 清晰解释和证明声称的内容 。如果一个酒庄说自己采用有机种植、获得特定认证、减少能源使用或采用更轻的包装，需要确认这项说法适用于什么范围、依据是什么、消费者有没有办法验证。单纯把包装做成绿色、加上植物图案，并不能自动证明产品拥有某种环保资质。","这也不意味着“天然葡萄酒”这个术语在所有情况下都一律被欧盟禁止，或所有酒庄都必须马上获得同一项第三方认证。具体宣传语言是否违规、是否涉及独立环保标签，以及各成员国如何监管，仍要结合规则文本与实际情境判断。","对于买酒的人，这条新闻提供了一个更可靠的阅读方法：不要只问酒瓶是否写着“可持续”，更要问可持续 体现在哪一步，有什么证据 。对于葡萄酒教育者，这比简单把酒划分成“绿色”和“不绿色”更有价值。","原题与原发：   Europe Is Cracking Down on Greenwashing. What Does That Mean For Wine Labels? ，SevenFifty Daily / Lauren Johnson-Wünscher， 2026-11-02 。指令编号EU 2024/825；有关实施节点为 2026-09-27 ，不是11月2日才新颁法规。 阅读SevenFifty Daily原文 · EU 2024/825指令原文"],"sources":[["阅读SevenFifty Daily原文","https://daily.sevenfifty.com/europe-is-cracking-down-on-greenwashing-what-does-that-mean-for-wine-labels/"],["EU 2024/825指令原文","https://eur-lex.europa.eu/eli/dir/2024/825/oj"]]},{"title":"意大利2026年葡萄酒产量约4110万百升：为什么行业不急着宣布最终数字？","body":["11月3日，意大利WineNews讨论了今年采收结果的统计方式。欧盟委员会农业部门截至 11月2日 的初步估计显示：2026年意大利葡萄酒产量可能约 4110万百升 ，西班牙约 3750万百升 ，法国约 3380万百升 。这三个国家仍占欧盟葡萄酒生产的重要份额，但这些都是现阶段的估计，并非各国已完成最终审核的产量。","报道强调，今年意大利过去常见的9月联合采收预测并未照常公布，行业选择更多依赖企业正式申报，以避免早期推测与最终产量出现较大差距。按现有申报日程，葡萄采收声明通常截至 11月30日 ，葡萄酒与葡萄汁生产声明通常截至 12月15日 ，实际统计发布可能继续延后。","在葡萄酒行业，生产量往往是最受关注的数字之一，因为人们会将它与库存、价格和出口联系起来。但预计减产也不能简单理解为一定涨价。不同地区的库存、酒款结构、生产者现金流与消费需求仍然会产生不同影响。","这条新闻的价值，不在于马上把4110万百升写进永不更改的产区教材，而在于区分 欧盟初步预测、企业申报、行业统计与最终官方数据 。未来若数字修订，专业媒体与课程必须同步更新，而不能把第一次发布的估算当作固定事实。","原题与原发：   Vendemmia 2026, i dati saranno solo quelli ufficiali delle dichiarazioni aziendali (rumors WineNews) ，WineNews， 2026-11-03 ；欧盟DG Agri估计更新至 2026-11-02 。 阅读WineNews原文"],"sources":[["阅读WineNews原文","https://winenews.it/it/vendemmia-2026-i-dati-saranno-solo-quelli-ufficiali-delle-dichiarazioni-aziendali-rumors-winenews_606817/"]]}],"2026-11-03":[{"title":"宁夏与新疆都在布局香港：参加酒展，能不能转化成真正的酒庄订单？","body":["在国内葡萄酒产业讨论国际化时，最容易被看见的是酒庄参加海外展会的照片；但对于生产者，参展只是进入市场的第一步。真正难的是，让经销商、酒店、餐厅与长期客户愿意持续采购。","中国政府采购网在11月2日披露，宁夏·贺兰山东麓葡萄酒产业园区管委会的「2026香港国际美酒展及宁夏贺兰山东麓葡萄酒推介会系列活动」服务采购成交金额为 119.5万元人民币 。采购内容指向产区展览、品鉴、对接进口商与酒店餐饮渠道等市场推广工作。另一份在10月31日发布的政府采购结果显示，新疆贸促部门的「2026年香港国际美酒展和推介活动」综合服务采购成交金额为 230.7万元人民币 ，原项目还涉及在香港展会后赴澳门推广。","两地的行政项目、采购主体和预算相互独立，不能把金额混成同一项国家拨款。更不能根据采购结果认定参展已经完成、具体酒庄获得多少订单，或香港和东南亚消费者已经大量购买中国葡萄酒。采购合同是在为市场推广购买服务，而不是销售成绩单。","这条中国新闻的价值，是把国产酒庄“出海”从口号推进到实际渠道建设的问题：哪些酒款适合这些市场？进口商对价格与交货有什么要求？展会对接后能否获得可复购的客户？对国内生产者而言，只有下一阶段的成交与持续分销，才能判断这笔公共推广投入的效果。","原始公告与日期： 中国政府采购网《宁夏贺兰山东麓葡萄酒产业园区管委会2026香港国际美酒展及推介会系列活动项目竞争性磋商采购结果公告》2026-11-02；《“2026年香港国际美酒展”和开展推介活动综合服务项目中标（成交）结果公告》2026-10-31。两者均为成交结果，不是实际销售报告。","宁夏政府采购结果 · 新疆政府采购结果"],"sources":[["宁夏政府采购结果","https://www.ccgp.gov.cn/cggg/dfgg/zbgg/202611/t20261102_27604144.htm"],["新疆政府采购结果","https://www.ccgp.gov.cn/cggg/dfgg/zbgg/202610/t20261031_27598297.htm"]]},{"title":"欧盟葡萄酒出口额仍低于去年：10月公布的新贸易统计告诉了我们什么？","body":["欧盟农业与农村发展总司10月29日公布了截至2026年8月的农业食品贸易月报。报告显示，欧盟今年前八个月农业食品出口总值约 1,577亿欧元 ，整体大致稳定。但不同品类的走势并不一致：烈酒与利口酒出口额同比增长约11%，而葡萄酒及相关产品的出口总值约 106.45亿欧元 ，较2025年同期减少约1.64亿欧元，跌幅约2%。","后续在11月2日发布的WineNews分析指出，葡萄酒累计出口额的同比跌幅从7月的约3%收窄至8月的约2%。这可以被理解为降幅有所收窄，但绝不等于出口已经恢复正增长，也不是整个欧洲葡萄酒消费正在上升的证据。","这项统计衡量的是跨境贸易的 金额 ，并非瓶数、成交均价、酒庄利润或终端消费。欧盟出口到不同国家的产品组合、汇率、补库存和提前发货，都会影响金额；不能仅凭总额说明Veneto等某个具体产区表现如何。","对爱酒的人来说，这组数据是一个重要提醒：市场规模不等于每个生产者的命运，精品酒庄与大众渠道的压力也可能不同。下一步值得追踪的，是主要目的地的数量、酒款价格带以及具体产区的真实订单，而不是只盯着一个看似宏观的百分比。","原始资料： European Commission DG AGRI, “EU agri-food exports stable as imports decline slightly”，2026-10-29；贸易数据2026-01至08。葡萄酒品类后续分析：WineNews, “Vino, export Ue in leggero recupero: 10,6 miliardi di euro nei primi 8 mesi 2026”，2026-11-02。","欧盟委员会官方公告 · WineNews葡萄酒细分报道"],"sources":[["欧盟委员会官方公告","https://agriculture.ec.europa.eu/media/news/eu-agri-food-exports-stable-imports-decline-slightly-2026-10-29_en"],["WineNews葡萄酒细分报道","https://winenews.it/it/vino-export-ue-in-leggero-recupero-106-miliardi-di-euro-nei-primi-8-mesi-2026-2-sul-2025_606737/"]]},{"title":"南非葡萄酒在美国的贸易环境可能变化：明年1月1日是关键日期","body":["2026年11月2日，美国贸易代表办公室USTR宣布，美国总统已向国会和相关政府通报， 拟自2027年1月1日起 终止South Africa和卢旺达享有的《非洲增长与机会法案》（AGOA）贸易优惠资格。美国方面把这一意向与年度资格审查、市场准入和外交政策分歧联系起来。南非方面则表示将支持受影响行业，并探索市场多元化。","对葡萄酒业而言，消息值得关注，因为南非是具有成熟葡萄酒出口体系的生产国，美国也是部分南非生产者的重要海外销售市场。路透社介绍，南非2025年有约17亿美元的商品通过AGOA优惠机制出口美国，涵盖汽车零部件、柑橘和葡萄酒等商品； 这个17亿美元不是葡萄酒出口额 。","同样必须分清“通报拟终止优惠资格”与“今天已经停止所有南非葡萄酒进口”。现有公告并未逐酒类税号列出每种葡萄酒未来的适用税率和最终成本，因此不能现在断言所有南非酒的零售价格必定上涨某个百分比，也不能将政策风险理解为美国全面禁止进口南非酒。","这条消息反映了一种现实：葡萄酒生产者的国际竞争力不仅由葡萄园、品质和价格决定，还会受到贸易协定、物流、政策变化与市场多元化能力影响。观察它的下一步，应关注正式实施文件、具体商品的待遇和进口商应对措施。","原始资料： USTR, “Ambassador Greer Issues Statement on President Trump’s Intent to Terminate Rwanda and South Africa from the AGOA Trade Preference Program”，2026-11-02；拟实施日期2027-01-01。路透社2026-11-02进行背景报道。","USTR官方公告 · Reuters报道"],"sources":[["USTR官方公告","https://www.ustr.gov/about/policy-offices/press-office/press-releases/2026/november/ambassador-greer-issues-statement-president-trumps-intent-terminate-rwanda-and-south-africa-agoa"],["Reuters报道","https://www.reuters.com/world/africa/us-suspend-south-africa-rwanda-duty-free-trade-access-2026-11-02/"]]},{"title":"丹麦申请最北端葡萄酒PDO：当“适合种葡萄的地方”不断向北移动","body":["欧盟9月30日正式公布丹麦Røsnæs葡萄酒受保护原产地名称（PDO）的申请，随后进入为期三个月的异议程序。10月28日Gambero Rosso对这一发展作出报道。Røsnæs位于丹麦西兰岛西部海岸，若申请最终获准，将继2018年获批的Dons之后，成为丹麦另一葡萄酒PDO，并有望成为欧盟纬度最北的葡萄酒受保护原产地之一。","从地图来看，这样的纬度很容易让人把它简单概括为气候变暖的结果。但当地葡萄种植的实际条件更为复杂：海洋调节温度、夏季日照、降雨量、冰碛沉积土与具有保水作用的黏土层共同影响生长条件。报道引用的当地数据包括年降雨量约523毫米，日照时数比丹麦全国平均多约200小时。","另一项关键，是葡萄品种选择。申请规范涉及Solaris、Souvignier Gris、Johanniter、Muscaris等较适应冷凉环境的品种，以及部分Pinot Noir和红色品种。允许的风格包括静态酒与传统法起泡酒，规范提及手工采摘、当地装瓶及起泡酒瓶中二次发酵等要求。","但必须强调： 申请已经公布不等于PDO已正式注册生效 。有异议程序与最终审批，不能现在把所有Røsnæs酒款当作已注册法定产区酒。葡萄栽培向北扩展，也不代表所有北欧土地都适合生产高质量葡萄酒。它真正说明的是，产区规则、适应性品种与当地自然条件，正为消费者带来新的葡萄酒来源。","来源与日期： 欧盟申请刊登日期2026-09-30；Gambero Rosso, “Il vino si spinge sempre più a nord: la Danimarca punta alla Dop più settentrionale d'Europa”，2026-10-28。11月2日WineNews继续讨论，非新注册决定。"],"sources":[["阅读Gambero Rosso专业报道","https://www.gamberorosso.it/notizie/attualita/danimarca-rosnaes-dop-vino-piu-settentrionale-ue"]]},{"title":"意大利酒窖里有4,104万百升葡萄酒：库存增加，是否等于消费者不买了？","body":["意大利ICQRF发布的Cantina Italia统计显示，2026年9月30日意大利经营主体登记的葡萄酒库存约 4,104万百升 ，比2025年同日的3,595万百升高出14.2%。该数据于10月已在行业内被报道，10月31日Vinetur进一步分析了从夏季到采收期的库存结构， 不是11月3日才发生的新盘点 。","库存增加也存在品类差异。DOP白葡萄酒库存达到约1,044万百升，同比增加23.7%；IGP白葡萄酒约410万百升，同比增加34%。意大利北部约占全国库存的57.7%，其中Veneto的库存约1,021万百升。","但是，酒窖库存统计不能直接区分产品是否已经卖给经销商、是否仍归酒庄拥有或是否只是暂未发货；也不能把葡萄汁与正在发酵的新酒直接加进“已经可销售的葡萄酒”。从6月底到9月底，葡萄酒库存实际还减少了548万百升。因此它既不是葡萄酒“全部卖不动”的直接证据，也不能证明行业需求回暖。","对于葡萄酒市场而言，这一数字的意义是提醒我们同时观察多个时间尺度：采收期的生产、发酵进度、酒窖库存、渠道进货和消费者开瓶，并不总发生在同一个月份。仓库里有多少酒，只是经营问题的开始；库存结构、库龄、已订货比例与实际现金流，才决定不同生产者面对的压力。","原始资料： ICQRF Cantina Italia截至2026-09-30的登记数字；Vinetur, “Italian wine stocks rose 14.2% to 41.04 million hectoliters by late September”，2026-10-31；此前行业已于10月中旬讨论同一统计。该条为近一周的数据深读，不冒充新的11月库存。"],"sources":[["阅读Vinetur数据分析","https://www.vinetur.com/en/amp/20261031110140/italian-wine-stocks-rose-142-to-4104-million-hectoliters-by-late-september.html"]]}],"2026-11-02":[{"title":"法国葡萄园普遍承压，为什么利穆反而扩种100公顷？","body":["法国葡萄酒行业近年持续讨论供给过剩、种植成本和消费者变化，法国南部一些产区正面临缩减葡萄园面积的压力。但是10月30日的一份产业报道提供了一个方向相反的样本：根据当地 AOC 行业组织 Syndicat des Vins AOC Limoux 的数据，Limoux 的法定产区葡萄园面积在2025—2026年间增加约100公顷，达到1,800公顷。","这里的关键并非“利穆不受市场危机影响”。当地生产者仍然受到葡萄收购价格和成本压力限制。与一些只依赖传统静态红葡萄酒的产区不同，利穆拥有长期发展的起泡酒产业，包括Crémant de Limoux。报道称，该起泡酒在2025年的销售规模约800万瓶，其中52%销往出口市场，48%在法国本土销售；过去十年的销售规模接近翻倍。清爽的静态白葡萄酒，也是当地生产者尝试适应消费变化的一部分。","报道还指出，当地平均每年出现约一座新的独立酒庄，统计中不包括普通家族传承。新的生产者加入和已有酒庄的葡萄园更新，为产区保留生产活力提供了可能。但“新增100公顷”属于2025至2026年面积变动，“800万瓶”属于2025年销售；两者不能混写成2026年新酿出800万瓶，亦不能据此证明每个利穆酒庄都盈利。","利穆的新闻真正有意思之处，在于一个产区的韧性可以来自适合当下消费者的酒款结构、出口渠道和新的投资者，而不是简单扩大或缩减全部葡萄园。它也提醒消费者：理解法国葡萄酒市场时，必须区分不同法定产区，而不能把整个法国描述成同一种经营状态。","原题： “Limoux expands its vineyards by 100 hectares despite France’s wine slump”｜Vinetur｜原发2026-10-30；面积比较期2025—2026，起泡酒销售数据为2025。 查看原始报道"],"sources":[["查看原始报道","https://www.vinetur.com/en/amp/20261030110084/limoux-expands-its-vineyards-by-100-hectares-despite-frances-wine-slump.html"]]},{"title":"加拿大撤下部分美国酒后，南澳葡萄酒为什么成为受益者？","body":["贸易关系变化有时会迅速影响消费者在超市和酒类专卖店看到的酒款。自2025年加拿大与美国发生贸易争端以来，安大略、不列颠哥伦比亚等省的酒类零售渠道陆续减少或撤下美国葡萄酒。对其他国家的生产者而言，这提供了一个原本难以迅速获得的货架空间。","南澳州政府10月21日发布的资料显示，截至2026年8月的12个月，South Australia对加拿大葡萄酒出口总值达到约1.28亿澳元，同比 增加超过2,400万澳元 。加拿大因此成为南澳州葡萄酒的第三大出口目的地，排在中国及英国之后，超过美国。这是 南澳州 的市场排序，并非整个澳大利亚的排序。","出口数量也有增长：约4,850万升，同比增长38.6%。南澳州约占澳大利亚对加拿大葡萄酒出口的68%。南澳州政府通过零售渠道推广、试饮活动与驻外商务支持争取机会，其中2026年7—8月曾在安大略省的九家重点门店展示16款南澳葡萄酒。政府另披露销售促销期间的阶段性增长，但此类活动数据不能直接推断整个加拿大市场的长期复购。","值得警惕的是，部分转述将“增加2,400万澳元”误写成“从2,400万升至1.28亿”；它们是完全不同的事实。出口额和数量衡量的是跨境交易，不等于所有葡萄酒已经由最终消费者喝完。在市场环境改变后，进入新货架只是开始；能否通过品质、价格和长期客户关系留住市场，才是南澳酒庄接下来的考验。","来源与日期： 南澳州政府 Department of State Development 原始发布2026-10-21；Vinetur 后续详细报道2026-10-30；统计期间截至2026年8月。 州政府一手资料 · 10月30日行业报道"],"sources":[["州政府一手资料","https://statedevelopment.sa.gov.au/news/canadians-crushing-on-sa-wine"],["10月30日行业报道","https://www.vinetur.com/en/20261030110096/south-australian-wine-exports-to-canada-surged-to-a%24128-million-in-the-year-through-august.html"]]},{"title":"香槟的二级市场真的复苏了吗？Salon和Selosse说明了什么？","body":["10月30日，葡萄酒交易市场Liv-ex的2026年Champagne市场观察指出：香槟价格可能正出现阶段性稳定与选择性回升，但真正领涨的并不是所有酒庄、所有年份，而是少数具有成熟年份、稀缺供应或成熟收藏声誉的酒款。","研究特别提及Salon 2002。按报道转述的Liv-ex交易记录，一箱12瓶的成交加权均价从 2025年8月的7,400英镑 升至 2025年11月的9,089英镑 。这个例子虽然出现在2026年10月发表的报告中，价格上涨的两个观测点实际上都发生在2025年；不能写成Salon 2002在本周突然涨价。高价酒的报价、真实成交价与不同包装、酒况或批次也应分别看待。","另外，Liv-ex指出Salon和Jacques Selosse的混合装箱在2026年香槟交易金额中合占约11.5%，但所占成交瓶数远小于这一比例。数值显示的是二级市场 交易金额集中度 ，不是香槟产区总产量、零售销量，更不是两个生产者占了香槟11.5%的消费市场。较少数量、单价较高的酒款，可以贡献很大的交易金额。","同一报告也描述了一个相反趋势：部分最近上市的年份香槟，发行价格仍高于二级市场可买到的成熟老年份，因此受到买家的谨慎比较。消费者或收藏者不应将“少数经典酒款回升”简化为“现在买什么香槟都能涨”。对酒庄和酒商而言，年份、释放时间、库存和新酒定价，比泛泛而谈品牌热度更重要。","原题： “Older and rarer Champagnes are leading a selective recovery”｜Vinetur，2026-10-30，转述Liv-ex《The 2026 Champagne Market》；上述Salon价格对比时点为2025年8月与11月。 阅读行业详细报道"],"sources":[["阅读行业详细报道","https://www.vinetur.com/en/amp/20261030110064/older-and-rarer-champagnes-are-leading-a-selective-recovery.html"]]},{"title":"法国散装葡萄酒交易量增长10%，为什么卖得更多未必赚得更多？","body":["在高价香槟吸引收藏者注意的同时，法国另一个市场同样在谈“回升”：散装葡萄酒。10月29日，Meininger's International援引法国农业与葡萄酒市场机构FranceAgriMer相关统计指出，在2025/26销售年度，法国Vins de France类别的散装酒 登记合同数量 折合约260万百升，比上一年度增长10%；IGP散装酒合同数量折合约610万百升，同比增长3%。10月30日Vinetur进一步报道了这些数字。","表面上，这是葡萄酒交易活跃度改善的信号。但合同数量增长与利润增长之间，并不存在自动对应关系。报道指出，不标示品种的Vins de France红、白、桃红三类散装酒，价格出现不同程度下跌。这意味着市场即便交易了更多数量，生产者仍可能承受单位价格压力；采购商交易更积极，也可能包含低价补货或库存调整。","还需要区分统计口径。此处并非“法国所有葡萄酒消费者销量增长10%”，也不是“全部法国葡萄酒价格上涨”。Vins de France和IGP只是不同法定类别；统计对象为相关销售年度的散装酒合同，并不是瓶装酒零售、餐厅杯卖，也不能直接转换成实际消费瓶数。若不同时看品类、年份、颜色、合同价格和终端销售，很容易误判产业是否复苏。","这条新闻的价值正在于提醒读者：葡萄酒行业中，葡萄园面积、成品酒销量、批发合同量、成交单价和经营利润是五组不同指标。当它们朝着不同方向运动时，“增长”两个字就需要更谨慎的解释。","来源与日期： Meininger's International 2026-10-29行业整理；Vinetur《France’s Bulk Vins de France Sales Rise 10% in a Sign of Market Recovery》2026-10-30；统计期2025/26销售年度。 阅读行业报道"],"sources":[["阅读行业报道","https://www.vinetur.com/en/amp/20261030110070/frances-bulk-vins-de-france-sales-rise-10-in-a-sign-of-market-recovery.html"]]}],"2026-11-01":[{"title":"宁夏的60.7万亩葡萄园：酒庄发展的下一步，不只是国际获奖","body":["10月27日《人民日报》发表对宁夏葡萄酒产业发展的回顾。文章引用的区域数据包括酿酒葡萄种植面积60.7万亩、约130座特色酒庄、年产葡萄酒约1.4亿瓶，以及产品进入40多个国家和地区。对消费者而言，这些数字并不直接说明一款酒品质如何，却表明中国葡萄酒已经从最初的生产试验形成较完整的种植、加工、人才和旅游体系。","故事的起点可以追溯到1984年玉泉营农场的酿酒尝试。今天，在宁夏·贺兰山东麓种葡萄，仍然必须面对一个非常具体的现实问题：冬季寒冷干燥，部分葡萄藤需要埋土越冬，水资源和机械化管理也不能照搬欧洲葡萄园的现成模式。报道记录了本地适应性树形、深沟浅栽、滴灌、水肥一体化，以及「北红」等抗寒品种的研究。这些比奖牌数量更能说明中国酒庄长期发展的难度。","10月12日至16日，第47届世界葡萄与葡萄酒大会在银川举行，这是大会首次落地亚洲。10月27日文章属于会后产业回顾，不能表述为11月1日新开幕。文中的产量、就业、旅游人次来自官方报道口径，不是本次独立审计的酒庄终端销量，也不能据此推断盈利水平。中国葡萄酒未来的一个重要命题，是将已建立的种植和生产能力转化成长期真实消费，而不仅是扩大国际声量。","原题《宁夏持续发展葡萄酒产业 打造亮丽的“紫色名片”》｜《人民日报》2026-10-27（东方财富转载）｜大会实际日期2026-10-12至16。 核查原报道"],"sources":[["核查原报道","https://finance.eastmoney.com/a/202610273908731529.html"]]},{"title":"Chianti终于允许桃红？真正的新消息是欧盟10月30日的规则公告","body":["意大利Chianti长期与红葡萄酒联系在一起，但酒款风格实际上受法定产区生产规范约束，不能凭生产者的营销创意随意使用受保护名称。10月30日，欧盟官方公报刊登Chianti DOP生产规范「已批准普通修订」的公告。报道指出新规范将桃红葡萄酒纳入法定类型，同时调整部分混酿、子产区及陈年要求。对种植者而言，这意味着未来在满足具体条款时，可以考虑以Chianti名称生产与销售桃红，而不必完全脱离原有原产地框架。","这里需要澄清时间线：意大利本国主管机关已经在2026年6月批准这次普通修订，并非桃红葡萄酒直到10月31日才第一次获准。 本周真正的新进展是10月30日欧盟层面的公告程序。  这条新闻同样不能混同Chianti Classico DOCG；Chianti与Chianti Classico有不同的产区和法定规范。","在一个消费者越来越习惯饮用桃红、干白和清爽风格的市场里，传统产区是否扩大合法产品类型是一项战略决定。但法规允许不等于酒庄已经大规模上市，更不等于所有Chianti桃红的葡萄组成、颜色或销售潜力都相同。理解这一变化时，可以从托斯卡纳的核心品种Sangiovese入手，再区分产区规范与具体生产者酒款。","来源：Fondazione Qualivita《Chianti DOP, pubblicazione comunicazione approvazione modifica ordinaria disciplinare》2026-10-30；Vinetur《The European Union Approves Rosé Wines Under the Chianti DOP》2026-10-31；意大利国家批准公告2026-06-12。 欧盟公告线索 · 意大利国家公报 · 专业报道"],"sources":[["欧盟公告线索","https://www.qualivita.it/normativa/chianti-dop-pubblicazione-comunicazione-approvazione-modifica-ordinaria-disciplinare-guue-c-del-30-10-2026/"],["意大利国家公报","https://www.gazzettaufficiale.it/eli/id/2026/06/12/26A02927/SG"],["专业报道","https://www.vinetur.com/en/20261031110130/the-european-union-approves-rose-wines-under-the-chianti-dop.html"]]},{"title":"阿根廷小酒庄线上卖酒增长19.49%，为什么仍不能说电商大获成功？","body":["10月30日，阿根廷葡萄酒观察机构、COVIAR与电商组织等在门多萨介绍2025年度酒庄电商研究。10月31日Vinetur报道：小型与中型酒庄的线上六瓶箱销售量比2024年增加19.49%，订单数增加17.14%；与此同时，酒庄线上销售总体瓶数换算量减少3.21%，大型酒庄线上销量下降10.49%。同一数字平台上，大企业和小生产者的表现可以完全不同。","真正重要的并不是「增长19.49%」一个数字。研究记录2025年酒庄自有购物车共114,454个订单，平均每单约12.07瓶，平均客单价156,295阿根廷比索。185家设有购物车的酒庄中，实际全年有订单的仅62家。酒庄电商在全国葡萄酒销售中只占有限份额，传统渠道仍然重要。对Argentina精品生产者而言，直接接触消费者确实有机会，但从展示酒款到形成真实交易，中间仍有巨大距离。","更尖锐的是成本：该调查中物流平均占终端订单售价16.21%，约93.86%的交易由酒庄承担运费，常见折扣均值29%。即使订单和箱数增长，也可能吞噬毛利；2025年销售额按当地货币增长25%，低于31.5%的当年通胀。因而，这条新闻不是鼓励所有酒庄通过补贴、低价和包邮冲销量，而是提醒品牌必须把销售规模、履约成本和实际利润分开计算。","原题《Small and mid-sized Argentine wineries raised online case sales by 19.49% in 2025》｜Vinetur，2026-10-31；研究成果发布活动2026-10-30，研究期间2025年度。 阅读报道及研究方法"],"sources":[["阅读报道及研究方法","https://www.vinetur.com/en/20261031110143/small-and-mid-sized-argentine-wineries-raised-online-case-sales-by-1949-in-2025.html"]]},{"title":"意大利酒庄旅游真正缺的，也许不是葡萄园，而是能被预订的体验","body":["10月27日至28日，意大利Riva del Garda举办第二届FINE #WineTourism Marketplace Italy，吸引约100家参展生产者与旅游目的地、90名专业买家。10月30日WineNews报道会后讨论：酒庄旅游不能只停留在「我们拥有很美的葡萄园」或「我们提供品酒」。旅行者真正需要的，是可以辨认内容、确定价格、预约时段、顺利抵达并获得服务保障的完整体验。","这一变化看似是旅游业问题，其实直接涉及酒庄商业模式。意大利产区拥有历史、艺术、美食与葡萄酒，但这些资源只有变成清晰可售的服务产品，旅行社、酒店与当地接待者才能推广。相关非随机行业问卷显示：受访旅游机构中75%在上一年收到葡萄酒相关咨询，约61%至少完成一笔涉及葡萄酒的销售；有64%反映酒庄提供给中介的价格关系不合理，60%提到缺少实时空位及线上预订。调查不具行业总体统计代表性，不能说全国75%的旅行社一定都有这类需求。","研究的提醒在于，好的故事不等于好的产品。对游客，了解酿酒师、参与采收、体验地方餐桌可能比多喝三款酒更难忘；对经营者，则仍需要每场人数、服务时数、预约渠道、成本和满意度等基本管理。 葡萄酒旅游的未来不是把品鉴室装修得更豪华，而是把人与土地之间的体验设计得更真实、更容易参与。","原题《Fine #WineTourism Marketplace Italy: l’enoturismo italiano ha bisogno di evolvere》｜WineNews / Clementina Palese，2026-10-30 16:55，回顾10月27–28日活动。 阅读WineNews原报道 · 活动官方日期"],"sources":[["阅读WineNews原报道","https://winenews.it/it/fine-winetourism-marketplace-italy-lenoturismo-italiano-ha-bisogno-di-evolvere_606612/"],["活动官方日期","https://www.gardatrentino.it/en/events/fine-winetourism-marketplace-italy_89210"]]},{"title":"美国葡萄酒批发出货量下滑8%，但部分白葡萄酒和Malbec仍有增长","body":["10月28日，美国葡萄酒与烈酒批发商协会WSWA发布SipSource报告；Vinetur在10月29日进行了独立整理。报告显示，截至2026年9月的过去12个月，美国葡萄酒从批发商发往零售、餐饮等渠道的数量同比减少8.0%。这不是消费者收银台总购买量，SipSource覆盖的也不是所有美国市场，报告称其覆盖范围大约相当于相关批发量的70%，因此不应简单将它当成全国葡萄酒最终消费降幅。","值得注意的是，市场并非所有风格一起下降。在报告所追踪的价格9美元及以上部分品类中，白葡萄混酿销售金额增长8.1%，【葡萄品种】马贝克 Malbec增长6.4%，Sauvignon Blanc增长4.5%；相反Merlot、Zinfandel和红葡萄混酿金额下降。与此同时，价格较高的酒款仍可能借折扣刺激出货，不能把某个品种的营收增长说成其销量同比增长，更不能证明美国葡萄酒总体已经复苏。","与前一日已经报道的加州葡萄园拔藤相比，这里讨论的是另一端：经销商真实向商业渠道出货的变化。葡萄酒供需调整的难题正在于酒庄种植、经销商库存和消费者最后一杯酒之间存在时间差。只有同时理解数量、金额、价格和渠道，才能判断增长是真需求还是暂时促销。","原题《U.S. wine shipments from wholesalers fell 8.0% through September 2026》｜Vinetur，2026-10-29；WSWA报告发布2026-10-28；统计窗口2025-10至2026-09。 阅读具体指标及统计边界"],"sources":[["阅读具体指标及统计边界","https://www.vinetur.com/en/20261029110024/us-wine-shipments-from-whol
