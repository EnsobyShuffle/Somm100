<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F6F2">
  <meta name="description" content="ONE English — 一个地方完成英语单词、句子、阅读、口语和每日复习。">
  <title>ONE English — Learn a little. Speak a lot.</title>
<style>

:root {
  --paper: #f7f7f2; --white: #fff; --ink: #1a2827; --muted: #788582;
  --line: #e8eae4; --pine: #204c43; --pine-deep:#123e36; --mint: #d9ebe1;
  --mint-pale: #eef6ef; --orange: #efad7f; --sand:#fcf2e7; --shadow:0 18px 60px rgba(27,47,41,.055);
  --radius:22px; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft Yahei",sans-serif;
}
* {box-sizing:border-box}
html {scroll-behavior:smooth}
body {margin:0;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.55}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.48}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #83ba9d;outline-offset:3px}
a{color:inherit}
.layout{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
.sidebar{background:#fff;border-right:1px solid #eaeee8;padding:30px 20px 24px;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;max-height:100vh}
.brand{display:flex;gap:12px;align-items:center;margin:0 10px 50px;cursor:pointer;width:fit-content;user-select:none}
.brand-mark{width:48px;height:48px;border-radius:17px;background:var(--pine-deep);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:650;letter-spacing:-5px;padding-right:6px;position:relative;line-height:1}
.brand-mark span{font-size:32px;position:relative;top:-9px;left:1px;color:#bad7b7}
.brand-copy{display:flex;flex-direction:column;line-height:1}
.brand-copy strong{font-size:29px;letter-spacing:-1.8px;font-weight:720;line-height:1.05}
.brand-point,.mobile-brand>span{color:#8ea997}
.brand-copy small{font-size:9px;letter-spacing:2px;font-weight:700;color:#758580;margin-top:6px}
.sidebar-label,.sidebar-foot{color:#9aa59e;font-size:10px;letter-spacing:1.8px;font-weight:700;margin:0 17px 14px}
.side-nav{display:flex;flex-direction:column;gap:7px}
.nav-item{border:0;background:none;color:#51625d;padding:14px 15px;display:flex;gap:12px;text-align:left;align-items:center;width:100%;border-radius:13px;font-weight:620;white-space:nowrap}
.nav-icon{font-size:23px;line-height:1;width:26px;text-align:center;font-family:Arial,sans-serif;font-weight:400}
.nav-en{margin-left:auto;font-size:10px;font-weight:500;color:#9ca9a2}
.nav-item:hover,.sidebar-settings:hover{background:#f1f5ef}
.nav-item.active{background:#e9f3e9;color:var(--pine-deep)}
.nav-item.active .nav-en{color:var(--pine)}
.sidebar-spacer{flex:1;min-height:30px}
.sidebar-coach{background:#eaf2e8;padding:22px 20px;border-radius:19px;margin:0 0 22px;min-height:148px;position:relative;overflow:hidden}
.sidebar-coach:after{content:'✳';position:absolute;right:-24px;bottom:-50px;color:#d4e5d8;font-size:148px;line-height:1;transform:rotate(-15deg)}
.coach-spark{font-size:21px;color:#709577}
.coach-kicker{font-size:9px;letter-spacing:2px;font-weight:800;color:#62836e;margin:7px 0}
.coach-quote{font-size:15px;font-weight:660;line-height:1.45;position:relative;z-index:1}
.coach-quote em{font-style:normal;color:var(--pine)}
.sidebar-settings{display:flex;gap:12px;align-items:center;background:transparent;border:0;border-radius:12px;padding:13px 18px;color:#708078;text-align:left}
.sidebar-foot{margin:20px 17px 0;letter-spacing:1.1px}
.main-area{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:84px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 clamp(24px,5vw,66px);background:rgba(247,247,242,.9)}
.breadcrumb{font-size:10px;letter-spacing:2px;color:#9aa6a1;font-weight:750}
.topbar-right{display:flex;gap:16px;align-items:center}
.today-pill{border:1px solid #e4eae2;border-radius:20px;font-size:11px;font-weight:700;background:#fff;padding:7px 11px;color:#60746a}
.user-bubble{border:0;padding:0;cursor:pointer;width:33px;height:33px;border-radius:50%;background:#dbe8d7;color:#315246;display:grid;place-items:center;font-weight:800}
.mobile-brand{display:none;font-weight:800;font-size:27px;letter-spacing:-2px}
.mobile-brand small{font-size:10px;letter-spacing:1.5px;color:#80908a}
.page-content{padding:46px clamp(24px,5vw,66px) 62px;max-width:1370px;width:100%;margin:0 auto;flex:1}
.page-footer{padding:20px clamp(24px,5vw,66px);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;font-size:11px;color:#9ea7a0;letter-spacing:.35px}
.mobile-nav{display:none}
.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:#709184;text-transform:uppercase}
h1,h2,h3,h4,p{margin-top:0}
h1{font-size:clamp(30px,3.8vw,48px);line-height:1.21;letter-spacing:-1.55px;font-weight:760;margin:9px 0 10px}
h2{font-size:25px;line-height:1.25;letter-spacing:-.7px;margin:0}
h3{font-size:17px;line-height:1.35;font-weight:720;margin:0}
.muted{color:var(--muted)}
.lede{font-size:14px;color:#72837c;margin:0;line-height:1.7}
.page-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:31px}
.page-heading .lede{max-width:640px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:32px 0 16px}
.section-head h2{font-size:22px}
.small-link{background:none;border:0;color:var(--pine);font-weight:750;font-size:12px;padding:6px 0}
.small-link:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:20px;background:#edf3ec;color:#416c54;font-weight:700;font-size:10px;white-space:nowrap}
.chip.gray{background:#f1f3ee;color:#7a847d}
.chip.peach{background:#fcf0e5;color:#ac7854}
.chip.dark{background:var(--pine);color:#fff}
.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:12px;padding:13px 19px;font-weight:750;background:var(--pine-deep);color:#fff;min-height:44px;transition:transform .2s,background .2s;text-align:center}
.button:hover:not(:disabled){background:#246455;transform:translateY(-1px)}
.button.secondary{background:#f1f6f0;color:#215847}
.button.secondary:hover:not(:disabled){background:#dcece0}
.button.outline{background:#fff;border:1px solid #dbe4db;color:#325e4d}
.button.outline:hover:not(:disabled){background:#f0f7ee}
.button.ghost{background:transparent;color:#477060}
.button.full{width:100%}
.button.tiny{min-height:36px;padding:8px 12px;font-size:12px;border-radius:10px}
.icon-button{display:inline-flex;align-items:center;justify-content:center;min-width:37px;height:37px;border:1px solid #e3e9e0;border-radius:50%;background:#fff;font-size:17px;color:var(--pine)}
.icon-button:hover{background:#ebf5ec}
.card{border:1px solid #e9ece6;border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;background:var(--pine-deep);border-radius:27px;color:#fff;padding:37px 39px;align-items:center;position:relative;overflow:hidden;min-height:264px}
.hero:before{content:'✳';position:absolute;font-size:390px;color:#fff;opacity:.035;right:145px;top:-198px;transform:rotate(23deg)}
.hero>.hero-content{position:relative;z-index:1}
.hero-kicker{font-size:10px;letter-spacing:2px;color:#accdc2;font-weight:800;margin-bottom:15px}
.hero h2{font-size:clamp(29px,3.1vw,40px);letter-spacing:-.85px;line-height:1.32;max-width:490px;margin-bottom:11px}
.hero p{color:#bcd1c7;max-width:520px;margin:0 0 20px}
.hero .button{background:#eaf5e9;color:#1d4e3e}
.hero .button:hover{background:white}
.hero-progress{display:flex;flex-direction:column;align-items:center;gap:9px}
.ring{width:171px;height:171px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#b8debc var(--p),#386457 0);position:relative}
.ring:after{content:'';position:absolute;background:var(--pine-deep);width:130px;height:130px;border-radius:50%}
.ring-inner{z-index:1;text-align:center;line-height:1}
.ring-inner strong{display:block;font-size:44px;letter-spacing:-2px}
.ring-inner small{font-size:10px;color:#b2cdc1;letter-spacing:1px}
.hero-progress>span{color:#cae1d4;font-size:11px}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-top:18px}
.stat-card{padding:20px 21px;min-height:110px;background:white;border:1px solid var(--line);border-radius:17px}
.stat-card .stat-label{font-size:11px;color:#8b9a90;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:780;letter-spacing:-.8px;line-height:1.1}
.stat-value small{font-size:12px;color:#94a49a;margin-left:4px;font-weight:600}
.stat-card .tiny-foot{color:#88a397;font-size:10px;margin-top:4px}
.plan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.plan-card{display:flex;align-items:center;gap:15px;padding:21px 21px;position:relative;min-height:135px}
.plan-card:hover{border-color:#c9ddd1}
.plan-icon{width:54px;height:54px;display:grid;place-items:center;border-radius:15px;background:#edf4e9;font-size:24px;flex-shrink:0}
.plan-card:nth-child(2) .plan-icon{background:#fff1e7}.plan-card:nth-child(3) .plan-icon{background:#ebf0fa}.plan-card:nth-child(4) .plan-icon{background:#f1edef}
.plan-main{min-width:0;flex:1}
.plan-main strong{font-size:15px;display:block;margin:4px 0}
.plan-main .mini-en{font-size:10px;letter-spacing:.5px;color:#91a29a}
.plan-main p{font-size:11px;color:#809187;margin:0}
.plan-arrow{align-self:flex-end;color:#80a590;font-size:23px}
.plan-check{color:#468861;font-size:20px}
.note-banner{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 22px;background:#eaf1e7;border-radius:18px;margin-top:19px}
.note-banner h3{font-size:14px;margin-bottom:4px}
.note-banner p{margin:0;font-size:12px;color:#6d8375}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr);gap:18px}
.panel{padding:28px}
.panel-note{font-size:12px;color:#85948c;margin:8px 0 17px}
.tabs{display:inline-flex;gap:3px;padding:5px;background:#eef1e9;border-radius:13px;max-width:100%;overflow-x:auto}
.tab{border:0;background:transparent;color:#7d8b7f;border-radius:9px;padding:9px 15px;font-size:12px;font-weight:710;white-space:nowrap}
.tab.active{background:white;color:#234d3f;box-shadow:0 2px 5px #233c2520}
.progress-line{height:8px;border-radius:30px;background:#edf1e9;overflow:hidden}
.progress-line>div{background:#71ab8b;height:100%;border-radius:30px;transition:width .25s}
.flashcard{min-height:285px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:36px;position:relative;cursor:pointer;background:linear-gradient(155deg,#fff 65%,#f0f7ef)}
.flashcard .word{font-size:clamp(30px,5vw,47px);font-weight:770;letter-spacing:-1.2px;line-height:1.22;word-break:break-word}
.flashcard .phonetic{color:#80978c;font-size:14px}
.flashcard .word-meaning{font-size:24px;font-weight:700;margin-top:8px}
.flashcard .example{color:#6f847a;max-width:500px;font-size:14px}
.flashcard .hidden-text{color:#9ba9a1;font-size:12px}
.flashcard-foot{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 15px}
.rating-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:13px}
.rate{border:1px solid #e1e9e0;background:#fff;color:#35604d;border-radius:11px;padding:13px 8px;font-weight:750}
.rate small{display:block;font-size:9px;font-weight:500;color:#9aaba1}
.rate.again{color:#a55c48;background:#fef5f1}.rate.hard{color:#956c3a;background:#fffaf0}.rate.easy{color:#286b52;background:#e9f6ed}
.rate:hover{border-color:#9fbaa7}
.quiz-choice{display:flex;gap:10px;align-items:center;width:100%;background:#fff;border:1px solid #e3e8e1;border-radius:12px;padding:13px 14px;margin:9px 0;text-align:left;color:#3d5348}
.quiz-choice.selected{border-color:#428b68;background:#f0f7ed}
.quiz-choice.correct{border-color:#79b98b;background:#e8f6e9}.quiz-choice.wrong{border-color:#dda28e;background:#fff2ed}
.search{width:100%;background:#fff;border:1px solid #e1e9e2;border-radius:12px;padding:13px 15px;outline:none;min-height:43px}
.search:focus{border-color:#6ca386}
.filter-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0 20px}
.filter-btn{border:1px solid #e4eae3;border-radius:30px;background:#fff;padding:7px 12px;font-size:11px;color:#78877c}
.filter-btn.active{background:var(--pine);color:#fff;border-color:var(--pine)}
.word-list{display:flex;flex-direction:column;gap:9px}
.word-list-item{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid #ebeee9;border-radius:12px;padding:12px 14px}
.word-list-item .word-main{flex:1;min-width:0}
.word-list-item b{display:block;font-size:14px}
.word-list-item small{display:block;font-size:12px;color:#87958d;margin-top:3px}
.word-list-item .word-note{font-size:10px;color:#9baba0}
.heart{font-size:18px;color:#aab8ac}.heart.active{color:#e7a07d}
.sentence-card{padding:34px;text-align:center}
.sentence-en{font-size:clamp(24px,3vw,35px);font-weight:740;line-height:1.4;letter-spacing:-.6px;margin:35px auto 17px;max-width:620px}
.sentence-zh{font-size:18px;color:#285746;font-weight:700;margin:23px 0 10px}
.sentence-sub{font-size:12px;color:#8d9a91}
.sentence-controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:27px}
.reader-list,.scenario-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.reader-item,.scenario-item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:9px;min-height:194px;cursor:pointer;text-align:left;transition:transform .2s,border-color .2s}
.reader-item:hover,.scenario-item:hover{border-color:#b0cab4;transform:translateY(-2px)}
.reader-item .item-en,.scenario-item .item-en{font-size:18px;font-weight:750;letter-spacing:-.25px;line-height:1.35}
.reader-item .item-zh,.scenario-item .item-zh{font-size:12px;color:#849389}
.reader-item .item-foot,.scenario-item .item-foot{display:flex;gap:6px;justify-content:space-between;align-items:center;margin-top:auto}
.item-foot .muted{font-size:11px}
.article-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:0 0 21px;border-bottom:1px solid var(--line)}
.article-title{font-size:clamp(27px,3vw,35px);font-weight:750;line-height:1.22;margin:8px 0}
.article-body{font-size:17px;line-height:2.2;color:#3b4b44;margin:23px 0;letter-spacing:.05px}
.article-body .token{cursor:pointer;border-radius:3px;padding:1px 0}
.article-body .token:hover{background:#e2efe5;color:#234c3b}
.reader-help{font-size:12px;color:#8c9d91;margin-bottom:10px}
.word-pop{border-radius:14px;background:#ecf5eb;border:1px solid #d8e9d7;padding:16px 17px;margin:16px 0}
.word-pop strong{font-size:18px;display:block;margin-bottom:4px}
.word-pop p{margin:0 0 10px;color:#75867a}
.comprehension{margin-top:25px;border-top:1px solid var(--line);padding-top:26px}
.question{margin:22px 0}
.question-title{font-weight:710;font-size:14px;margin-bottom:11px}
.chat-window{border-radius:20px;border:1px solid #e5ede5;background:#fff;min-height:330px;height:460px;max-height:58vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:17px}
.chat-msg{max-width:82%;display:flex;flex-direction:column;gap:5px;align-self:flex-start}
.chat-msg.user{align-self:flex-end}
.chat-meta{font-size:10px;font-weight:700;color:#90a297;display:flex;gap:6px;align-items:center}
.chat-bubble{background:#f2f6f0;color:#25493c;border-radius:6px 18px 18px 18px;padding:12px 15px;font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.chat-msg.user .chat-bubble{background:#214f43;color:#fff;border-radius:18px 6px 18px 18px}
.chat-feedback{font-size:11px;color:#608b68;background:#edf6eb;padding:9px 12px;border-radius:10px;max-width:88%;margin:auto 0 0}
.chat-input-row{display:flex;gap:8px;margin-top:12px;align-items:center}
.chat-input{flex:1;min-width:0;border:1px solid #e1e9e0;border-radius:12px;background:#fff;padding:13px 14px;outline:none}
.chat-input:focus{border-color:#7aa98a}
.chat-help{font-size:12px;color:#7e8d83;margin:10px 2px 0;min-height:20px}
.split-select{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
.pill-option{padding:11px 14px;border:1px solid #e5ebe3;border-radius:12px;background:#fff;color:#52695c;font-weight:680}
.pill-option.active{background:#e7f2e6;border-color:#8fbb99;color:#265a3e}
.phonic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.phonic-card{border:1px solid #e4eae3;border-radius:16px;background:#fff;padding:17px;text-align:left}
.phonic-card.active{border-color:#7fb496;background:#eef7ee}
.phonic-symbol{font-size:30px;font-weight:700;color:#245c46}
.phonic-card .muted{font-size:11px}
.phonic-detail{margin-top:17px;padding:26px}
.phonic-detail h2{font-size:30px;margin:6px 0 12px}
.chart-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;height:176px;align-items:end;margin-top:26px}
.bar-item{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px}
.bar-bg{background:#edf1ea;flex:1;width:100%;max-width:44px;border-radius:8px 8px 4px 4px;display:flex;align-items:flex-end;overflow:hidden;min-height:110px}
.bar-fill{background:#79af8e;width:100%;border-radius:7px 7px 0 0;min-height:0;transition:height .2s}
.bar-label{font-size:10px;color:#9aa89b}
.progress-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.achievement{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid var(--line);border-radius:12px;background:white}
.achievement .badge-icon{width:43px;height:43px;border-radius:13px;background:#edf5e8;display:grid;place-items:center;font-size:23px}
.achievement strong{font-size:13px}.achievement small{display:block;color:#91a099;font-size:11px}
.field-label{font-size:12px;font-weight:700;color:#43584c;display:block;margin-bottom:8px}
.field{border:1px solid #dce5d9;border-radius:11px;padding:12px;background:white;width:100%;color:var(--ink)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 0;border-bottom:1px solid #edf0e9}
.setting-row strong{font-size:14px}.setting-row p{color:#829187;font-size:11px;margin:4px 0 0}
.setting-row .field{max-width:200px}
.settings-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}
.empty{padding:45px 16px;border-radius:18px;background:#f3f7f0;text-align:center;color:#7f9586}
.empty strong{display:block;color:#466250;font-size:17px;margin-bottom:6px}
.notice{background:#f2f5ee;border:1px solid #e5ebe1;border-radius:12px;padding:14px 16px;color:#738377;font-size:12px;line-height:1.7}
.notice.warning{background:#fff8ef;border-color:#f3e6d1;color:#936b47}
.toast{position:fixed;z-index:2000;bottom:26px;left:50%;transform:translate(-50%,20px);padding:13px 21px;border-radius:12px;background:#173d32;color:#fff;opacity:0;pointer-events:none;transition:all .24s;box-shadow:0 13px 24px #1d4c4038;font-weight:700;max-width:min(90vw,400px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#onboarding-root{position:relative;z-index:100}
.onboard-backdrop{position:fixed;inset:0;display:grid;place-items:center;background:#163930bf;backdrop-filter:blur(7px);padding:16px;overflow:auto}
.onboard-card{width:min(100%,570px);max-height:min(95vh,800px);overflow:auto;background:#fff;border-radius:26px;box-shadow:0 24px 85px #153c3c45;padding:34px}
.onboard-mark{display:grid;place-items:center;width:55px;height:55px;background:#1e5140;color:white;border-radius:16px;font-size:32px;font-weight:750;margin-bottom:24px}
.onboard-card h2{font-size:35px;letter-spacing:-1.25px;line-height:1.18;margin:0 0 12px}
.onboard-card>p{color:#829287;margin-bottom:27px}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:23px}
.choice{border:1px solid #e0e9dd;background:#fff;padding:12px 8px;border-radius:12px;color:#496757;text-align:center;font-weight:760}
.choice small{display:block;color:#99aaa0;font-size:10px;font-weight:500;margin-top:4px}
.choice.active{background:#e9f6e9;border-color:#79ad88;color:#215b3e}
.onboard-topics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 24px}
.onboard-topic{border:1px solid #e2e9df;border-radius:12px;background:white;padding:10px 13px;text-align:left;font-size:12px;font-weight:700;color:#4d6658}
.onboard-topic.active{background:#e9f5e9;border-color:#85ad8f}
.mobile-brand{display:none}
@media (max-width:1060px){
 .layout{grid-template-columns:220px minmax(0,1fr)}.sidebar{padding:25px 13px 18px}.nav-en{display:none}.brand{margin-bottom:36px}.hero{grid-template-columns:minmax(0,1fr) 170px;padding:30px}.ring{width:151px;height:151px}.ring:after{width:117px;height:117px}.ring-inner strong{font-size:38px}
 .page-content{padding:32px 28px 55px}.topbar{padding:0 28px}
}
@media (max-width:770px){
 .layout{display:block}.sidebar{display:none}.mobile-brand{display:block}.breadcrumb{display:none}
 .topbar{height:65px;padding:0 21px}.user-bubble{width:30px;height:30px}.today-pill{font-size:10px}
 .page-content{padding:25px 17px 85px}.page-footer{display:none}
 .mobile-nav{display:flex;align-items:stretch;justify-content:space-around;position:fixed;bottom:0;left:0;right:0;z-index:75;background:rgba(255,255,255,.98);border-top:1px solid #e6eae4;box-shadow:0 -6px 30px #0c38250c;padding:7px 3px calc(5px + env(safe-area-inset-bottom))}
 .mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;background:none;border:none;color:#94a29a;padding:3px;min-height:44px}
 .mobile-nav-item span{font-size:23px;font-family:Arial,sans-serif;line-height:1}.mobile-nav-item small{font-size:10px;font-weight:700}
 .mobile-nav-item.active{color:#245d44}
 .page-heading{margin-bottom:20px}.page-heading h1{margin-bottom:7px}
 .hero{grid-template-columns:1fr 118px;gap:0;padding:26px 22px;border-radius:21px;min-height:221px}
 .hero h2{font-size:26px}.hero p{font-size:11px;line-height:1.6;margin-bottom:15px}
 .hero-kicker{font-size:9px}.hero .button{min-height:38px;padding:9px 12px;font-size:11px}
 .ring{width:106px;height:106px}.ring:after{width:84px;height:84px}.ring-inner strong{font-size:29px}.ring-inner small{font-size:7px}.hero-progress>span{font-size:9px}
 .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}
 .stat-card{padding:15px;min-height:94px}.stat-value{font-size:23px}
 .plan-grid,.reader-list,.scenario-list,.grid-2{grid-template-columns:1fr}
 .plan-card{min-height:110px;padding:15px}.plan-icon{width:48px;height:48px}
 .section-head{margin-top:26px}.section-head h2{font-size:20px}
 .note-banner{align-items:flex-start}.panel{padding:20px}
 .toast{bottom:90px}
 .phonics-grid{grid-template-columns:repeat(3,1fr)}.onboard-card{padding:23px;border-radius:20px}.onboard-card h2{font-size:29px}
 .flashcard{min-height:250px;padding:22px}.rating-row{grid-template-columns:repeat(2,minmax(0,1fr))}
 .page-heading{align-items:flex-start;flex-direction:column;gap:13px}
 .chat-window{height:400px;max-height:50vh;padding:15px}
 .progress-stats{grid-template-columns:1fr}
}
@media (max-width:430px){
 .hero{grid-template-columns:1fr 98px;padding:23px 17px}.hero h2{font-size:22px}.hero p{max-width:205px}
 .ring{width:90px;height:90px}.ring:after{width:70px;height:70px}.ring-inner strong{font-size:24px}
 .ring-inner small{font-size:6px}
 .choice-grid{gap:5px}.choice{padding:11px 3px;font-size:12px}
 .topbar-right{gap:8px}.today-pill{padding:6px}
 .sentence-card{padding:24px 15px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}



/* ONE English 0.2 — Quiet Editorial design system */
:root {
  --paper: #F7F6F2;
  --white: #FDFDFA;
  --ink: #252922;
  --muted: #85877E;
  --line: #E0DFD8;
  --pine: #394A3C;
  --pine-deep: #28372D;
  --mint: #E9EDE7;
  --mint-pale: #F0F2ED;
  --orange: #B6A994;
  --sand: #F4F0E8;
  --shadow: none;
  --radius: 10px;
  --serif: "Iowan Old Style", "Baskerville", "Palatino Linotype", "Georgia", serif;
  font-family: "Inter", "Helvetica Neue", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
}
* { -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body { font-size:14px; line-height:1.65; background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased; }
button, input, select, textarea { font-family:inherit; }
button { transition:background-color .18s ease, color .18s ease, border-color .18s ease; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline:2px solid #778976;outline-offset:3px; }
.layout { grid-template-columns:238px minmax(0,1fr); }
.sidebar { background:#F9F8F5; border-right:1px solid var(--line); padding:44px 26px 29px; }
.brand { margin:0 10px 70px; gap:0; }
.brand-mark {display:none;}
.brand-copy strong { font-size:34px; font-weight:580; line-height:1; letter-spacing:-2.8px; }
.brand-copy small { margin-top:9px; color:#898D83; font-size:9px; font-weight:520; letter-spacing:2.35px; }
.brand-point,.mobile-brand>span { color:#758875; }
.sidebar-label { margin:0 12px 19px; font-size:9px; letter-spacing:2px; color:#999C92; font-weight:610; }
.side-nav { gap:4px; }
.nav-item { border-radius:2px; padding:13px 12px; gap:14px; color:#777D74; font-size:12px; font-weight:550; border-left:2px solid transparent; }
.nav-item.active { background:transparent; color:#27352A; border-left:2px solid #596D5B; font-weight:700; }
.nav-item:hover, .sidebar-settings:hover { background:#F0F0EB; }
.nav-icon { width:20px;display:flex;align-items:center;justify-content:center;line-height:1; }
.nav-icon svg,.mobile-nav-item svg,.sidebar-settings svg { width:19px;height:19px;display:block;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round; }
.nav-en {font-size:9px;color:#B1B3AA;font-weight:450;}
.nav-item.active .nav-en {color:#697567;}
.sidebar-coach {background:transparent; border-radius:0; border-top:1px solid var(--line);margin:0 10px 19px;padding:25px 2px 0;min-height:initial;}
.sidebar-coach:after {display:none;}
.coach-spark {display:none;}
.coach-kicker {font-size:9px;color:#969B8D;letter-spacing:1.8px;font-weight:570;margin:0 0 12px;}
.coach-quote {font:normal 19px/1.48 var(--serif);color:#4B5549;letter-spacing:-.2px;}
.coach-quote em {font-style:italic;color:#384E3D;}
.sidebar-settings {width:100%; border-top:1px solid var(--line);padding:17px 13px 10px;gap:12px;border-radius:0;font-size:12px;color:#72796F;}
.sidebar-foot {font-size:9px;letter-spacing:.5px;color:#B4B7AC; margin:15px 12px 0;font-weight:400;}
.topbar {height:76px; background:var(--paper);border-bottom:1px solid var(--line);padding:0 clamp(35px,6vw,89px);}
.breadcrumb {font-size:9px;font-weight:580;letter-spacing:2px;color:#8F9287;}
.topbar-right {gap:21px;}
.today-pill {background:none;border:none;border-radius:0;padding:0;font-size:11px;color:#7E8579;font-weight:500;}
.user-bubble {background:transparent;border:1px solid #CED1C8;border-radius:50%;height:32px;width:32px;font-size:12px;color:#4C584B;font-weight:550;}
.user-bubble:hover {background:#EDEFE9;}
.page-content {max-width:1160px;padding:58px clamp(35px,6vw,89px) 100px;}
.page-footer {padding:23px clamp(35px,6vw,89px);font-size:10px;color:#A5A79D;letter-spacing:.6px;}
.eyebrow {color:#81877B;font-size:9px;letter-spacing:2.2px;font-weight:625;}
h1,h2,h3 {color:var(--ink);}
h1 {font-size:clamp(36px,4vw,49px);letter-spacing:-1.8px;line-height:1.25;font-weight:560;margin:10px 0 12px;}
h2 {font-weight:560;letter-spacing:-.6px;}
h3 {font-weight:570;}
.lede {color:#82877D;font-size:13px;line-height:1.95;}
.page-heading {margin-bottom:34px;padding-bottom:32px;border-bottom:1px solid var(--line);}
.page-heading .lede {max-width:600px;}
.section-head {margin:33px 0 18px;}
.section-head h2 {font:normal 26px/1.3 var(--serif);letter-spacing:-.7px;}
.small-link,.text-link {font-size:11px;color:#4C5F4E;font-weight:550;padding:7px 0;background:transparent;border:0;}
.text-link {display:inline-flex;align-items:center;gap:10px;white-space:nowrap;}
.text-link:hover,.small-link:hover {text-decoration:underline;text-underline-offset:4px;}
.button {background:#29382E;border:1px solid #29382E;border-radius:3px;font-size:12px;font-weight:550;letter-spacing:.05px;min-height:44px;padding:12px 19px;transition:background .18s ease,border-color .18s ease;}
.button:hover:not(:disabled){background:#415747;border-color:#415747;transform:none;}
.button.secondary {background:#E9ECE6;color:#354B3D;border-color:#E9ECE6;}
.button.secondary:hover:not(:disabled){background:#DDE4DA;border-color:#DDE4DA;}
.button.outline {background:transparent;border-color:#C8CEC3;color:#455649;}
.button.outline:hover:not(:disabled){background:#ECEFE9;border-color:#BEC8BB;}
.button.ghost {background:transparent;border-color:transparent;color:#536450;}
.button.tiny {min-height:36px;font-size:11px;border-radius:3px;padding:8px 14px;}
.icon-button {height:37px;min-width:37px;border:1px solid #D5DAD1;background:transparent;border-radius:50%;font-size:16px;color:#435748;}
.icon-button:hover {background:#E8ECE6;}
.chip {border-radius:2px;padding:5px 8px;background:#EAEEE8;color:#4A5F4B;font-weight:550;font-size:9px;letter-spacing:.35px;}
.chip.gray {background:#EEEEE9;color:#888D83;}.chip.peach {background:#F2EDE6;color:#99806C;}.chip.dark {background:var(--pine-deep);color:white;}
.card {background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:none;}
.panel {padding:32px;}
.notice {border:1px solid var(--line);background:#F0F1EA;border-radius:4px;color:#6C7769;padding:14px 17px;}
.notice.warning {background:#F6F1E9;border-color:#E8DDCC;color:#98785A;}
/* The new journal-style home */
.home-intro {padding-bottom:47px;}
.home-overline {display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px;font-size:9px;font-weight:600;letter-spacing:2px;color:#91978B;}
.home-intro-inner {display:flex;align-items:flex-end;justify-content:space-between;gap:26px;padding-top:46px;}
.home-hello {font-size:10px;letter-spacing:2px;font-weight:590;color:#737D70;margin-bottom:19px;}
.home-intro h1 {font:normal clamp(54px,6.35vw,83px)/1.075 var(--serif); letter-spacing:-3.5px;margin:0 0 21px;max-width:760px;color:#2D362B;}
.home-intro h1 em {font-weight:400;font-style:italic;color:#778574;}
.home-subtitle {font-size:14px;font-weight:400;color:#7D8577;line-height:1.8;margin:0;letter-spacing:.12px;}
.home-date {font-size:9px;color:#A4A79D;font-weight:550;letter-spacing:1.7px;white-space:nowrap;margin-bottom:5px;}
.daily-feature {background:#FFF; border:1px solid #D9DDD3;padding:28px 35px 31px;}
.daily-feature-heading {display:flex;justify-content:space-between;gap:15px;font-size:9px;letter-spacing:2.05px;font-weight:600;color:#7D8879;}
.feature-grid {display:grid;grid-template-columns:minmax(0,1.4fr) minmax(180px,.75fr);gap:40px;align-items:end;margin-top:35px;}
.feature-primary h2 {font:normal clamp(33px,4.2vw,51px)/1.11 var(--serif);letter-spacing:-1.85px;color:#29362C;margin:0 0 13px;}
.feature-primary p {font-size:12px;color:#7F897D;max-width:460px;line-height:1.9;margin:0 0 24px;}
.feature-cta {min-width:180px;justify-content:space-between;gap:30px;}
.feature-cta span:last-child {font-size:16px;font-weight:400;}
.feature-secondary {padding:0 0 1px 25px;border-left:1px solid var(--line);}
.feature-secondary-kicker {font-size:9px;letter-spacing:1.7px;color:#959C90;font-weight:575;}
.feature-count {display:flex;align-items:baseline;gap:7px;margin:3px 0 17px;line-height:1;}
.feature-count strong {font:normal 86px/.98 var(--serif);letter-spacing:-6px;color:#435847;}
.feature-count span {font:normal 20px var(--serif);color:#9AA59B;}
.feature-meter {height:2px;background:#E6E9E3;width:100%;}
.feature-meter>div {height:2px;background:#435E4B;transition:width .25s;}
.feature-meter-caption {margin-top:10px;display:flex;justify-content:space-between;gap:8px;font-size:8px;letter-spacing:.85px;color:#9AA398;}
.stats-strip {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line);padding:32px 0 30px;margin:0 0 55px;}
.stat-item {display:flex;flex-direction:column;gap:6px;padding:0 24px;border-left:1px solid var(--line);}
.stat-item:first-child {padding-left:0;border-left:none;}
.stat-item>span:first-child {font-size:9px;font-weight:600;letter-spacing:1.6px;color:#9CA399;}
.stat-item strong {font:normal 33px/1.1 var(--serif);letter-spacing:-.8px;color:#333E34;}
.stat-item strong small {font:400 12px 'Inter',sans-serif;color:#999D93;margin-left:3px;letter-spacing:0;}
.stat-note {font-size:11px;color:#90998E;}
.practice-section-head {display:flex;align-items:end;justify-content:space-between;gap:20px;padding-bottom:18px;}
.practice-section-head .eyebrow {margin-bottom:9px;}
.practice-section-head h2 {font:normal clamp(28px,3.2vw,37px)/1.2 var(--serif);letter-spacing:-.85px;margin:0;}
.practice-section-head h2 span {font:normal 11px 'Inter',sans-serif;letter-spacing:0;color:#9AA096;margin-left:9px;}
.practice-list {border-top:1px solid #D9DDD4;}
.practice-row {display:flex;align-items:center;gap:28px;width:100%;text-align:left;border:0;border-bottom:1px solid #D9DDD4;border-radius:0;background:transparent;min-height:103px;padding:21px 4px;color:var(--ink);}
.practice-row:hover {background:#EFEEE9;}
.practice-index {font:normal 22px var(--serif);letter-spacing:-1px;color:#AFB2A8;min-width:44px;}
.practice-copy {display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;}
.practice-name {font:normal 23px/1.2 var(--serif);letter-spacing:-.5px;color:#323C32;}
.practice-details {font-size:11px;color:#92998E;line-height:1.6;}
.tiny-bullet {color:#C5CBC0;padding:0 6px;}
.practice-side {display:flex;align-items:center;gap:27px;}
.practice-time {font-size:9px;letter-spacing:1px;color:#9BA398;white-space:nowrap;}
.practice-chevron {height:32px;width:32px;display:grid;place-items:center;color:#637767;border:1px solid #D7DCD2;border-radius:50%;font-size:16px;font-weight:400;}
.practice-chevron.is-done {color:#FFF;background:#4C6552;border-color:#4C6552;font-size:13px;}
.home-endnote {display:grid;grid-template-columns:1fr 1.8fr auto;align-items:baseline;gap:20px;margin-top:49px;padding-top:18px;border-top:1px solid var(--line);}
.home-endnote>span {font-size:9px;letter-spacing:1.5px;font-weight:560;color:#959B90;}
.home-endnote p {font-size:11px;color:#999F95;margin:0;line-height:1.8;}
/* Practice pages: thinner lines, airy controls, no candy colors */
.tabs {background:transparent;padding:0;border-radius:0;gap:26px;border-bottom:1px solid var(--line);width:100%;}
.tab {padding:13px 2px 16px;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;color:#979D92;font-size:12px;font-weight:500;}
.tab.active {background:transparent;box-shadow:none;color:#314436;border-bottom-color:#4F6551;font-weight:620;}
.tab:hover {color:#4C6250;}
.progress-line {height:3px;background:#E8EAE4;border-radius:0;}
.progress-line>div {border-radius:0;background:#536B56;}
.flashcard {background:#FFFEFB;min-height:325px;border:1px solid #D5DCD2;border-radius:5px;padding:48px;gap:13px;}
.flashcard .word {font:normal clamp(43px,6vw,62px)/1.15 var(--serif);letter-spacing:-1.9px;color:#2C3E31;}
.flashcard .phonetic {font:normal 16px/1.5 var(--serif);color:#8D988D;}
.flashcard .word-meaning {font-size:20px;font-weight:550;color:#4A5B4C;}
.flashcard .example {font:normal 17px/1.65 var(--serif);color:#778378;}
.flashcard .hidden-text {color:#929B91;font-size:11px;letter-spacing:.6px;}
.rate {border:1px solid var(--line);border-radius:3px;background:#fff;color:#536557;font-weight:570;font-size:12px;}
.rate small {color:#9BA498;font-weight:400;}.rate.again {color:#8A655C;background:#F9F6F2;}.rate.hard {color:#8C7962;background:#FAF8F2;}.rate.easy {color:#436249;background:#EFF3ED;}
.quiz-choice {background:#FFF;border-color:var(--line);border-radius:3px;padding:15px 16px;color:#59655A;}
.quiz-choice.selected {background:#F0F3EF;border-color:#8D9D90;color:#374C3B;}
.quiz-choice.correct {background:#ECF3EC;border-color:#A6B9A8;}.quiz-choice.wrong {background:#FAF3EF;border-color:#D6BCAF;}
.search,.chat-input,.field {border:1px solid #D9DDD4;border-radius:3px;background:#FFFEFC;color:var(--ink);padding:13px 14px;}
.search:focus,.chat-input:focus,.field:focus {border-color:#667E69;outline:none;}
.filter-row {gap:8px;margin:17px 0 23px;}
.filter-btn {border-radius:2px;border-color:#E0E2DA;background:#FDFCFA;font-weight:470;font-size:11px;}
.filter-btn.active {background:#3E5543;border-color:#3E5543;}
.word-list {gap:0;border-top:1px solid var(--line);}
.word-list-item {border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:18px 10px;}
.word-list-item b {font:normal 21px var(--serif);letter-spacing:-.2px;color:#354838;}
.word-list-item small {color:#899489;}.word-list-item .word-note{color:#9AA99B;}
.heart {color:#A6B0A5;}.heart.active {color:#8F9B83;}
.sentence-card {padding:45px;}.sentence-en {font:normal clamp(32px,4.25vw,48px)/1.35 var(--serif);letter-spacing:-.7px;}
.sentence-zh {font-size:18px;color:#4C6651;font-weight:500;}.sentence-sub{color:#979F95;}
.reader-list,.scenario-list {gap:14px;}
.reader-item,.scenario-item {background:#fff;border:1px solid var(--line);border-radius:4px;padding:27px;min-height:192px;transition:background-color .18s,border-color .18s;}
.reader-item:hover,.scenario-item:hover {background:#F1F3EE;border-color:#BAC5B9;transform:none;}
.reader-item .item-en,.scenario-item .item-en {font:normal 25px/1.22 var(--serif);letter-spacing:-.4px;color:#374C3A;}
.reader-item .item-zh,.scenario-item .item-zh {color:#8C998C;}
.article-title {font:normal clamp(33px,4.5vw,53px)/1.13 var(--serif);letter-spacing:-1.6px;color:#2D4434;}
.article-body {font:normal clamp(18px,2vw,21px)/2.0 var(--serif);color:#405347;}
.article-body .token:hover{background:#EFF2EB;color:#344D38;}
.word-pop {border:1px solid #D6E0D1;border-radius:3px;background:#F2F5EE;}
.chat-window {border:1px solid #DEE2D9;border-radius:3px;background:#FFFEFC;}
.chat-meta {color:#A0A99E;font-weight:500;}
.chat-bubble {background:#F0F2ED;border-radius:2px 12px 12px 12px;color:#3A4F3C;}
.chat-msg.user .chat-bubble {background:#394F3D;border-radius:12px 2px 12px 12px;}
.chat-feedback {background:#EDF2EB;border-radius:3px;color:#56735B;}
.pill-option,.phonic-card {border:1px solid var(--line);border-radius:3px;background:#fff;color:#5F6C61;}
.pill-option.active,.phonic-card.active {background:#EDF2EC;border-color:#8B9E8B;color:#334C38;}
.phonic-symbol {font:normal 34px var(--serif);color:#48674B;}
.chart-bars {gap:16px;}.bar-bg {border-radius:0;background:#E9EDE6;max-width:50px;}.bar-fill {background:#869B86;border-radius:0;}
.achievement {border-color:var(--line);border-radius:3px;}.achievement .badge-icon{border-radius:3px;background:#EDF0E9;}
.setting-row {border-bottom:1px solid var(--line);}.setting-row strong {font-weight:570;}.setting-row p {color:#939A91;}
.empty {background:#F0F1EB;border-radius:3px;color:#849384;}.empty strong{color:#49644C;}
.toast {background:#354A3B;border-radius:3px;box-shadow:0 8px 28px rgba(28,40,27,.1);font-size:12px;font-weight:530;}
/* Onboarding lives in the same visual system */
.onboard-backdrop {background:rgba(43,49,42,.56);backdrop-filter:blur(5px);}

const ARTICLES = [
 {id:'r1',title:'My First English Conversation',subtitle:'第一次勇敢开口',level:'A0',topic:'conversation',mins:5,
  body:`Today, I meet someone new at a coffee shop. Her name is Emma. She smiles and says, “Hello! How are you?” I feel a little nervous because I am learning English. I say, “I'm good, thank you. How about you?” We talk for two minutes. I make a few mistakes, but Emma understands me. Before she leaves, I say, “It was nice to meet you.” She says, “You too!” I feel happy. Two minutes may seem short, but today I spoke English instead of staying silent. Tomorrow, I want to try again.`,
  summary:'在咖啡馆第一次和陌生人用英语交谈，虽然紧张，却完成了真正的交流。',qs:[['Why is the speaker nervous?',['They lost their phone.','They are learning English.','They missed the train.'],1],['How does the speaker feel at the end?',['Happy','Angry','Sleepy'],0]]},
 {id:'r2',title:'A Simple Morning Routine',subtitle:'一个可坚持的早晨',level:'A0',topic:'daily',mins:5,
  body:`I wake up at seven o'clock. I drink a glass of water and open the window. Then I make breakfast. I usually have eggs, fruit, and tea. Before I start work, I study English for ten minutes. I listen to a short conversation and repeat the useful sentences. Sometimes I cannot remember a word. That's okay. I write it down and review it the next day. Small habits help me learn. I don't need a perfect morning. I just need to begin.`,
  summary:'用十分钟听英语、重复句子、记录生词，从简单晨间习惯建立长期学习。',qs:[['When does the speaker study English?',['Before work','After dinner','On the bus'],0],['What happens when a word is difficult?',['They quit studying.','They write it down.','They skip breakfast.'],1]]},
 {id:'r3',title:'Ordering Lunch',subtitle:'午餐点餐',level:'A1',topic:'dining',mins:6,
  body:`Mia goes to a small restaurant for lunch. A server welcomes her and gives her the menu. “Are you ready to order?” he asks. Mia would like a salad and a bowl of soup. She has a food allergy, so she asks, “Does the soup contain nuts?” The server checks with the kitchen before answering. He explains that the soup is made without nuts, but the kitchen also handles nuts. Mia chooses a different dish to be safe. At the end of lunch, she asks for the bill and thanks the server for his help. Good communication makes the experience better for everyone.`,
  summary:'点餐时主动询问过敏原，服务员核实并说明交叉接触风险。',qs:[['What does Mia ask about?',['The price of a salad','Whether soup contains nuts','The opening time'],1],['Why does Mia choose another dish?',['To be safe','She is not hungry','The server is late'],0]]},
 {id:'r4',title:'The Missed Train',subtitle:'错过火车之后',level:'A1',topic:'travel',mins:6,
  body:`Daniel arrives at the station five minutes too late. His train has already left. He feels frustrated, but he walks to the service desk. “Excuse me,” he says, “I've missed my train. Is there another one?” The staff member checks the schedule. The next train leaves in forty minutes. Daniel asks whether he needs to buy a new ticket. The staff member explains the conditions of his ticket and tells him what to do. Daniel thanks her, finds the correct platform, and waits. He learns that asking a clear question is often more useful than worrying in silence.`,
  summary:'错过火车后向工作人员询问下一班车、车票规则和站台。',qs:[['How late is Daniel?',['Five minutes','Forty minutes','One hour'],0],['Who helps him?',['A taxi driver','A staff member','A friend'],1]]},
 {id:'r5',title:'A Better Team Meeting',subtitle:'更高效的会议',level:'A1',topic:'work',mins:7,
  body:`A team meets every Monday morning. In the past, their meetings were long and confusing. Now they begin with three questions: What did we accomplish last week? What is our biggest priority? Who will take ownership of each task? Everyone gives a short update. When something is unclear, they ask for an example or clarify the deadline. At the end, the team writes down the next steps. The meeting lasts only twenty minutes, but the work is more organized. A good meeting is not about speaking a lot. It is about making sure people understand what to do.`,
  summary:'通过进展、优先级和负责人三个问题，让会议简短且能真正推进工作。',qs:[['What is one question the team asks?',['Who will take ownership?','Who wants pizza?','Where is the train?'],0],['What is most important in a meeting?',['Speaking the longest','Clear next steps','Using difficult words'],1]]},
 {id:'r6',title:'Learning Through Mistakes',subtitle:'错误就是反馈',level:'A1',topic:'growth',mins:7,
  body:`When Leo began learning English, he wanted to say every sentence perfectly. Because of this, he rarely spoke. One day, his teacher asked him to describe his weekend without preparing any notes. Leo made mistakes, stopped, and started again. His teacher did not interrupt every sentence. Instead, she wrote down three useful corrections and discussed them after he finished. Leo realized that communication and accuracy can improve together. Now he speaks a little every day, reviews his mistakes, and tries the same ideas again in new conversations. His confidence is growing because he is willing to practice.`,
  summary:'先完成表达，再集中纠正关键错误，把语言输出变成常态。',qs:[['Why did Leo rarely speak at first?',['He wanted to be perfect','He had no teacher','He disliked weekends'],0],['How did his teacher give feedback?',['Interrupted every sentence','Discussed three corrections afterward','Gave no feedback'],1]]},
 {id:'r7',title:'Finding the Right Hotel',subtitle:'旅行中的真实选择',level:'A2',topic:'travel',mins:8,
  body:`Sophie is planning a three-day trip. She has found two hotels. The first is in the city center, close to museums and restaurants, but it is quite expensive. The second is cheaper and quieter, although it takes twenty minutes to reach the center by train. Sophie checks the cancellation policies and reads recent guest reviews. She also contacts the second hotel to ask whether early check-in might be possible. After comparing the options, she chooses the quieter hotel. It fits her budget and gives her more time to rest. She learns that the best choice is not always the most expensive or most popular one. It is the one that meets her needs.`,
  summary:'根据预算、交通、取消规则和休息需求比较酒店，而不是只看价格。',qs:[['Why does Sophie choose the second hotel?',['It is the most famous','It meets her needs','It is next to the museum'],1],['What policy does she check?',['Cancellation','Dress code','Parking fines'],0]]},
 {id:'r8',title:'An Unexpected Guest Request',subtitle:'服务中的沟通能力',level:'A2',topic:'dining',mins:8,
  body:`During a busy dinner service, a guest tells Alex that her main course is too salty. Alex listens carefully instead of becoming defensive. He says, “I'm sorry the dish wasn't what you expected. Let me see what we can do.” He confirms the issue with the kitchen and offers a suitable alternative. The guest appreciates that he takes her concern seriously. Later, Alex explains the situation to the team so that they can improve. Good service is not about promising that nothing will ever go wrong. It is about responding clearly, respectfully, and quickly when something does.`,
  summary:'面对客诉不急于辩解，确认问题、提供替代方案、团队复盘。',qs:[['What does Alex do first?',['Argues with the guest','Listens carefully','Ignores the complaint'],1],['What is good service about?',['Never making mistakes','Responding well to problems','Speaking fast'],1]]},
 {id:'r9',title:'Giving Constructive Feedback',subtitle:'有建设性的反馈',level:'A2',topic:'work',mins:9,
  body:`People often avoid difficult conversations because they worry about hurting someone's feelings. However, clear feedback can be a form of respect. A manager might begin by describing a specific situation: “In yesterday's presentation, a few important figures were missing.” Then the manager explains the impact: “The client could not compare the options.” Finally, they discuss a practical next step: “Could we add a short summary table before the next meeting?” This approach focuses on observable work rather than personal criticism. The other person also has a chance to explain their perspective. Constructive feedback is a conversation, not a judgment.`,
  summary:'用具体情境、影响和下一步建议构成建设性反馈，避免人身评价。',qs:[['What should feedback focus on?',['Personal criticism','Observable work','Rumors'],1],['What is feedback described as?',['A judgment','A conversation','An order'],1]]},
 {id:'r10',title:'Small Talk That Leads Somewhere',subtitle:'从寒暄到真正交流',level:'A2',topic:'conversation',mins:8,
  body:`Small talk can feel awkward when you don't know what to say. One helpful method is to notice something you genuinely share with the other person. Perhaps you are both attending the same event or waiting for the same flight. Start with a simple observation, then ask an open question. If the other person answers briefly, you don't have to force a long conversation. If they seem interested, ask a follow-up question and share a little of your own experience. Listening is as important as asking. The goal is not to impress someone with difficult vocabulary. It is to create a comfortable moment of connection.`,
  summary:'从共同情境切入，使用开放式问题，倾听并自然追问。',qs:[['What is a good way to begin?',['Make an observation','Use difficult words','Ask ten questions'],0],['What is as important as asking?',['Listening','Running','Interrupting'],0]]},
 {id:'r11',title:'Why Consistency Beats Intensity',subtitle:'为什么长期坚持更有效',level:'B1',topic:'growth',mins:10,
  body:`A common mistake in language learning is to study for several hours one day and then do nothing for the rest of the week. Intense sessions can be useful, but consistency helps build the mental pathways needed for quick recall. A practical routine combines retrieval practice, listening, speaking, and periodic review. For example, you might learn eight expressions, use three of them in a conversation, and revisit difficult ones tomorrow. The value of a session depends less on how many pages you finish and more on what you can remember and use later. A sustainable routine also includes rest, variation, and the freedom to adjust when life becomes busy.`,
  summary:'把记忆提取、听说应用与间隔复习结合，比短暂突击更可持续。',qs:[['What helps quick recall?',['Consistency','Only reading silently','Never reviewing'],0],['How should you use new expressions?',['Only copy them','Use some in a conversation','Avoid speaking'],1]]},
 {id:'r12',title:'Handling a Difficult Conversation at Work',subtitle:'处理棘手的职场对话',level:'B1',topic:'work',mins:10,
  body:`A project is running behind schedule, and two colleagues disagree about the reason. Instead of deciding who is to blame, their manager asks each person to describe the facts and the impact on their work. She restates their concerns to confirm her understanding. Then she moves the conversation toward solutions: What can be completed this week? What additional support is needed? Which risks should the client know about? The discussion does not remove every disagreement, but it creates a shared plan and clear responsibilities. Effective communication often means slowing down enough to understand the problem before trying to solve it.`,
  summary:'面对项目延期，先对齐事实和影响，再明确支持、风险、责任人与计划。',qs:[['What does the manager ask for first?',['Blame','Facts and impact','More meetings'],1],['What is the outcome?',['A shared plan','No responsibilities','An argument'],0]]},
 {id:'r13',title:'What Makes a Recommendation Useful?',subtitle:'有价值的推荐',level:'B1',topic:'dining',mins:10,
  body:`A recommendation should help someone make a decision, not simply display the knowledge of the person giving it. In a restaurant, a thoughtful recommendation begins with a few genuine questions. Is the guest looking for something light or rich? Do they have a budget in mind? Are there ingredients they prefer to avoid? Once the server understands the situation, they can suggest two suitable options and explain the difference in plain language. The best explanation is specific, relevant, and short enough to be useful. Even guests who know very little about food or wine can make confident choices when they feel understood.`,
  summary:'推荐不是炫耀知识，而是理解预算与偏好，再做清晰、有针对性的比较。',qs:[['What should come first?',['Asking relevant questions','Listing all the wines','Using technical vocabulary'],0],['How many options does the text suggest?',['Two suitable options','Twenty options','No options'],0]]},
 {id:'r14',title:'Turning Practice Into Real Ability',subtitle:'如何把练习转化为能力',level:'B1',topic:'growth',mins:10,
  body:`Understanding an English phrase is not the same as being able to use it in a live conversation. Recognition is often easier than retrieval. To close the gap, learners need moments when they must produce language without looking at an answer. One approach is to read a short paragraph, close it, and explain the main idea aloud. Another is to rehearse a real situation, such as asking for clarification in a meeting. Feedback helps, but repeated use in different contexts is what makes expressions more flexible. Over time, familiar phrases become easier to access under pressure, and learners can focus more attention on the person they are speaking with.`,
  summary:'理解不等于能说；通过脱离提示的输出、情景迁移和反馈建立真正的语言能力。',qs:[['What is harder than recognition?',['Retrieval','Reading a title','Listening to music'],0],['What makes expressions flexible?',['Repeated use in varied contexts','Only memorizing lists','Never speaking'],0]]}
];

<script>

/* ONE English 0.2 · Quiet Editorial · browser-first study MVP · no client-side API secrets */
(function(){
'use strict';
const STORAGE='one_english_v01';
const LEVELS=['A0','A1','A2','B1','B2'];
const MINUTES={30:{vocab:10,sentence:5,reading:7,speaking:8},60:{vocab:18,sentence:12,reading:15,speaking:15},120:{vocab:35,sentence:20,reading:30,speaking:35}};
const PAGES={today:'LEARNING / TODAY',vocab:'LEARNING / WORDS',reading:'LEARNING / READING',speaking:'LEARNING / SPEAKING',progress:'YOUR JOURNEY / GROWTH',settings:'YOUR SPACE / SETTINGS'};
const escapeHTML=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDay=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const nextDay=(date,n)=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return localDay(d)};
const clean=s=>String(s).toLowerCase().normalize('NFKC').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
const getById=(xs,id)=>xs.find(x=>x.id===id);
const stateDefaults=()=>({profile:null,srs:{},stars:[],learnedSentences:{},readArticles:{},finishedScenarios:[],days:{},extraWords:[],freeMessages:[],version:1});
function loadState(){try{let raw=JSON.parse(localStorage.getItem(STORAGE)||'null');if(raw&&typeof raw==='object')return {...stateDefaults(),...raw};}catch(e){}return stateDefaults()}
let state=loadState();
let view={page:'today',vocabTab:'cards',libraryQuery:'',libraryTopic:'all',libraryLimit:48,cardFlipped:false,sentenceIndex:0,sentenceReveal:false,articleId:null,articleAnswers:{},articleResult:false,summaryOpen:false,wordPopup:null,speakTab:'scenes',sceneId:null,dialog:null,chatFeedback:'',phonemeIndex:0,aiBusy:false,aiInput:'',onboardMinutes:30,onboardLevel:'A0',onboardInterests:['daily','conversation','work'],onboardName:''};
let apiAvailable=false,toastTimer=null,saveTick=0,activityAt=Date.now(),aiAccessCode='';
try{aiAccessCode=sessionStorage.getItem('one_english_ai_code')||''}catch(e){}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
function dstate(day=localDay()){if(!state.days[day])state.days[day]={seconds:0,vocab:false,sentence:false,reading:false,speaking:false,actions:0,sentenceIds:[],readingIds:[],sceneIds:[]};return state.days[day]}
function recordAction(){let d=dstate();d.actions=(d.actions||0)+1;save()}
function completedParts(day=localDay()){let d=state.days[day]||{};return ['vocab','sentence','reading','speaking'].filter(k=>d[k]).length}
function weekStreak(){let streak=0,day=localDay();if(!(state.days[day]?.actions>0))day=nextDay(day,-1);for(let i=0;i<365;i++){if((state.days[day]?.actions||0)>0){streak++;day=nextDay(day,-1)}else break}return streak}
function wordsLearned(){return Object.values(state.srs).filter(x=>(x.reps||0)>0).length}
function masteredWords(){return Object.values(state.srs).filter(x=>(x.interval||0)>=7).length}
function dueCount(){return VOCAB.filter(w=>state.srs[w.id]&&state.srs[w.id].due<=localDay()).length}
function completionRatio(){return Math.round(completedParts()/4*100)}
function chosenTopics(){return state.profile?.interests||['daily','conversation','work']}
function profileLevel(){return state.profile?.level||'A0'}
function minutes(){return state.profile?.minutes||30}
function mins(kind){return MINUTES[minutes()][kind]}
function numberPerDay(){return minutes()===30?8:minutes()===60?14:22}
function sentenceDailyTarget(){return minutes()===30?3:minutes()===60?5:8}
function readingDailyTarget(){return minutes()===30?1:minutes()===60?2:3}
function sceneDailyTarget(){return minutes()===30?1:minutes()===60?2:3}
function levelNumber(l){return LEVELS.indexOf(l)}
function activeMinutes(day=localDay()){return Math.floor((state.days[day]?.seconds||0)/60)}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2700)}
function tts(s,rate=.86){if(!('speechSynthesis' in window)){toast('当前浏览器不支持朗读');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=rate;u.pitch=1;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang==='en-US'&&(/Google|Samantha|Microsoft|Natural/i).test(v.name))||voices.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){toast('朗读暂时不可用')}}
function subtitleHero(title,desc,kicker='YOUR LEARNING SPACE'){return `<div class="page-heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="lede">${desc}</p></div></div>`}
function go(page){if(!PAGES[page])page='today';view.page=page;document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===page));document.getElementById('breadcrumb').textContent=PAGES[page];render();window.scrollTo({top:0,behavior:'instant'})}
function render(){document.getElementById('date-now').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});let name=state.profile?.name||'English';document.getElementById('user-initial').textContent=name.trim().charAt(0).toUpperCase()||'E';let out=document.getElementById('page-content');try{out.innerHTML=({today:renderToday,vocab:renderVocab,reading:renderReading,speaking:renderSpeaking,progress:renderProgress,settings:renderSettings}[view.page]||renderToday)()}catch(e){console.error('Render error',e);out.innerHTML='<div class="notice warning">页面暂时无法显示，请刷新重试。</div>';}}
function nextLearningAction(){let d=dstate();if(!d.vocab)return 'vocab';if(!d.sentence)return 'sentence';if(!d.reading)return 'reading';if(!d.speaking)return 'speaking';return 'progress'}
function renderToday(){
  let d=dstate(),ratio=completionRatio(),n=state.profile?.name?.trim()||'';
  let goal=minutes(),next=nextLearningAction();
  const done=completedParts();
  const dayNum=Math.max(1,Object.keys(state.days).filter(k=>state.days[k].actions).length);
  const today=new Date();
  const dateLabel=today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
  const names={vocab:'词汇记忆',sentence:'实用句子',reading:'阅读理解',speaking:'开口练习',progress:'查看学习记录'};
  const rows=[
    ['vocab','01','Words & recall','词汇记忆','学新词 · 间隔复习'],
    ['sentence','02','Everyday phrases','实用句子','聆听 · 理解 · 表达'],
    ['reading','03','Read & understand','阅读理解',`${readingDailyTarget()} 篇分级短文 · 理解测试`],
    ['speaking','04','Speak with confidence','开口练习',`${sceneDailyTarget()} 个真实场景 · 开口回应`]
  ].map(([k,num,en,cn,desc])=>`<button class="practice-row" data-go-section="${k}" aria-label="${cn}，${d[k]?'已完成':'开始学习'}"><span class="practice-index">${num}</span><span class="practice-copy"><span class="practice-name">${en}</span><span class="practice-details">${cn} <span class="tiny-bullet">/</span> ${desc}</span></span><span class="practice-side"><span class="practice-time">${mins(k)} MIN</span><span class="practice-chevron ${d[k]?'is-done':''}">${d[k]?'✓':'↗'}</span></span></button>`).join('');
  return `<section class="home-intro">
    <div class="home-overline"><span>YOUR DAILY ENGLISH JOURNAL</span><span>DAY ${String(dayNum).padStart(2,'0')}</span></div>
    <div class="home-intro-inner"><div><div class="home-hello">${n?`HELLO, ${escapeHTML(n.toUpperCase())}`:'WELCOME BACK'}</div><h1>A little, <em>every day.</em></h1><p class="home-subtitle">每天学一点，慢慢说得更自然。</p></div><div class="home-date">${dateLabel}</div></div>
  </section>
  <section class="daily-feature" aria-label="今日学习进度">
    <div class="daily-feature-heading"><span>TODAY'S SESSION</span><span>01 / PERSONAL PRACTICE</span></div>
    <div class="feature-grid"><div class="feature-primary"><h2>${ratio===100?'A day well spent.':'Make it a habit.'}</h2><p>${ratio===100?'今天的四个环节已完成。你也可以随时继续练习。':`今天安排了 ${goal} 分钟。无需一口气学完，先开始一项真实的练习。`}</p><button class="button feature-cta" data-go-section="${next}"><span>${ratio===100?'继续探索':'开始'+names[next]}</span><span aria-hidden="true">↗</span></button></div>
    <div class="feature-secondary"><div class="feature-secondary-kicker">TODAY COMPLETED</div><div class="feature-count"><strong>${String(done).padStart(2,'0')}</strong><span>/ 04</span></div><div class="feature-meter" role="progressbar" aria-valuenow="${ratio}" aria-valuemin="0" aria-valuemax="100"><div style="width:${ratio}%"></div></div><div class="feature-meter-caption"><span>${ratio}% COMPLETE</span><span>${goal} MIN PLAN</span></div></div></div>
  </section>
  <div class="stats-strip" aria-label="学习概览"><div class="stat-item"><span>STUDY STREAK</span><strong>${weekStreak()}<small> days</small></strong><span class="stat-note">连续学习</span></div><div class="stat-item"><span>WORDS LEARNED</span><strong>${wordsLearned()}<small> words</small></strong><span class="stat-note">累计掌握 ${masteredWords()} 词</span></div><div class="stat-item"><span>READY TO REVIEW</span><strong>${dueCount()}<small> words</small></strong><span class="stat-note">今天待复习</span></div></div>
  <section class="practice-section"><div class="practice-section-head"><div><div class="eyebrow">THE DAILY ROUTINE</div><h2>Today's practice <span>今日课程</span></h2></div><button class="text-link" data-route="settings">调整计划 <span aria-hidden="true">↗</span></button></div><div class="practice-list">${rows}</div></section>
  <footer class="home-endnote"><span>PROGRESS, NOT PERFECTION.</span><p>一点点积累，就能走得很远。学习记录会保存在当前设备。</p><button class="text-link" data-route="progress">查看成长记录 ↗</button></footer>`
}

function buildDeck(){const today=localDay();let existing=state.deckSession;if(existing?.date===today&&Array.isArray(existing.ids))return existing;let due=VOCAB.filter(w=>state.srs[w.id]?.due<=today);let newWords=VOCAB.filter(w=>!state.srs[w.id]);let topics=chosenTopics(),base=levelNumber(profileLevel());let rank=w=>(Math.max(0,levelNumber(w.level)-base-1)*10)+(topics.includes(w.topic)?0:3)+Math.abs(levelNumber(w.level)-base)*.5;
newWords.sort((a,b)=>rank(a)-rank(b)||VOCAB.indexOf(a)-VOCAB.indexOf(b));let n=numberPerDay();let ids=[...due.slice(0,Math.ceil(n*.6)),...newWords.slice(0,Math.max(n-due.length,Math.ceil(n*.4)))].slice(0,n).map(w=>w.id);if(!ids.length)ids=VOCAB.slice(0,n).map(w=>w.id);state.deckSession={date:today,ids,idx:0};save();return state.deckSession}
function readDeck(){let deck=buildDeck();return {...deck,word:getById(VOCAB,deck.ids[deck.idx])}}
function cardRatingBtn(key,label,next,cls){return `<button class="rate ${cls}" data-rate="${key}">${label}<small>${next}</small></button>`}
function renderFlashcards(){let deck=readDeck();if(deck.idx>=deck.ids.length){return `<div class="card panel" style="text-align:center;padding:44px 24px"><div style="font-size:48px;margin-bottom:15px">✓</div><h2>今天的词卡完成了！</h2><p class="muted" style="margin:11px 0 25px">${deck.ids.length} 张卡片已复习。明天会根据你的记忆情况安排下一轮。</p><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><button class="button" data-vocab-tab="sentences">继续练句子 →</button><button class="button outline" data-vocab-tab="library">浏览全部词库</button></div></div>`}
let w=deck.word;if(!w)return '<div class="empty">暂无卡片</div>';let heard=Boolean(view.cardFlipped),p=Math.round(deck.idx/deck.ids.length*100);
return `<div class="grid-2"><div><div class="card panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px"><span class="muted" style="font-size:12px">今日记忆 · ${deck.idx+1} / ${deck.ids.length}</span><span class="chip">${COURSE.topics[w.topic].label} · ${w.level}</span></div><div class="progress-line"><div style="width:${p}%"></div></div></div><div class="flashcard card" data-action="flip-card" tabindex="0" role="button" aria-label="点击翻转卡片查看中文释义"><div class="eyebrow" style="position:absolute;top:19px;left:22px">RECALL BEFORE REVEAL</div><div class="word">${escapeHTML(w.e)}</div>${w.ipa?`<div class="phonetic">${escapeHTML(w.ipa)}</div>`:''}${heard?`<div class="word-meaning">${escapeHTML(w.c)}</div><div class="example">${escapeHTML(w.ex)}</div>`:'<div class="hidden-text">先在心里回忆中文意思，再点击翻卡</div>'}<div style="position:absolute;bottom:19px;right:22px"><button class="icon-button" data-speak="${escapeHTML(w.e)}" aria-label="朗读单词">♪</button></div></div>${heard?`<div class="rating-row">${cardRatingBtn('again','再来','稍后重复','again')}${cardRatingBtn('hard','困难','1 天后','hard')}${cardRatingBtn('good','记住了','间隔复习','')}${cardRatingBtn('easy','很熟悉','延后复习','easy')}</div>`:`<button class="button full" style="margin-top:12px" data-action="flip-card">查看答案 →</button>`}</div>
<div class="card panel"><div class="eyebrow">HOW IT WORKS</div><h3 style="font-size:21px;margin:10px 0">不是看熟，是想得起来。</h3><p class="muted" style="font-size:13px;margin-bottom:22px">先回忆，再翻卡。根据是否能真正想起单词选择“再来、困难、记住了、很熟悉”，系统会安排下次复习。</p><div class="notice" style="margin-bottom:16px"><strong>今天还需复习：${dueCount()} 词</strong><div style="margin-top:4px">忘记是正常的，提取练习才是加深记忆的关键。</div></div><button class="button outline full" data-vocab-tab="library">打开完整词库</button></div></div>`}
function renderSentence(){let allowed=chosenTopics();let pool=[...SENTENCES.filter(s=>allowed.includes(s.topic)),...SENTENCES.filter(s=>!allowed.includes(s.topic))];let index=Math.min(view.sentenceIndex,pool.length-1),s=pool[index];view.sentenceIndex=index;
return `<div class="grid-2"><div><div class="card sentence-card"><div style="display:flex;align-items:center;justify-content:space-between"><span class="chip">SENTENCE ${index+1} / ${pool.length}</span><button class="icon-button" data-speak="${escapeHTML(s.en)}" aria-label="播放句子">♪</button></div><div class="sentence-en">${escapeHTML(s.en)}</div><button class="small-link" data-action="sentence-reveal">${view.sentenceReveal?'收起中文':'先尝试自己翻译 · 点击查看中文'} →</button>${view.sentenceReveal?`<div class="sentence-zh">${escapeHTML(s.zh)}</div><div class="sentence-sub">${escapeHTML(s.note)}</div>`:'<div class="sentence-sub">看完英文，试试不看字幕把这句话说出来。</div>'}<div class="sentence-controls"><button class="button outline" data-action="sentence-prev" ${index===0?'disabled':''}>← 上一句</button><button class="button secondary" data-action="sentence-listen">跟读练习</button><button class="button" data-action="sentence-learned">${state.learnedSentences[s.id]?'再练一遍':'学会了 ✓'} · 下一句</button></div></div></div><div class="card panel"><div class="eyebrow">SHADOWING PRACTICE</div><h3 style="font-size:21px;margin:12px 0 12px">听一句，说一句。</h3><p class="muted">先听朗读，模仿语调和节奏；录音识别可用时，试试不看字幕复述。识别结果只是文字对比，不是专业发音评分。</p><div class="notice"><b>今日句子目标：${sentenceDailyTarget()} 句</b><p style="margin:6px 0 0">已完成 ${dstate().sentenceIds?.length||0} 句。重复说熟的句子，比一次看十遍更有帮助。</p></div><div class="section-head" style="margin-top:23px"><span class="eyebrow">EXTRA TIP</span></div><p style="font-size:12px;color:#73877a">这里的句子都可以直接用于生活、餐厅、工作或旅行，不是孤立的语法填空。</p></div></div>`}
function renderLibrary(){let q=view.libraryQuery.toLowerCase().trim(),topic=view.libraryTopic;let rows=VOCAB.filter(w=>(topic==='all'||topic==='star'||w.topic===topic)&&(w.e.toLowerCase().includes(q)||w.c.includes(q)||w.ex.toLowerCase().includes(q)));let fav=state.stars;
return `<div class="card panel"><div style="display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap"><div><h3 style="font-size:20px">我的实用词库</h3><p class="panel-note">${VOCAB.length} 个真实词汇与高频短语；点星号收藏，朗读按钮可听发音。</p></div><span class="chip">已收藏 ${fav.length} 项</span></div><input class="search" data-input="library-query" value="${escapeHTML(view.libraryQuery)}" placeholder="搜索单词、中文意思或例句…" aria-label="词库搜索"><div class="filter-row"><button class="filter-btn ${topic==='all'?'active':''}" data-topic="all">全部</button><button class="filter-btn ${topic==='star'?'active':''}" data-topic="star">★ 收藏</button>${Object.entries(COURSE.topics).map(([k,t])=>`<button class="filter-btn ${topic===k?'active':''}" data-topic="${k}">${t.label}</button>`).join('')}</div><div class="word-list">${rows.filter(w=>topic!=='star'||fav.includes(w.id)).slice(0,view.libraryLimit).map(w=>`<div class="word-list-item"><button class="icon-button" data-speak="${escapeHTML(w.e)}" aria-label="朗读">♪</button><div class="word-main"><b>${escapeHTML(w.e)}</b><small>${escapeHTML(w.c)}</small><div class="word-note">${escapeHTML(w.ex)}</div></div><button class="icon-button heart ${fav.includes(w.id)?'active':''}" data-star="${w.id}" aria-label="${fav.includes(w.id)?'取消收藏':'收藏'}">${fav.includes(w.id)?'★':'☆'}</button></div>`).join('')||'<div class="empty">没有匹配的词条，换个关键词试试。</div>'}</div>${rows.length>view.libraryLimit?`<button class="button outline full" style="margin-top:15px" data-action="library-more">显示更多 · 还有 ${rows.length-view.libraryLimit} 项</button>`:''}</div>`}
function renderVocab(){let tabs=[['cards','单词记忆'],['sentences','实用句子'],['library','我的词库']];return `${subtitleHero('词汇，要真正用得出来。','从主动回忆到实用句子，不背无意义的词表。','VOCABULARY & EXPRESSIONS')}<div class="tabs" style="margin-bottom:20px">${tabs.map(([k,label])=>`<button class="tab ${view.vocabTab===k?'active':''}" data-vocab-tab="${k}">${label}</button>`).join('')}</div>${({cards:renderFlashcards,sentences:renderSentence,library:renderLibrary}[view.vocabTab]||renderFlashcards)()}`}
function levelChip(level){return `<span class="chip ${level==='B1'||level==='B2'?'peach':'gray'}">${level}</span>`}
function renderArticleList(){let level=levelNumber(profileLevel());let articles=[...ARTICLES].sort((a,b)=>Math.abs(levelNumber(a.level)-level)-Math.abs(levelNumber(b.level)-level));return `<div class="notice" style="margin-bottom:17px">今日阅读：${dstate().readingIds?.length||0} / ${readingDailyTarget()} 篇 · 30 / 60 / 120 分钟对应不同练习量</div><div class="reader-list">${articles.map((a,i)=>`<button class="reader-item" data-article="${a.id}"><div style="display:flex;justify-content:space-between;align-items:center">${levelChip(a.level)}<span class="muted" style="font-size:11px">${a.mins} MIN READ</span></div><div class="item-en">${escapeHTML(a.title)}</div><div class="item-zh">${escapeHTML(a.subtitle)}</div><div class="item-foot"><span class="muted">${COURSE.topics[a.topic].label}</span><span style="font-size:12px;font-weight:750;color:#42725a">${state.readArticles[a.id]?'✓ 已完成':'开始阅读 →'}</span></div></button>`).join('')}</div>`}
function articleWords(body){return body.split(/(\s+)/).map(t=>{if(!t.trim())return t.replace(/\n/g,'<br>');let match=t.match(/[A-Za-z]+(?:[’'-][A-Za-z]+)*/);if(!match)return escapeHTML(t);let at=t.indexOf(match[0]);return escapeHTML(t.slice(0,at))+`<span class="token" data-lookup="${escapeHTML(match[0])}">${escapeHTML(match[0])}</span>`+escapeHTML(t.slice(at+match[0].length))}).join('')}
function lookupWord(word){let q=clean(word).replace(/s$/,'');let w=VOCAB.find(x=>clean(x.e)===clean(word))||VOCAB.find(x=>clean(x.e)===q)||VOCAB.find(x=>clean(x.e).startsWith(q+' '));view.wordPopup={word,w};render()}
function renderArticle(){let a=getById(ARTICLES,view.articleId);if(!a){view.articleId=null;return renderArticleList()};let prior=state.readArticles[a.id],pop=view.wordPopup;return `<div style="margin-bottom:19px"><button class="small-link" data-action="back-articles">← 返回阅读列表</button></div><div class="card panel"><div class="article-hero"><div><div class="eyebrow">READING / ${escapeHTML(a.level)} / ${a.mins} MIN</div><div class="article-title">${escapeHTML(a.title)}</div><div class="muted">${escapeHTML(a.subtitle)}</div></div><button class="button secondary tiny" data-speak="${escapeHTML(a.body)}">♪ 朗读全文</button></div><div class="reader-help" style="margin-top:16px">点击文章中的英语单词查看词库解释，或者收藏想记住的词。</div><div class="article-body">${articleWords(a.body)}</div>${pop?`<div class="word-pop"><strong>${escapeHTML(pop.word)}</strong><p>${pop.w?escapeHTML(pop.w.c)+'<br>'+escapeHTML(pop.w.ex):'当前词库中还没有这个单词的独立解释。你仍可以先收藏，之后再补充释义。'}</p><div style="display:flex;gap:9px"><button class="button tiny" data-action="popup-star">★ 收藏复习</button><button class="button outline tiny" data-action="popup-close">关闭</button><button class="icon-button" data-speak="${escapeHTML(pop.word)}">♪</button></div></div>`:''}<button class="small-link" data-action="toggle-summary">${view.summaryOpen?'收起中文导读':'查看中文概要'} ↓</button>${view.summaryOpen?`<div class="notice">${escapeHTML(a.summary)}</div>`:''}
<div class="comprehension"><div class="eyebrow">CHECK YOUR UNDERSTANDING</div><h2 style="margin-top:10px;font-size:22px">读懂了吗？试着回答。</h2>${a.qs.map(([q,options,correct],i)=>`<div class="question"><div class="question-title">${i+1}. ${escapeHTML(q)}</div>${options.map((opt,j)=>{let checked=view.articleAnswers[i]===j;let done=view.articleResult;let cls=done?(j===correct?' correct':checked?' wrong':''):checked?' selected':'';return `<button class="quiz-choice${cls}" data-answer="${i}:${j}" ${done?'disabled':''}>${String.fromCharCode(65+j)}. ${escapeHTML(opt)}</button>`}).join('')}</div>`).join('')}${view.articleResult?`<div class="notice">${escapeHTML(view.articleFeedback||'文章练习已完成。')}${prior?' · 已记录':''}</div><div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button class="button" data-action="back-articles">继续阅读 →</button><button class="button outline" data-action="retry-reading">再练一次</button></div>`:`<button class="button" data-action="submit-reading">提交答案，查看解析 →</button>`}</div></div>`}
function renderReading(){return `${subtitleHero('每天读一点，读到能表达。','难度从零基础到 B1。阅读、朗读、逐词查看、理解测试，都在同一个地方。','READ • LISTEN • UNDERSTAND')}${view.articleId?renderArticle():renderArticleList()}`}
function scenarioList(){let base=levelNumber(profileLevel());let sorted=[...SCENARIOS].sort((a,b)=>Math.abs(levelNumber(a.level)-base)-Math.abs(levelNumber(b.level)-base));return `<div class="notice" style="margin-bottom:17px">今日场景：${dstate().sceneIds?.length||0} / ${sceneDailyTarget()} 组 · 用自己的语言回答，至少完成两轮才会计数。</div><div class="scenario-list">${sorted.map(sc=>`<button class="scenario-item" data-scene="${sc.id}"><div class="eyebrow">SCENARIO PRACTICE</div><div class="item-en">${escapeHTML(sc.title)}</div><div class="item-zh">${escapeHTML(sc.sub)} · ${sc.turns.length} 轮对话</div><div class="item-foot">${levelChip(sc.level)}<span style="font-size:12px;font-weight:750;color:#417a5d">${state.finishedScenarios.includes(sc.id)?'✓ 完成':'开始对话 →'}</span></div></button>`).join('')}</div>`}

scene-skip">跳过</button></div>`}</div><p class="muted" style="font-size:11px;margin:12px 3px">当前是离线情景教练：根据关键词给练习反馈，不等于已连接生成式 AI。</p></div>`}
