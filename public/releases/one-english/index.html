function phonicPanel(){let p=PHONICS[view.phonemeIndex];return `<div class="grid-2"><div class="card panel"><div class="eyebrow">IPA SOUNDS · 12 STARTER CARDS</div><h3 style="margin:9px 0 17px;font-size:20px">常见英语发音练习</h3><div class="phonic-grid">${PHONICS.map((x,i)=>`<button class="phonic-card ${view.phonemeIndex===i?'active':''}" data-phonic="${i}"><div class="phonic-symbol">/${escapeHTML(x.ipa)}/</div><div>${escapeHTML(x.word)}</div><div class="muted">${escapeHTML(x.letters)}</div></button>`).join('')}</div></div><div class="card phonic-detail"><div class="eyebrow">SOUND ${view.phonemeIndex+1} / ${PHONICS.length}</div><h2>/${escapeHTML(p.ipa)}/</h2><p style="font-size:22px;font-weight:700">${escapeHTML(p.word)}</p><p class="muted">${escapeHTML(p.tip)}</p><div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:19px"><button class="button" data-speak="${escapeHTML(p.word)}">♪ 听示范</button><button class="button outline" data-action="phonic-mic">跟读练习识别</button></div><div class="notice" style="margin-top:22px">语音识别只用来检测是否识别出目标单词，不能当作标准音标评分。</div></div></div>`}
function renderSpeaking(){let tabs=[['scenes','情景对话'],['phonics','发音训练'],['ai','AI 自由对话']];return `${subtitleHero('开口，才是学习的终点。','先从真实情景和发音练习开始，再走向自由对话。','SPEAKING & CONVERSATION')}<div class="tabs" style="margin-bottom:19px">${tabs.map(([id,t])=>`<button class="tab ${view.speakTab===id?'active':''}" data-speak-tab="${id}">${t}</button>`).join('')}</div>${view.speakTab==='scenes'?(view.sceneId?sceneDialog():scenarioList()):view.speakTab==='phonics'?phonicPanel():aiPanel()}`}
function pastWeek(){return Array.from({length:7},(_,i)=>{let date=nextDay(localDay(),i-6);return {date,label:new Date(date+'T12:00:00').toLocaleDateString('zh-CN',{weekday:'short'}),parts:completedParts(date),mins:activeMinutes(date)}})}
function renderProgress(){let week=pastWeek();let totalActions=Object.values(state.days).reduce((sum,x)=>sum+(x.actions||0),0);let read=Object.keys(state.readArticles).length;let sc=state.finishedScenarios.length;
return `${subtitleHero('每天的那一点，正在变成能力。','关注你能回忆、读懂和说出来什么，而不只是连续打卡。','PROGRESS & GROWTH')}<div class="stats-grid"><div class="stat-card"><div class="stat-label">连续学习</div><div class="stat-value">${weekStreak()}<small>天</small></div></div><div class="stat-card"><div class="stat-label">接触过的单词</div><div class="stat-value">${wordsLearned()}<small>词</small></div></div><div class="stat-card"><div class="stat-label">已完成阅读</div><div class="stat-value">${read}<small>篇</small></div></div><div class="stat-card"><div class="stat-label">完成情景练习</div><div class="stat-value">${sc}<small>个</small></div></div></div>
<div class="grid-2" style="margin-top:20px"><div class="card panel"><div class="eyebrow">THIS WEEK</div><h3 style="font-size:21px;margin:8px 0">最近 7 天 · 学习环节</h3><p class="muted" style="font-size:12px;margin:5px 0 0">每天最多 4 个环节，显示真实完成情况。</p><div class="chart-bars">${week.map(x=>`<div class="bar-item"><div class="bar-bg"><div class="bar-fill" style="height:${x.parts*25}%"></div></div><span class="bar-label">${escapeHTML(x.label)}</span></div>`).join('')}</div><p class="muted" style="font-size:11px;margin:15px 0 0">学习动作 ${totalActions} 次 · 今天有效练习约 ${activeMinutes()} 分钟（前台活动计时）</p></div><div class="card panel"><div class="eyebrow">YOUR MILESTONES</div><h3 style="font-size:21px;margin:8px 0 20px">小小的里程碑</h3>${[['01','第一次练习',totalActions>=1],['02','学习满 3 天',Object.values(state.days).filter(x=>x.actions>0).length>=3],['03','复习 20 张词卡',wordsLearned()>=20],['04','完成 3 个场景',sc>=3],['05','读懂 5 篇文章',read>=5]].map(([icon,name,done])=>`<div class="achievement" style="opacity:${done?1:.45};margin-bottom:10px"><div class="badge-icon">${icon}</div><div><strong>${name}</strong><small>${done?'已解锁':'尚未解锁'}</small></div><span style="margin-left:auto;color:#659e72">${done?'✓':'○'}</span></div>`).join('')}</div></div>
<div class="section-head"><h2>你的学习记录</h2></div><div class="card panel"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><h3>Learning history</h3><p class="panel-note">记录保存在当前浏览器，不会自动在手机与电脑之间同步。</p></div><button class="button outline tiny" data-action="export-data">↓ 导出学习记录</button></div><div class="word-list">${Object.entries(state.days).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14).map(([date,d])=>`<div class="word-list-item"><div class="word-main"><b>${escapeHTML(date)}</b><small>${['vocab','sentence','reading','speaking'].filter(x=>d[x]).map(x=>({vocab:'词汇',sentence:'句子',reading:'阅读',speaking:'开口'}[x])).join(' · ')||'开始学习'}</small></div><span class="chip">${['vocab','sentence','reading','speaking'].filter(x=>d[x]).length}/4</span></div>`).join('')||'<div class="empty">今天开始学，你的记录就会出现在这里。</div>'}</div></div>`}
function renderSettings(){let p=state.profile||{},interests=p.interests||[];return `${subtitleHero('把学习变成自己的节奏。','先设定合适的计划，再通过真正的输出和复习稳步提升。','SETTINGS & PERSONALIZATION')}<div class="grid-2"><div class="card panel"><div class="setting-row"><div><strong>如何称呼你</strong><p>仅用于 App 内显示</p></div><input class="field" maxlength="24" id="setting-name" value="${escapeHTML(p.name||'')}" aria-label="称呼"></div><div class="setting-row"><div><strong>每日学习时间</strong><p>30 / 60 / 120 分钟，随时可改</p></div><select id="setting-minutes" class="field"><option value="30" ${minutes()===30?'selected':''}>30 分钟</option><option value="60" ${minutes()===60?'selected':''}>60 分钟</option><option value="120" ${minutes()===120?'selected':''}>120 分钟</option></select></div><div class="setting-row"><div><strong>当前起点</strong><p>不需要考试，先选最合适的等级</p></div><select class="field" id="setting-level">${LEVELS.map(l=>`<option value="${l}" ${profileLevel()===l?'selected':''}>${l} · ${COURSE.levels[l]}</option>`).join('')}</select></div><div style="padding:22px 0;border-bottom:1px solid var(--line)"><strong>学习场景偏好</strong><p class="muted" style="font-size:11px;margin:6px 0 13px">会影响每日词卡推荐，不限制你学习其他内容。</p><div class="onboard-topics" style="margin:0">${Object.entries(COURSE.topics).map(([k,t])=>`<button class="onboard-topic ${interests.includes(k)?'active':''}" data-setting-interest="${k}">${t.label} ${interests.includes(k)?'✓':''}</button>`).join('')}</div></div><div class="settings-actions"><button class="button" data-action="save-settings">保存设置 ✓</button><button class="button outline" data-action="export-data">导出数据</button></div></div>
<div><div class="card panel"><div class="eyebrow">ABOUT THE MVP</div><h3 style="font-size:20px;margin:10px 0 13px">One place. One habit.</h3><p class="muted" style="font-size:12px;line-height:1.85">当前是英语 V0.1。词汇、句子、文章、情景教练与成长记录都能离线练习。需要账户同步、真正 AI 对话、云端数据库和更多语言时，再接入安全服务端。</p><div class="notice warning">重要：浏览器数据被清理、更换设备或使用无痕模式时，当前学习记录可能丢失。建议定期导出备份。</div><div style="margin-top:19px"><label class="field-label" for="import-data">恢复之前导出的进度 JSON</label><input id="import-data" type="file" accept="application/json,.json" class="field" style="font-size:11px"></div><button class="small-link" style="color:#ba7359;margin-top:19px" data-action="reset-data">清空本机学习记录</button></div></div></div>`}
function revealCard(){if(view.cardFlipped)return;view.cardFlipped=true;render()}
function reviewWord(rate){if(!view.cardFlipped){toast('先回忆并翻开答案，再选择记忆情况');return}let d=buildDeck(),w=getById(VOCAB,d.ids[d.idx]);if(!w)return;let prev=state.srs[w.id]||{reps:0,interval:0,due:localDay(),misses:0};let interval,reps=prev.reps||0;if(rate==='again'){interval=0;reps=0;d.misses=d.misses||{};d.misses[w.id]=(d.misses[w.id]||0)+1;if(d.misses[w.id]<=2)d.ids.push(w.id)}else if(rate==='hard'){interval=Math.max(1,Math.ceil((prev.interval||0)*1.25));reps=Math.max(1,reps)}else if(rate==='easy'){interval=prev.interval?Math.max(7,Math.ceil(prev.interval*2.8)):7;reps+=1}else{interval=prev.interval?Math.max(3,Math.ceil(prev.interval*2.2)):3;reps+=1}let due=nextDay(localDay(),interval||1);state.srs[w.id]={reps,interval,due,last:localDay(),rating:rate};d.idx++;view.cardFlipped=false;recordAction();if(d.idx>=d.ids.length){dstate().vocab=true;toast('今天的词卡复习完成了 ✦')}save();render()}
function sentencePool(){let t=chosenTopics();return [...SENTENCES.filter(s=>t.includes(s.topic)),...SENTENCES.filter(s=>!t.includes(s.topic))]}
function advanceSentence(){let s=sentencePool()[view.sentenceIndex];if(s){state.learnedSentences[s.id]=(state.learnedSentences[s.id]||0)+1;let d=dstate();if(!d.sentenceIds.includes(s.id))d.sentenceIds.push(s.id);if(d.sentenceIds.length>=sentenceDailyTarget()){if(!d.sentence)toast('今天的实用句子训练完成了 ✓');d.sentence=true}recordAction()}view.sentenceIndex=(view.sentenceIndex+1)%SENTENCES.length;view.sentenceReveal=false;save();render()}
function submitReading(){let a=getById(ARTICLES,view.articleId);if(!a)return;if(a.qs.some((q,i)=>!(i in view.articleAnswers))){toast('先完成两道理解题');return}let score=a.qs.reduce((n,q,i)=>n+(view.articleAnswers[i]===q[2]?1:0),0);view.articleResult=true;view.articleFeedback=`答对 ${score}/${a.qs.length} 题。${score===a.qs.length?'非常好！':'可以对照文章再读一次，理解后再试。'}`;state.readArticles[a.id]={score,of:a.qs.length,day:localDay()};let d=dstate();d.readingIds=d.readingIds||[];if(!d.readingIds.includes(a.id))d.readingIds.push(a.id);d.reading=d.readingIds.length>=readingDailyTarget();recordAction();render();toast(d.reading?'今日阅读任务完成 ✦':'这篇阅读已记录，继续完成今天的计划')}
function finishSceneIfEligible(dlg,sc){if(dlg.turn<sc.turns.length)return;dlg.done=true;let answered=dlg.messages.filter(x=>x.by==='user').length;if(answered>=2){if(!state.finishedScenarios.includes(sc.id))state.finishedScenarios.push(sc.id);let d=dstate();d.sceneIds=d.sceneIds||[];if(!d.sceneIds.includes(sc.id))d.sceneIds.push(sc.id);d.speaking=d.sceneIds.length>=sceneDailyTarget();recordAction();toast(d.speaking?'今日口语任务完成 ✦':'一个场景完成！继续练习')}else toast('已浏览完整场景。下次至少回答两轮才计入学习记录。');save()}
function answerScene(value,skip=false){let sc=getById(SCENARIOS,view.sceneId),dlg=view.dialog;if(!sc||!dlg||dlg.done)return;let cur=sc.turns[dlg.turn];let ans=String(value||'').trim();if(!ans&&!skip){toast('先输入你的英语回答');return}if(!skip)dlg.messages.push({by:'user',text:ans});let matched=!skip&&cur[3].some(k=>clean(ans).includes(clean(k)));view.chatFeedback=skip?`参考表达：${cur[2]}`:matched?`表达方向不错！也可以试试：${cur[2]}`:`谢谢尝试！更贴合本轮任务的表达是：${cur[2]}`;dlg.turn++;
if(dlg.turn>=sc.turns.length){finishSceneIfEligible(dlg,sc)}else{dlg.messages.push({by:'bot',text:sc.turns[dlg.turn][0]});if(!skip)recordAction()}render();setTimeout(()=>{let el=document.getElementById('chat-window');if(el)el.scrollTop=el.scrollHeight;document.getElementById('scene-input')?.focus()},60)}
function startRecognition(type,target){let Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec){toast('此浏览器没有可用的语音识别，请用键盘练习，或使用支持的 Chrome 浏览器。');return}try{let rec=new Rec();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;rec.onresult=e=>{let transcript=e.results[0][0].transcript;if(type==='scene'){let input=document.getElementById('scene-input');if(input){input.value=transcript;input.focus();toast('识别完成，确认后点击发送')}}else if(type==='ai'){let input=document.getElementById('ai-input');if(input){input.value=transcript;input.focus();view.aiInput=transcript;toast('识别完成，确认后点击发送')}}else{let targetWords=new Set(clean(target).split(' ').filter(Boolean)),spokenWords=new Set(clean(transcript).split(' ').filter(Boolean));let matches=[...targetWords].filter(x=>spokenWords.has(x)).length;let rate=targetWords.size?Math.round(matches/targetWords.size*100):0;toast(`识别为“${transcript}” · 文字词汇匹配约 ${rate}%（非发音评分）`)}};rec.onerror=e=>toast(e.error==='not-allowed'?'麦克风权限未开放，请用文字输入':'语音识别暂时不可用，请用文字输入');rec.start();toast('🎤 请开始说英语…')}catch(e){toast('当前环境无法启动语音识别，请用文字输入')}}
async function detectBackend(){if(!/^https?:$/.test(location.protocol))return;try{let ctrl=new AbortController();let id=setTimeout(()=>ctrl.abort(),1800);let r=await fetch('/api/health',{signal:ctrl.signal});clearTimeout(id);if(!r.ok)return;let obj=await r.json();apiAvailable=obj.ai===true;if(view.page==='speaking'&&view.speakTab==='ai')render()}catch(e){}}
async function sendAI(){if(!apiAvailable){toast('还未连接真实 AI 服务');return}if(view.aiBusy)return;let input=document.getElementById('ai-input');let value=(input?.value||view.aiInput||'').trim();if(!value)return;state.freeMessages.push({role:'user',content:value});state.freeMessages=state.freeMessages.slice(-22);view.aiInput='';view.aiBusy=true;save();render();let el=document.getElementById('chat-window');if(el)el.scrollTop=el.scrollHeight;try{let payload=JSON.stringify({messages:state.freeMessages.slice(-20),level:profileLevel(),scenario:'everyday English conversation'});let request=()=>fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',...(aiAccessCode?{'X-AI-Access-Code':aiAccessCode}:{})},body:payload,signal:AbortSignal.timeout(25000)});let r=await request();if(r.status===401){const entered=prompt('当前 AI 教练需要邀请码。请输入服务提供者分享的 AI 访问码（不会存入永久学习记录）：','');if(!entered)throw Error('未填写邀请码');aiAccessCode=entered.trim();try{sessionStorage.setItem('one_english_ai_code',aiAccessCode)}catch(e){}r=await request()}let data=await r.json().catch(()=>({}));if(!r.ok||!data.reply)throw Error(data.error||'暂时连接不上教练');state.freeMessages.push({role:'assistant',content:String(data.reply).slice(0,4000)});recordAction()}catch(e){toast('AI 对话请求失败：'+String(e.message).slice(0,65))}finally{view.aiBusy=false;save();render();let el=document.getElementById('chat-window');if(el)el.scrollTop=el.scrollHeight}}
function exportData(){let payload={app:'ONE English',exportedAt:new Date().toISOString(),data:state};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);let link=document.createElement('a');link.href=url;link.download=`ONE_English_progress_${localDay()}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('已开始导出学习进度 JSON')}
async function importData(file){if(!file)return;try{let txt=await file.text();if(txt.length>5000000)throw Error('文件过大');let parsed=JSON.parse(txt),raw=parsed.data||parsed;if(!raw||typeof raw!=='object'||!raw.profile||!raw.days||!raw.srs)throw Error('文件不是有效的学习记录');if(!confirm('导入将替换本机目前的学习记录。确定恢复吗？'))return;state={...stateDefaults(),...raw};save();go('today');toast('学习记录已恢复')}catch(e){toast('导入失败：'+e.message)}}
function showOnboarding(){let topics=Object.entries(COURSE.topics);document.getElementById('onboarding-root').innerHTML=`<div class="onboard-backdrop" role="dialog" aria-modal="true" aria-label="学习设置"><div class="onboard-card"><div class="onboard-mark">o·</div><div class="eyebrow">WELCOME TO ONE ENGLISH</div><h2>从今天开始，<br>把英语真正说出来。</h2><p>只需要 30 秒，设置你自己的第一份学习计划。</p><label class="field-label" for="onboard-name">怎么称呼你？（可选）</label><input id="onboard-name" class="field" style="margin-bottom:22px" maxlength="24" placeholder="例如 Alex" value="${escapeHTML(view.onboardName)}"><label class="field-label">每天计划学多久？</label><div class="choice-grid">${[30,60,120].map(n=>`<button class="choice ${view.onboardMinutes===n?'active':''}" data-onboard-minutes="${n}">${n} 分钟<small>${n===30?'轻量坚持':n===60?'系统训练':'深度沉浸'}</small></button>`).join('')}</div><label class="field-label">现在的英语水平</label><div class="choice-grid" style="grid-template-columns:repeat(5,1fr)">${LEVELS.map(l=>`<button class="choice ${view.onboardLevel===l?'active':''}" data-onboard-level="${l}">${l}<small>${COURSE.levels[l]}</small></button>`).join('')}</div><label class="field-label">你想在哪些场景用英语？（可多选）</label><div class="onboard-topics">${topics.map(([id,t])=>`<button class="onboard-topic ${view.onboardInterests.includes(id)?'active':''}" data-onboard-interest="${id}">${t.label} ${view.onboardInterests.includes(id)?'✓':''}</button>`).join('')}</div><button class="button full" data-action="finish-onboarding">开始我的第一天 →</button><p style="color:#9aa69e;font-size:10px;margin:13px 0 0;text-align:center">无需注册 · 数据暂存在本机浏览器 · 设置随时可修改</p></div></div>`}
function saveSettings(){let name=document.getElementById('setting-name')?.value.trim()||'',time=+document.getElementById('setting-minutes')?.value||30,level=document.getElementById('setting-level')?.value||'A0';if(![30,60,120].includes(time))time=30;if(!LEVELS.includes(level))level='A0';let orig=state.profile||{};state.profile={name:name.slice(0,24),minutes:time,level,interests:orig.interests?.length?orig.interests:['daily']};delete state.deckSession;let d=dstate();d.sentence=(d.sentenceIds?.length||0)>=sentenceDailyTarget();d.reading=(d.readingIds?.length||0)>=readingDailyTarget();d.speaking=(d.sceneIds?.length||0)>=sceneDailyTarget();save();toast('设置已保存 ✓');render()}
function markActivityNow(){activityAt=Date.now()}
function delegatedClick(event){markActivityNow();let b=event.target.closest('button,[data-route],[data-action],[data-go-section],[data-lookup],[data-rate],[data-topic],[data-vocab-tab],[data-answer],[data-scene],[data-article],[data-phonic],[data-star],[data-onboard-minutes],[data-onboard-level],[data-onboard-interest],[data-setting-interest]');if(!b)return;
const get=k=>b.dataset[k];
if(get('route')){go(get('route'));return}
if(get('goSection')){let sec=get('goSection');if(sec==='sentence'){view.vocabTab='sentences';go('vocab')}else if(sec==='vocab'){view.vocabTab='cards';go('vocab')}else if(sec==='speaking'){view.speakTab='scenes';view.sceneId=null;go('speaking')}else go(sec);return}
if(get('speak')){event.stopPropagation();tts(get('speak'));return}
if(get('onboardMinutes')){view.onboardMinutes=+get('onboardMinutes');showOnboarding();return}
if(get('onboardLevel')){view.onboardLevel=get('onboardLevel');showOnboarding();return}
if(get('onboardInterest')){let t=get('onboardInterest');view.onboardInterests=view.onboardInterests.includes(t)?view.onboardInterests.filter(x=>x!==t):[...view.onboardInterests,t];showOnboarding();return}
if(get('settingInterest')){let t=get('settingInterest');let p=state.profile||{};let name=document.getElementById('setting-name')?.value??p.name;let minutes=document.getElementById('setting-minutes')?.value;let level=document.getElementById('setting-level')?.value;let a=p.interests||[];p.interests=a.includes(t)?a.filter(x=>x!==t):[...a,t];if(!p.interests.length)p.interests=['daily'];state.profile=p;save();render();document.getElementById('setting-name').value=name;document.getElementById('setting-minutes').value=minutes;document.getElementById('setting-level').value=level;return}
if(get('vocabTab')){view.vocabTab=get('vocabTab');view.libraryLimit=48;render();return}
if(get('topic')){view.libraryTopic=get('topic');view.libraryLimit=48;render();return}
if(get('star')){let id=get('star');if(state.stars.includes(id))state.stars=state.stars.filter(x=>x!==id);else state.stars.push(id);save();render();return}
if(get('rate')){reviewWord(get('rate'));return}
if(get('article')){view.articleId=get('article');view.articleAnswers={};view.articleResult=false;view.summaryOpen=false;view.wordPopup=null;render();window.scrollTo({top:0,behavior:'smooth'});return}
if(get('answer')){if(view.articleResult)return;let [i,j]=get('answer').split(':').map(Number);view.articleAnswers[i]=j;render();return}
if(get('lookup')){lookupWord(get('lookup'));setTimeout(()=>document.querySelector('.word-pop')?.scrollIntoView({block:'center',behavior:'smooth'}),30);return}
if(get('scene')){startScene(get('scene'));return}
if(get('speakTab')){view.speakTab=get('speakTab');render();return}
if(get('phonic')){view.phonemeIndex=+get('phonic');render();return}
let action=get('action');if(!action)return;
switch(action){
 case 'finish-onboarding': state.profile={name:(view.onboardName||'').trim().slice(0,24),minutes:view.onboardMinutes,level:view.onboardLevel,interests:view.onboardInterests.length?view.onboardInterests:['daily']};document.getElementById('onboarding-root').innerHTML='';dstate();save();go('today');toast('欢迎来到 ONE English！');break;
 case 'flip-card':revealCard();break;
 case 'sentence-reveal':view.sentenceReveal=!view.sentenceReveal;render();break;
 case 'sentence-prev':view.sentenceIndex=Math.max(0,view.sentenceIndex-1);view.sentenceReveal=false;render();break;
 case 'sentence-listen':startRecognition('sentence',sentencePool()[view.sentenceIndex].en);break;
 case 'sentence-learned':advanceSentence();break;
 case 'library-more':view.libraryLimit+=48;render();break;
 case 'back-articles':view.articleId=null;view.wordPopup=null;render();window.scrollTo({top:0,behavior:'smooth'});break;
 case 'toggle-summary':view.summaryOpen=!view.summaryOpen;render();break;
 case 'popup-star':if(view.wordPopup){let w=view.wordPopup.w;if(w){if(!state.stars.includes(w.id))state.stars.push(w.id)}else{let t=view.wordPopup.word;if(!state.extraWords.includes(t))state.extraWords.push(t)}save();toast('已加入收藏复习');render()}break;
 case 'popup-close':view.wordPopup=null;render();break;
 case 'submit-reading':submitReading();break;
 case 'retry-reading':view.articleAnswers={};view.articleResult=false;render();break;
 case 'back-scenes':view.sceneId=null;view.dialog=null;view.chatFeedback='';render();break;
 case 'scene-hint':{let sc=getById(SCENARIOS,view.sceneId);view.chatFeedback='参考表达：'+sc.turns[view.dialog.turn][2];render();break}
 case 'send-scene':answerScene(document.getElementById('scene-input')?.value||'');break;
 case 'scene-skip':answerScene('',true);break;
 case 'replay-scene':startScene(view.sceneId);break;
 case 'voice-chat':startRecognition('scene');break;
 case 'phonic-mic':startRecognition('phonic',PHONICS[view.phonemeIndex].word);break;
 case 'voice-ai':startRecognition('ai');break;
 case 'send-ai':sendAI();break;
 case 'save-settings':saveSettings();break;
 case 'export-data':exportData();break;
 case 'reset-data':if(confirm('确定清空当前浏览器中的所有 ONE English 学习记录吗？这个操作不能撤销。')){localStorage.removeItem(STORAGE);state=stateDefaults();view.page='today';view.articleId=null;view.sceneId=null;view.cardFlipped=false;render();showOnboarding();toast('本机学习记录已清空')}break;
}}
function delegatedKeydown(event){markActivityNow();if(event.key==='Enter'&&event.target.id==='scene-input'){event.preventDefault();answerScene(event.target.value)}else if(event.key==='Enter'&&event.target.id==='ai-input'){event.preventDefault();sendAI()}else if((event.key==='Enter'||event.key===' ')&&event.target.matches('.flashcard')){event.preventDefault();revealCard()}else if(event.key==='Enter'&&event.target.matches('.brand')){go('today')}}
function startClock(){let last=Date.now();setInterval(()=>{let now=Date.now(),delta=now-last;last=now;if(!document.hidden&&state.profile&&now-activityAt<90000&&delta>0&&delta<3000){let day=dstate();day.seconds=(day.seconds||0)+Math.min(2,delta/1000);saveTick++;if(saveTick%10===0)save()}},1000)}
function attach(){document.addEventListener('click',delegatedClick);document.addEventListener('keydown',delegatedKeydown);document.addEventListener('touchstart',markActivityNow,{passive:true});document.addEventListener('input',e=>{if(e.target.id==='onboard-name')view.onboardName=e.target.value;if(e.target.id==='ai-input')view.aiInput=e.target.value;if(e.target.dataset.input==='library-query'){view.libraryQuery=e.target.value;view.libraryLimit=48;let start=e.target.selectionStart;render();let f=document.querySelector('[data-input="library-query"]');if(f){f.focus();f.setSelectionRange(start,start)}}});document.addEventListener('change',e=>{if(e.target.id==='import-data')importData(e.target.files[0])});window.addEventListener('beforeunload',save);startClock()}
attach();render();if(!state.profile)showOnboarding();else dstate();detectBackend();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!location.pathname.toLowerCase().includes('standalone'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();


</script>
