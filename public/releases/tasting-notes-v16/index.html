/* Page head and form */
.record-head{padding:27px 0 19px;border-bottom:1px solid var(--line);margin-bottom:15px}.record-head h2{font:normal 32px/1.05 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;color:var(--green);margin:0 0 7px}.record-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:#909b8c;flex-wrap:wrap}.save-status:before{content:'•';color:#709565;margin-right:5px}.type-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px 14px;background:#fff;width:100%;text-align:left;margin:13px 0}.type-row strong{font-weight:650}.type-row small{font-size:12px;color:#718467;margin-left:auto}.type-row .arrow{font-size:15px;color:#899783}.type-picks{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 15px;background:#fff;padding:4px 0 3px}.photo-tile{border:1px dashed #aebca6;border-radius:13px;background:#f6f8f3;padding:16px;display:flex;gap:12px;align-items:center;margin-top:14px;color:#476141}.photo-tile .photo-symbol{border-radius:10px;background:#e9f0e4;width:44px;height:44px;display:grid;place-items:center;font-size:24px;flex-shrink:0}.photo-title{font-size:13px;font-weight:700}.photo-tile small{display:block;color:#9aa996;font-size:11px;margin-top:2px}.photo-tile button{margin-left:auto;border:1px solid #8fa587;border-radius:8px;background:white;color:#405938;padding:9px 12px;white-space:nowrap;font-size:12px}.photo-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:10px}.photo-thumb{aspect-ratio:1;position:relative;border-radius:8px;overflow:hidden;background:#e9eee5}.photo-thumb img{width:100%;height:100%;object-fit:cover}.photo-thumb button{position:absolute;top:3px;right:3px;width:23px;height:23px;border:0;border-radius:50%;background:#ffffffed;font-size:16px;line-height:1;color:#55624b}
.detail-box{background:#fff;border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:0 13px}.detail-toggle{width:100%;border:0;background:#fff;display:flex;align-items:center;gap:10px;text-align:left;justify-content:space-between;color:var(--ink);padding:14px 0}.detail-toggle strong{font-size:12px}.detail-toggle .muted{font-size:11px;color:#9ca69a;margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:56%}.detail-body{padding:0 0 14px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tfield{display:block;font-size:11px;color:#697c61;font-weight:650}.tfield input,.tfield textarea{display:block;width:100%;background:#fff;border:1px solid #d9e1d4;border-radius:9px;padding:11px 10px;margin-top:6px;font-size:13px;color:#2c3928}.tfield textarea{min-height:70px;resize:vertical}.wide{grid-column:1/-1}

.sections{padding-top:7px}.section{border:1px solid var(--line);border-radius:13px;background:#fff;overflow:hidden;margin:11px 0;box-shadow:0 6px 23px #2a352409}.section-head{width:100%;border:0;background:#fff;padding:16px 15px;display:flex;align-items:center;gap:12px;text-align:left;min-height:67px}.section-head .number{height:30px;width:30px;flex:0 0 30px;display:grid;place-items:center;background:var(--cream);color:#687d5d;font:normal 13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;border-radius:50%}.section-head .section-name{flex:1;font:normal 21px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;color:#293a27}.section-head .count{font-size:11px;color:#91a08c}.chevron{font-size:16px;color:#809476;transition:transform .12s}.section.expanded>.section-head .chevron,.nested.open>.nest-head .chevron,.option-field.open>.option-title .chevron{transform:rotate(180deg)}.section-body{border-top:1px solid #eff1eb;padding:6px 15px 15px}.option-field{border-bottom:1px solid #eef0eb}.option-field:last-child{border-bottom:0}.option-title{width:100%;border:0;background:#fff;color:var(--ink);padding:15px 0;display:flex;align-items:center;gap:9px;text-align:left}.option-title .index{font-size:10px;color:#b1bcb0;width:22px;flex-shrink:0}.option-title .label{font-size:12px;font-weight:650;flex:1}.answer{font-size:11px;color:#6b8362;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}.answer.empty{color:#bdc5b9}.option-area{padding:0 0 14px 30px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:12px;line-height:1.24;border:1px solid #d9e2d3;background:#f9faf7;border-radius:8px;padding:9px 11px;color:#4b6243;min-height:35px}.chip.selected{background:var(--green);border-color:var(--green);color:#fff}.chip.multi.selected{background:var(--selected);color:#3b5d34;border-color:#9db695}.chip:hover{border-color:#90a886}.flavour-list{border:1px solid #e9eee4;border-radius:10px;overflow:hidden}.neste /* Scoring and pricing */
.score-top{display:flex;align-items:baseline;justify-content:space-between;padding:12px 14px;background:var(--green);color:#fff;border-radius:10px;margin:10px 0 13px}.score-number{font:normal 35px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}.score-top small{font-size:11px;color:#d0dfca}.score-group{padding:12px 0;border-bottom:1px solid var(--line)}.score-group:last-child{border:0}.score-group-head{display:flex;align-items:center;justify-content:space-between;color:#4a6144;font-size:12px;font-weight:700;margin-bottom:10px}.score-field{display:grid;grid-template-columns:minmax(110px,1fr) auto;gap:8px;align-items:center;margin:12px 0}.score-field label{font-size:11px;color:#5c6d56}.score-options{display:flex;gap:5px}.score-options button{min-width:33px;padding:8px 6px;border-radius:6px;border:1px solid #d9e2d2;background:#f8faf6;color:#4d6046;font-size:11px}.score-options button.active{border-color:var(--green);background:var(--green);color:#fff}.price-set{padding:11px 0;border-bottom:1px solid #edf1e9}.price-set:last-child{border:0}.price-set label{font-size:12px;color:#4c6145;font-weight:650;display:block;margin-bottom:10px}.price-set .currency{color:#91a18b;font-size:10px;font-weight:500}.money{border:1px solid #dce4d6;border-radius:8px;padding:10px;font-size:13px;width:100%;max-width:220px;margin-top:9px}.finish-actions{display:flex;align-items:center;gap:10px;margin:19px 0 5px}.primary-button{border:1px solid var(--green);color:#fff;background:var(--green);border-radius:9px;padding:12px 17px;font-size:13px;font-weight:650}.outline-button{border:1px solid #b3c2aa;color:#48623f;background:white;border-radius:9px;padding:12px 17px;font-size:13px;font-weight:650}.finish-actions .primary-button{flex:1}.reveal-panel{margin:17px 0;background:var(--cream);border-radius:12px;padding:17px;border:1px solid #cbd7c4}.reveal-panel strong{font:normal 21px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;display:block;margin-bottom:14px}.reveal-panel .primary-button{width:100%}

@media(max-width:550px){.app-head{height:65px;padding:9px 15px}.wordmark{font-size:19px}.main{min-height:calc(100dvh - 65px);padding:0 16px 28px}.home{min-height:calc(100dvh - 65px)}.home-title{margin-top:29px;font-size:29px}.record-head{padding-top:21px}.record-head h2{font-size:29px}.field-grid{grid-template-columns:1fr}.photo-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.score-field{display:block}.score-options{justify-content:space-between;margin-top:7px}.score-options button{flex:1;min-width:0}.section-head{padding:14px 12px}.section-body{padding:5px 12px 15px}.option-area{padding-left:23px}.option-title .index{width:16px}.answer{max-width:39%}}
@media(max-width:360px){.wordmark{font-size:17px}.photo-tile{gap:6px}.photo-tile button{padding:8px}.section-head .section-name{font-size:19px}.chip{font-size:11px;padding:8px}.score-options button{padding:8px 3px}}

.section-head{gap:8px;padding-left:18px}.section-head .section-name{padding-left:0}.section-head .chevron{margin-left:auto}
.option-title{gap:9px}.option-area{padding-left:0}.section-body .option-field .option-title .label{font-size:13px}
.field-help{border:1px solid #e9eee4;border-radius:9px;padding:14px;color:#84937e;font-size:12px;background:#fbfcf9}
.score-title-en{display:block}.score-title-zh{font:normal 12px/1.4 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#7b8b73;margin-top:3px}

.selected-summary{font-size:11px;line-height:1.65;color:#687865;margin:6px 0 11px;word-break:break-word}
.mini-more{margin:9px 0;border:0;background:transparent;color:#526c49;font-size:12px;font-weight:650;padding:9px 5px}
.type-help{font-size:11px;color:#849280;margin:-6px 0 12px}
.label-scan{border:1px solid #d6dfd0;border-radius:12px;padding:12px 13px;margin:12px 0;background:#fff}

@media(max-width:520px){.recognition-fields{grid-template-columns:1fr}.recognition-card{padding:12px}.label-scan .label-actions button{flex:1}.quick-card{padding:10px}.section-head{min-height:50px}.option-title{min-height:44px}.chip{min-height:37px}}

/* Voice-first tasting, V1.6 */
.voice-card{margin:15px 0 16px;border:1px solid #b9c8b0;background:linear-gradient(145deg,#f9fbf6,#edf2e9);border-radius:15px;padding:16px;color:#31482e}
.voice-top{display:flex;align-items:flex-start;gap:12px}.voice-mark{display:grid;place-items:center;background:#dfe9d8;color:#3c5736;border-radius:12px;height:42px;width:42px;font-size:21px;flex:0 0 42px}
.voice-top h3{font-size:16px;letter-spacing:-.2px;margin:0 0 4px}.voice-top p{margin:0;font-size:11px;color:#6b7c65;line-height:1.55}
.voice-pill{font-size:10px;border:1px solid #cddac4;border-radius:50px;padding:4px 8px;white-space:nowrap;color:#5b7353;margin-left:auto}
.voice-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}

.voice-controls button.primary,.voice-actions button.primary{background:#374733;color:#fff;border-color:#374733}
.voice-controls button:disabled,.voice-actions button:disabled{opacity:.45}
.voice-clock{display:inline-block;margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:#526947}
.voice-language{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:11px;margin-top:11px;color:#667a60}
.voice-language select{background:#fff;border:1px solid #cad7c2;border-radius:8px;padding:7px 9px;color:#395333;font-size:12px;max-width:200px}
.voice-status{margin:10px 0 0;color:#596f51;font-size:11px;line-height:1.5}
.voice-live{margin:12px 0 0;background:#fff;border:1px dashed #b4c7ac;border-radius:10px;padding:11px;white-space:pre-wrap;min-height:46px;line-height:1.65;font-size:12px;color:#3d493a}
.voice-recording .voice-mark{background:#f4ddd7;color:#8a4235}.voice-recording .voice-clock{color:#a34736}
.voice-edit{display:block;width:100%;min-height:116px;resize:vertical;background:#fff;color:#31432c;border:1px solid #d0dcc8;border-radius:10px;padding:11px;margin:8px 0 10px;font-size:13px;line-height:1.6}
.voice-edit.summary{min-height:108px;background:#fafcf7}

.voice-actions{display:flex;gap:8px;flex-wrap:wrap;margin:7px 0 6px}
.voice-evidence{font-size:11px;color:#667762;margin:6px 0}.voice-suggestions{display:flex;flex-direction:column;gap:7px;margin:8px 0 12px}
.voice-suggest{display:flex;align-items:flex-start;gap:8px;font-size:12px;padding:8px 9px;background:#fff;border:1px solid #e0e9dc;border-radius:9px}
.voice-suggest input{width:16px;height:16px;accent-color:#475f3e;flex:none;margin:1px 0 0}
.voice-suggest small{font-size:10px;color:#84927e;display:block;margin-top:2px}
.voice-audio{width:100%;height:40px;margin:8px 0 0}.voice-footnote{margin:10px 0 0;color:#71836b;font-size:10px;line-height:1.7}

function normalise(note){
 const copy=JSON.parse(JSON.stringify(note));copy.fields??={};copy.score??={};copy.prices??={};copy.photo??=[];
 copy.producer??='';copy.wine??='';copy.grape??='';copy.region??='';copy.country??='';copy.appellation??='';copy.abv??='';copy.labelPhoto??='';copy.labelOcr??='';copy.sparklingBase??='White';copy.scoreBySchema??={};copy.vintage??='';copy.wineType??='';copy.revealed??=!copy.blind;

function permittedValues(key){
 if(!current.wineType)return null;
 for(const phase of ['nose','palate']){
  if(key.startsWith(`${phase}Fruit:`)){
   const cat=key.slice(`${phase}Fruit:`.length);return typeFamilies().includes(cat)?FRUIT[cat]||[]:[];
  }
  if(key.startsWith(`${phase}Non:Tertiary:`)){
   const style=current.wineType==='Sparkling'?(current.sparklingBase==='Red'?'Red':'White'):current.wineType==='Red'||current.wineType==='Rosé'?'Red':'White';
   return key===`${phase}Non:Tertiary:${style}`?TERTIARY[style]:[];
  }
  if(key.startsWith(`${phase}Non:`)){
   const cat=key.slice(`${phase}Non:`.length),group=nonfruitGroups().find(([c])=>cat===c);
   return group?[...group[1],...advancedTerms('Non',cat)]:null;
  }
  if(key===`${phase}WM:Secondary Aromas`)return secondarySensory();

   const cat=key.slice(`${phase}WM:`.length),g=technicalGroups().find(([c])=>c===cat);

  }
  if(key===`${phase}Other:Other Markers`)return otherTerms();

function visibleStored(key,value){

function composeOverallNote(){

   const dest=k.replace(/^nose/,'palate'),existing=current.fields[dest],allowed=visibleStored(k,v);
   if(!filled(allowed))continue;
   current.fields[dest]=Array.isArray(allowed)?[...new Set([...(Array.isArray(existing)?existing:[]),...allowed])]:allowed;count++;
  }
 }
 for(const [,k] of OAK){if(filled(val(k))){const dest=oakStorageKey('palate',k);current.fields[dest]=Array.isArray(val(k))?[...new Set([...(Array.isArray(val(dest))?val(dest):[]),...val(k)])]:val(k);count++}}

function summary(){
 const t=tally(),identified=!current.blind||current.revealed;
 let lines=['WINE TASTING JOURNAL · V1.6',formatDate(current.createdAt),current.blind?'Blind Tasting':'Open Tasting',`Wine Type: ${current.wineType||'—'}`];
 if(identified)lines.push(`Wine: ${titleFor(current)}`,`Country: ${current.country||'—'}`,`Region: ${current.region||'—'}`,`Appellation: ${current.appellation||'—'}`,`Grape: ${current.grape||'—'}`,`ABV: ${current.abv||'—'}`);
 else lines.push('Actual wine identity is hidden until Reveal');
 lines.push('');
 const groups=[['Sight',sightFields().concat(extraSightFields())],['Nose',NOSE_BASE],['Palate Structure',structureFields()],['Palate Markers',palateMarkerFields().concat(finishFields())]];
 if(current.blind)groups.push(['Initial Conclusion',INITIAL],['Final Conclusion',FINAL]);
 for(const [name,fieldKeys] of groups){lines.push('['+name+']');for(const [label,key] of fieldKeys){if(filled(visibleStored(key,val(key))))lines.push(label+': '+valText(visibleStored(key,val(key))))}lines.push('')}
 lines.push('[Fruit / Non-Fruit]');for(const [key,v] of Object.entries(current.fields)){
  if(key.includes('Fruit:')||key.includes('Non:')||key.includes('WM:')||key.includes('Other:')||OAK.some(([,k])=>key===k||key==='palate'+k[0].toUpperCase()+k.slice(1)))if(filled(visibleStored(key,v)))lines.push(key+': '+valText(visibleStored(key,v)));
 }
 if(filled(current.voice?.transcript))lines.push('[Voice Transcript]',current.voice.transcript,'');
 if(filled(current.voice?.summary))lines.push('[Voice Summary]',current.voice.summary,'');
 if(!current.blind&&filled(val('overallNote')))lines.push('Overall Tasting Note: '+val('overallNote'));
 if(!current.blind&&filled(val('qualityAssessment')))lines.push('Quality Assessment: '+val('qualityAssessment'));
 const extras=current.blind?['possibleGrape','possibleCountry','possibleRegion','guessGrape','guessCountry','guessRegion','guessVintage','guessQuality','evidence','noseFree','palateFree','finalConclusion']:['noseFree','palateFree'];
 for(const k of extras)if(filled(val(k)))lines.push(k+': '+valText(val(k)));
 lines.push('',`Quality Score: ${t.done?t.sum:'—'} / 100 (${t.done}/${t.count})`, `Estimated Price: ¥${current.prices.expectedRetail||'—'}`,`Buying Price: ¥${current.prices.willingPay||'—'}`,`Actual Price: ¥${identified?current.prices.realRetail||'—':'hidden'}`,`Would You Buy: ${current.prices.decision||'—'}`);
 return lines.join('\n');
}

async function compressPhoto(f){if(!f.type.startsWith('image/'))throw Error('Not An Image');return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('File Read Failed'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('Image Decode Failed'));img.onload=()=>{const scale=Math.min(1,960/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.76))};img.src=reader.result};reader.readAsDataURL(f)})}

// Free, on-device OCR using Tesseract.js; no paid browser automation or hosted API.
// The engine is loaded only when the user supplies a label. Wine Library matching
// works only if a verified catalogue has explicitly been provided to the page.
function cleanOcrText(t){return String(t||'').replace(/[^\S\n]+/g,' ').replace(/\n{3,}/g,'\n\n').trim().slice(0,20000)}
function parseLabelText(raw){
 const text=cleanOcrText(raw),lines=text.split(/\n/).map(l=>l.trim()).filter(Boolean).filter(l=>l.length>1);
 const matchedYear=(text.match(/\b(?:19[5-9]\d|20[0-3]\d)\b/g)||[]).map(Number).find(y=>y<=new Date().getFullYear()+1)||'';
 const abvMatch=text.match(/(?:alc(?:ohol)?\s*\.?\s*[:/]?\s*)(\d{1,2}(?:[.,]\d)?)\s*%?|(?:\b(\d{1,2}(?:[.,]\d)?)\s*%\s*(?:vol\b|alc\b)?)/i);
 const abv=abvMatch?String(abvMatch[1]||abvMatch[2]).replace(',','.')+'%':'';
 const explicitCountries=['France','Italy','Italia','Spain','España','Deutschland','Germany','Austria','Österreich','Portugal','United States','U.S.A.','USA','Argentina','Chile','South Africa','Australia','New Zealand','Uruguay','Greece','Hungary','China'];
 const countryMap={Italia:'Italy',España:'Spain',Deutschland:'Germany','Österreich':'Austria','U.S.A.':'United States',USA:'United States'};
 const countryWord=explicitCountries.find(w=>new RegExp('(^|[^a-z])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z]|$)','i').test(text))||'';
 const grapeVocabulary=['Cabernet Sauvignon','Cabernet Franc','Pinot Noir','Pinot Gris','Pinot Grigio','Chardonnay','Sauvignon Blanc','Riesling','Chenin Blanc','Gewürztraminer','Syrah','Shiraz','Merlot','Malbec','Sangiovese','Nebbiolo','Tempranillo','Gamay','Grenache','Garnacha','Viognier','Albariño','Albarino','Grüner Veltliner','Zinfandel','Primitivo','Carménère','Carmenere','Semillon','Sémillon','Meunier','Mourvèdre','Mourvedre','Pinot Meunier'];
 const grapes=grapeVocabulary.filter(w=>new RegExp('(^|[^A-Za-z])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^A-Za-z]|$)','i').test(text));
 const appellations=['Chablis','Sancerre','Pouilly-Fumé','Meursault','Puligny-Montrachet','Chassagne-Montrachet','Bourgogne','Châteauneuf-du-Pape','Saint-Émilion','Pauillac','Margaux','Pomerol','Champagne','Rioja','Ribera del Duero','Rías Baixas','Barolo','Barbaresco','Brunello di Montalcino','Chianti Classico','Valpolicella','Amarone della Valpolicella','Mosel','Rheingau','Wachau','Napa Valley','Sonoma Coast','Willamette Valley','Marlborough','Barossa Valley','Hunter Valley','Stellenbosch','Mendoza','Maipo Valley'];
 const appellation=appellations.find(w=>text.toLowerCase().includes(w.toLowerCase()))||'';
 // These are OCR candidates, not asserted wine facts. A label often has a producer
 // and a cuvée in different positions; we require explicit human confirmation.
 const meaningful=lines.filter(l=>!/\b(?:volume|product of|contains sulfites|imported by|bottled by|produced by|www\.|alc\.|750\s?ml)\b/i.test(l)&&!/^\d+\s*%/.test(l)&&!/^\d{4}$/.test(l));
 const maybeProducer=meaningful.find(l=>l.length>2&&l.length<70)||'';
 const maybeWine=(meaningful.find(l=>l!==maybeProducer&&l.length>2&&l.length<70)||'').replace(/\b(?:19[5-9]\d|20[0-3]\d)\b/g,'').trim();
 return {producer:maybeProducer,wine:maybeWine,vintage:String(matchedYear),country:countryMap[countryWord]||countryWord,region:'',appellation,grape:grapes.join(', '),abv,raw:text};
}
function normalizeMatch(v){return String(v||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function matchVerifiedWine(candidate){
 const list=window.SOMM100_VERIFIED_WINES;
 if(!Array.isArray(list)||!candidate.producer||!candidate.wine)return null;
 return list.find(w=>w?.verified===true&&normalizeMatch(w.producer)===normalizeMatch(candidate.producer)&&normalizeMatch(w.wine)===normalizeMatch(candidate.wine)&&(!candidate.vintage||!w.vintage||String(w.vintage)===String(candidate.vintage)))||null;
}
function candidateFromText(text){const info=parseLabelText(text),known=matchVerifiedWine(info);
 if(known){for(const key of ['grape','country','region','appellation'])if(!info[key]&&known[key])info[key]=String(known[key]);info.libraryMatch=true}
 else info.libraryMatch=false;
 return info;
}

}
async function loadOcrEngine(){
 if(window.Tesseract?.recognize)return window.Tesseract;
 await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.async=true;script.onload=resolve;script.onerror=()=>reject(new Error('OCR engine unavailable; internet required for initial load'));document.head.appendChild(script)});
 if(!window.Tesseract?.recognize)throw Error('OCR engine not available');
 return window.Tesseract;
}
async function scanLabelFile(file){

 if(!file.type.startsWith('image/')){toast('Please choose an image');return;}

  const image=await compressPhoto(file);
  current.labelPhoto=image;autoSave();
  const ocr=await loadOcrEngine();

  const content=cleanOcrText(result?.data?.text||'');
  current.labelOcr=content;pendingLabel=candidateFromText(content);autoSave();
  showRecognitionDialog();
 }catch(err){
  // Photo still available; never invent recognition results. Manual transcript
  // lets user continue without paid OCR services or network access.
  current.labelOcr??='';pendingLabel=candidateFromText(current.labelOcr);
  showRecognitionDialog();toast('OCR unavailable: enter or paste label text to continue');
 }finally{labelBusy=false}
}
function confirmLabelFields(){

 if(conflicting.length&&!confirm(`Overwrite previously filled ${conflicting.join(', ')}?`))return;

}

// Browser SpeechRecognition might use a third-party speech service; no audio,

const MAX_VOICE_MS=10*60*1000;
const SPEECH_ENGINE=()=>window.SpeechRecognition||window.webkitSpeechRecognition;
function voiceData(){if(!current.voice)current.voice={transcript:'',summary:'',language:'zh-CN',durationSec:0,mode:'',suggestions:[],analysisKind:'',generatedAt:''};return current.voice}
function clockVoice(ms){const s=Math.floor(Math.max(0,ms)/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

function voiceSuggestion(key,value,section,label,evidence){return {key,value,section,label,evidence,approved:true}}

 });if(!match)continue;

// On-page actions. All controls act on the currently opened tasting only.
head.addEventListener('click',async e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.back){if(screen==='settings')await goHome();else await goHome();return}if(button.dataset.goSettings)await showSettings()});
modalRoot.addEventListener('click',e=>{const button=e.target.closest('button'),d=button?.dataset||{};if(d.startMode){begin(d.startMode==='blind');return}if(d.photoAction){const target=d.photoAction==='camera'?'photoCamera':'photoImage';closeModal();document.getElementById(target).click();return}if(d.closeModal){closeModal();pendingLabel=null;return}if(d.reparse){const t=modalRoot.querySelector('textarea[data-ocr-text]');pendingLabel=candidateFromText(t?.value||'');showRecognitionDialog();return}if(d.confirmOcr){confirmLabelFields();return}if(e.target.classList.contains('overlay')){closeModal();pendingLabel=null}});
modalRoot.addEventListener('input',e=>{if(!pendingLabel)return;const k=e.target?.dataset?.ocr;if(k)pendingLabel[k]=e.target.value;else if(e.target.dataset.ocrText)pendingLabel.raw=e.target.value});
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.add){showModal('mode');return}
 if(d.openNote){await loadNote(d.openNote);return}
 if(d.photo){showModal('photo');return}
 if(d.removePhoto!==undefined){current.photo.splice(Number(d.removePhoto),1);autoSave();rerender(current.blind?'reveal':'');return}
 if(d.type){setWineType(d.type);return}
 if(d.base){setSparklingBase(d.base);return}
 if(d.clearIncompatible){clearIncompatible();return}
 if(d.voiceStart){await startVoiceRecording();return}
 if(d.voiceStop){await stopVoiceRecording();return}
 if(d.voicePause){pauseVoiceRecording();return}
 if(d.voiceAnalyze){deriveVoiceSummary();return}
 if(d.voiceApply){voiceApplyReview();return}
 if(d.voiceDownload){downloadVoiceRecording();return}
 if(d.voiceCopy){await copyText(voiceData().transcript||'');toast('Voice transcript copied');return}
 if(d.voiceDelete){if(!confirm('Delete saved audio? Transcript and summary will remain.'))return;await deleteVoiceAudio(current.id);voiceData().mode='transcript-only';autoSave();render();toast('Audio removed');return}
 if(d.label){if(d.label==='review'){pendingLabel=candidateFromText(current.labelOcr||'');showRecognitionDialog();return}document.getElementById(d.label==='camera'?'labelCamera':'labelImage').click();return}
 if(d.detail){ui.detailsOpen=!ui.detailsOpen;rerender();return}
 if(d.panel){ui.panels.has(d.panel)?ui.panels.delete(d.panel):ui.panels.add(d.panel);rerender('section-'+d.panel);return}
 if(d.field){ui.fields.has(d.field)?ui.fields.delete(d.field):ui.fields.add(d.field);rerender('field-'+d.field);return}
 if(d.cat){ui.categories.has(d.cat)?ui.categories.delete(d.cat):ui.categories.add(d.cat);rerender('cat-'+d.cat);return}
 if(d.chip){const k=d.chip,v=d.choice,isMulti=d.multi==='1';if(isMulti){const a=Array.isArray(val(k))?[...val(k)]:[];current.fields[k]=a.includes(v)?a.filter(x=>x!==v):[...a,v]}else{current.fields[k]=val(k)===v?'':v;ui.fields.delete(k)}autoSave();rerender(isMulti?(k.includes(':')?'cat-'+k:'section-'+(k.startsWith('palate')?'palate':'nose')):'field-'+k);return}
 if(d.more){ui.more.has(d.more)?ui.more.delete(d.more):ui.more.add(d.more);const phase=d.more.startsWith('nose')?'nose':d.more.startsWith('palate')?'palate':d.more==='sight'?'sight':'nose';rerender('section-'+phase);return}
 if(d.notes){ui.notes.has(d.notes)?ui.notes.delete(d.notes):ui.notes.add(d.notes);rerender('section-'+(d.notes==='initial'||d.notes==='final'?d.notes:d.notes==='price'?'price':d.notes));return}
 if(d.confirmNose){copyNose();return}
 if(d.composeNote){composeOverallNote();return}
 if(d.score){const v=Number(d.scorevalue);current.score[d.score]=current.score[d.score]===v?undefined:v;autoSave();rerender('section-score');return}
 if(d.pricechip){current.prices[d.pricechip]=Number(d.pricevalue);autoSave();rerender('section-price');return}
 if(d.decision){current.prices.decision=current.prices.decision===d.decision?'':d.decision;autoSave();rerender('section-price');return}
 if(d.reveal){if(!confirm('Reveal the actual wine and show label-identifying details?'))return;current.revealed=true;autoSave();rerender('reveal');return}
 if(d.copy){await copyText(summary());toast('Copied');return}
 if(d.save){if(voiceSession)await stopVoiceRecording('save');current.completed=true;await flush();await goHome();toast('Tasting Saved');return}
 if(d.deleteCurrent){if(confirm('Delete This Tasting?')){if(voiceSession)await stopVoiceRecording('delete');await deleteNote(current.id);current=null;await goHome()}return}
 if(d.export){await exportData();return}
});
app.addEventListener('input',e=>{const target=e.target;const d=target.dataset;
 if(d.voiceTranscript!==undefined){voiceData().transcript=target.value;voiceData().generatedAt='';voiceData().dirty=true;autoSave();return}
 if(d.voiceSummary!==undefined){voiceData().summary=target.value;autoSave();return}
 if(d.voiceSuggest!==undefined){voiceData().suggestions[Number(d.voiceSuggest)].approved=!!target.checked;autoSave();return}
 if(d.input!==undefined){if(d.location==='note')current[d.input]=target.value;else current.fields[d.input]=target.value;autoSave();return}
 if(d.textarea!==undefined){if(d.textarea==='priceNotes')current.prices.notes=target.value;else current.fields[d.textarea]=target.value;autoSave();return}
 if(d.price!==undefined){current.prices[d.price]=target.value;autoSave();return}
 if(target.id==='searchTastings'){searchText=target.value;const pos=target.selectionStart;renderHome();const newInput=document.getElementById('searchTastings');newInput?.focus();newInput?.setSelectionRange(pos,pos)}
});
app.addEventListener('change',async e=>{if(e.target.dataset?.voiceLanguage!==undefined){voiceData().language=e.target.value==='en-US'?'en-US':'zh-CN';autoSave();return}if(e.target.id==='importInput'){if(e.target.files?.[0])await importData(e.target.files[0]);e.target.value=''}});
for(const input of ['photoCamera','photoImage'])document.getElementById(input).addEventListener('change',async e=>{if(e.target.files?.length)await addPhotos(e.target.files);e.target.value=''});
for(const input of ['labelCamera','labelImage'])document.getElementById(input).addEventListener('change',async e=>{if(e.target.files?.length)await scanLabelFile(e.target.files[0]);e.target.value=''});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateVoiceDisplay()});
(async()=>{try{db=await openDB()}catch(err){db=null}try{await refreshNotes()}catch(err){notes=[];toast('Local Storage Unavailable')}render()})().catch(err=>{notes=[];render();toast('Startup Error: '+err.message)});
</script>
</body>
</html>
